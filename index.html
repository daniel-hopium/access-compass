  css:`.mo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:4px 20px}.mo-grid .chain{margin-top:6px}.mo-grid .chain-node{flex-basis:70px}`,
  demoTitle:tx('Eine Frage, vier Modelle','One question, four models'),demoHint:tx('„Darf die Person oben diese Rechnung freigeben?“','“May the person at the top approve this invoice?”'),
  demo:`<div class="field" style="max-width:24rem"><label for="mo-inv">${tx('Rechnung','Invoice')}</label><select id="mo-inv">${INVOICES.map(i=>`<option value="${i.id}"${i.id==='R-1003'?' selected':''}>${i.id} · ${TEAMS[i.team]} · ${eur(i.amount)} · ${STATUS[i.status]}</option>`).join('')}</select></div><div id="mo-out"></div>`,
  init(root){
    const out=$('#mo-out',root);
    const run=()=>{const p=persona(),inv=INVOICES.find(i=>i.id===$('#mo-inv',root).value);
      const rb=can('invoice:approve',p);
      const ab=defaultCheck('invoice:approve',inv,p);
      const rel=p.roles.includes('TEAM_LEAD')&&p.team===inv.team;
      const row=(m,ok,how)=>[m,ok?`<span class="yes">${tx('ja','yes')}</span>`:`<span class="no">${tx('nein','no')}</span>`,how];
      out.innerHTML=table([tx('Modell','Model'),tx('Antwort','Answer'),tx('Begründung','Reasoning')],[
        row('RBAC',rb,rb?tx('Rolle TEAM_LEAD enthält invoice:approve. <b>Mehr schaut RBAC nicht an</b> – Team, Betrag und Ersteller sind ihm egal.','Role TEAM_LEAD contains invoice:approve. <b>RBAC looks at nothing more</b> – team, amount and creator don’t matter to it.'):tx('Keine Rolle mit invoice:approve.','No role with invoice:approve.')),
        row('ABAC',ab.ok,ab.ok?tx('Alle Regeln erfüllt: eigenes Team, im Limit, nicht selbst erstellt, eingereicht.','All rules satisfied: own team, within limit, not self-created, submitted.'):ab.why),
        row('PBAC',ab.ok,ab.ok?tx('Policy <code>approve-own-team</code> erlaubt, keine forbid-Policy greift.','Policy <code>approve-own-team</code> permits, no forbid policy applies.'):tx(`Default deny bzw. forbid-Policy: ${ab.why}`,`Default deny or a forbid policy: ${ab.why}`)),
        row('ReBAC',rel,rel?tx(`Pfad gefunden: user:${p.id} → team:${inv.team}#lead → invoice:${inv.id}#approver. (Limit und 4-Augen braucht zusätzlich eine Bedingung.)`,`Path found: user:${p.id} → team:${inv.team}#lead → invoice:${inv.id}#approver. (Limit and four eyes additionally need a condition.)`):tx(`Kein Pfad von user:${p.id} zu invoice:${inv.id}#approver.`,`No path from user:${p.id} to invoice:${inv.id}#approver.`))
      ],{caption:tx('Antworten der Modelle','Answers of the models')})};
    $('#mo-inv',root).addEventListener('change',run);return onPersona(run);
  },
  after:tx('<p><b>Probier:</b> Tom und R-1003 (12 800 €). RBAC sagt ja, ABAC sagt nein – genau dort liegt der Unterschied. Darum endet die Praxis fast immer bei „RBAC für das Grobe, Bedingungen für das Feine“.</p>','<p><b>Try:</b> Tom and R-1003 (€12,800). RBAC says yes, ABAC says no – that’s exactly where the difference lies. That’s why practice almost always ends at “RBAC for the coarse, conditions for the fine”.</p>'),
  do:tx(['Mit RBAC anfangen und bewusst entscheiden, wo es nicht reicht.','Modelle kombinieren: Rollen für Funktionen, Attribute oder Beziehungen für Objekte.','Das Modell nach der Fachfrage wählen, nicht nach dem Trend.'],['Start with RBAC and decide consciously where it doesn’t suffice.','Combine models: roles for functions, attributes or relationships for objects.','Pick the model by the business question, not by the trend.']),
  dont:tx(['Objektregeln mit immer neuen Rollen nachbilden.','Gleich eine Policy-Engine einführen, wenn drei Rollen reichen.','Ein Modell „rein“ durchziehen, wenn die Fachlichkeit gemischt ist.'],['Emulate object rules with ever more roles.','Introduce a policy engine right away when three roles are enough.','Push one model through “purely” when the domain is mixed.']),
  why:tx('<p>Die Modelle sind keine Konkurrenten, sondern Werkzeuge für verschiedene Teile derselben Frage. RBAC beantwortet „welche Art von Mitarbeiter bist du?“, ABAC „unter welchen Umständen?“, ReBAC „in welcher Beziehung stehst du zu diesem Ding?“, PBAC „wo und wie schreiben wir das auf?“. Wer das trennt, versteht auch, warum ein Werkzeug allein selten reicht.</p>','<p>The models aren’t competitors but tools for different parts of the same question. RBAC answers “what kind of employee are you?”, ABAC “under which circumstances?”, ReBAC “how are you related to this thing?”, PBAC “where and how do we write it down?”. Separating these also explains why one tool alone rarely suffices.</p>')
});

LESSONS.push({
  id:'rbac',cat:'models',
  title:tx('RBAC: Rollen bündeln Rechte','RBAC: roles bundle rights'),
  short:tx('Benutzer → Rolle → Permission, als Matrix zum Bearbeiten.','User → role → permission, as an editable matrix.'),
  keys:'rbac role based access control rolle role permission matrix zuordnung assignment user role permission core rbac',
  refs:[['NIST RBAC Model (ANSI INCITS 359)','https://csrc.nist.gov/projects/role-based-access-control'],['Spring: hasRole / hasAuthority','https://docs.spring.io/spring-security/reference/servlet/authorization/authorize-http-requests.html']],
  rule:tx('Bei RBAC bekommen Benutzer <b>Rollen</b>, Rollen bekommen <b>Permissions</b>. Ein Benutzer darf eine Aktion, wenn mindestens eine seiner Rollen die passende Permission enthält. Die Zuordnung Rolle → Permission ist eine Tabelle, die Fachabteilung und Revision lesen können – das ist RBACs größte Stärke.','In RBAC users get <b>roles</b>, roles get <b>permissions</b>. A user may perform an action if at least one of their roles contains the matching permission. The role → permission mapping is a table that business and auditors can read – that’s RBAC’s greatest strength.'),
  glance:{rows:[
    ['User Assignment',tx('Welcher Benutzer hat welche Rollen (im IdP, oft über Gruppen).','Which user has which roles (in the IdP, often via groups).')],
    ['Permission Assignment',tx('Welche Rolle enthält welche Permissions (in Konfiguration oder Datenbank).','Which role contains which permissions (in configuration or a database).')],
    [tx('Effektive Rechte','Effective rights'),tx('Vereinigung der Permissions aller Rollen eines Benutzers.','Union of the permissions of all of a user’s roles.')],
    ['Core RBAC',tx('Die Grundform. Erweiterungen: Hierarchie (nächste Lektion) und Constraints (Funktionstrennung).','The basic form. Extensions: hierarchy (next lesson) and constraints (separation of duties).')],
    [tx('Wo es aufhört','Where it ends'),tx('„Nur eigenes Team“, „bis 5000 €“ – das sind keine Rollen, sondern Bedingungen.','“Own team only”, “up to €5,000” – those aren’t roles, they’re conditions.')]
  ]},
  body:tx(chain([['Bea','User'],['ACCOUNTANT','Role','brand'],['invoice:pay','Permission','good'],['POST /pay','Operation']],['hat','enthält','erlaubt']),chain([['Bea','User'],['ACCOUNTANT','Role','brand'],['invoice:pay','Permission','good'],['POST /pay','Operation']],['has','contains','allows'])),
  demoHint:tx('Bearbeite die Matrix – die Zeile der Person oben ist markiert.','Edit the matrix – the row of the person at the top is highlighted.'),
  demo:`<div class="table-wrap" tabindex="0" role="region" aria-label="${tx('Rollen-Permission-Matrix','Role permission matrix')}"><table class="matrix" id="rb-m"></table></div>
<div class="row"><div class="field"><label for="rb-perm">${tx('Prüfe für die Person oben','Check for the person at the top')}</label><select id="rb-perm">${PERMS.map(([k])=>`<option>${k}</option>`).join('')}</select></div><button type="button" class="btn btn-ghost" id="rb-reset">${ic('refresh')}${tx('Matrix zurücksetzen','Reset matrix')}</button></div>
<div id="rb-out"></div>`,
  init(root){
    let M;const reset=()=>{M=Object.fromEntries(Object.entries(ROLES).map(([r,v])=>[r,new Set(v.perms)]))};reset();
    const draw=()=>{const p=persona();
      $('#rb-m',root).innerHTML=`<caption class="sr-only">${tx('Rollen und Permissions','Roles and permissions')}</caption><thead><tr><th scope="col">${tx('Rolle','Role')}</th>${PERMS.map(([k])=>`<th scope="col"><span>${k}</span></th>`).join('')}</tr></thead><tbody>${Object.keys(ROLES).map(r=>`<tr class="${p.roles.includes(r)?'is-hl':''}"><th scope="row">${ROLES[r].label}</th>${PERMS.map(([k])=>`<td><input type="checkbox" data-r="${r}" data-p="${k}" aria-label="${ROLES[r].label}: ${k}" ${M[r].has(k)?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody>`;
      const perm=$('#rb-perm',root).value,via=p.roles.filter(r=>M[r].has(perm));
      $('#rb-out',root).innerHTML=p.roles.length?(via.length?verdict(true,tx(`${p.name} darf ${perm}`,`${p.name} may ${perm}`),tx(`über die Rolle ${via.map(r=>ROLES[r].label).join(', ')}`,`via the role ${via.map(r=>ROLES[r].label).join(', ')}`)):verdict(false,tx(`${p.name} darf ${perm} nicht`,`${p.name} may not ${perm}`),tx(`Keine der Rollen (${roleLabel(p)}) enthält die Permission.`,`None of the roles (${roleLabel(p)}) contains the permission.`))):verdict(false,tx('Gast hat keine Rollen','Guest has no roles'))};
    root.addEventListener('change',e=>{const c=e.target.closest('input[data-r]');if(c){M[c.dataset.r][c.checked?'add':'delete'](c.dataset.p)}draw()});
    $('#rb-reset',root).addEventListener('click',()=>{reset();draw()});
    return onPersona(draw);
  },
  css:`#rb-m thead th span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:9rem}`,
  code:[
    {t:tx('Spring: Rollen auf Permissions abbilden (eigene Tabelle)','Spring: mapping roles to permissions (own table)'),lang:'java',src:`@Component
class RolePermissions {
  private static final Map<String, Set<String>> MATRIX = Map.of(
      "VIEWER",     Set.of("invoice:read", "report:read"),
      "TEAM_LEAD",  Set.of("invoice:read", "invoice:approve", "report:read"),
      "ACCOUNTANT", Set.of("invoice:read", "invoice:create", "invoice:edit",
                           "invoice:pay", "invoice:export", "report:read"),
      "ADMIN",      Set.of("invoice:read", "user:manage", "audit:read"));

  Set<GrantedAuthority> authoritiesFor(Collection<String> roles) {
    return roles.stream()
        .flatMap(r -> MATRIX.getOrDefault(r, Set.of()).stream())
        .map(SimpleGrantedAuthority::new)
        .collect(toSet());
  }
}`,note:tx('In größeren Systemen steht die Matrix in einer Datenbanktabelle mit Admin-Oberfläche – oder die Rollen im IdP enthalten die Permissions direkt als Composite-Client-Rollen.','In larger systems the matrix lives in a database table with an admin UI – or the roles in the IdP contain the permissions directly as composite client roles.')},
    {t:'Angular',lang:'ts',src:`readonly permissions = computed(() => new Set(this.me()?.permissions ?? []));
can(p: Permission): boolean { return this.permissions().has(p); }`}
  ],
  do:tx(['Wenige, fachlich benannte Rollen, die echten Jobs entsprechen.','Die Matrix als lesbares Artefakt pflegen (Tabelle, Code, Export).','Rollen über Gruppen im IdP zuweisen.'],['Few roles with business names that match real jobs.','Keep the matrix as a readable artifact (table, code, export).','Assign roles via groups in the IdP.']),
  dont:tx(['Eine Rolle pro Person („ROLE_TOM“).','Rollen für Bedingungen erfinden („TEAM_LEAD_SALES_UNDER_5000“).','Eine Gott-Rolle, die alles enthält.'],['One role per person (“ROLE_TOM”).','Invent roles for conditions (“TEAM_LEAD_SALES_UNDER_5000”).','A god role that contains everything.']),
  why:tx('<p>RBAC ist seit den 1990ern Standard, weil es zur Art passt, wie Organisationen denken: in Jobs. Eine Revisorin kann die Matrix lesen und fragen „warum darf die Teamleitung exportieren?“ – bei verstreuten <code>if</code>-Abfragen im Code ist das unmöglich.</p>','<p>RBAC has been standard since the 1990s because it fits how organizations think: in jobs. An auditor can read the matrix and ask “why may team leads export?” – impossible with <code>if</code> checks scattered through the code.</p>')
});

LESSONS.push({
  id:'rbac-hierarchy',cat:'models',
  title:tx('Rollenhierarchie','Role hierarchy'),
  short:tx('Rollen erben Rechte voneinander – praktisch, aber mit Vorsicht.','Roles inherit rights from each other – handy, but careful.'),
  keys:'rollenhierarchie role hierarchy vererbung inheritance composite role senior junior roleHierarchy spring',
  refs:[['Spring Security: Hierarchical Roles','https://docs.spring.io/spring-security/reference/servlet/authorization/architecture.html#authz-hierarchical-roles']],
  rule:tx('In einer <b>Rollenhierarchie</b> erbt eine höhere Rolle alle Permissions der darunterliegenden: Teamleitung ⊇ Viewer. Das spart Wiederholung in der Matrix. Aber: Jede Kante vererbt <i>alles</i> – eine Hierarchie nach Organigramm („Chefin erbt von allen“) macht aus Vorgesetzten schnell Superuser.','In a <b>role hierarchy</b> a senior role inherits all permissions of the junior ones below it: team lead ⊇ viewer. That saves repetition in the matrix. But: every edge inherits <i>everything</i> – a hierarchy along the org chart (“the boss inherits from everyone”) quickly turns managers into superusers.'),
  glance:{rows:[
    [tx('Senior / Junior','Senior / junior'),tx('Die erbende (höhere) und die vererbende Rolle.','The inheriting (senior) and the inherited (junior) role.')],
    [tx('Composite-Rolle','Composite role'),tx('So heißt es in Keycloak: eine Rolle, die andere Rollen enthält.','Keycloak’s name for it: a role that contains other roles.')],
    ['<code>RoleHierarchy</code>',tx('Spring-Bean, die beim Prüfen von <code>hasRole</code>/<code>hasAuthority</code> die geerbten Authorities ergänzt.','Spring bean that adds inherited authorities when checking <code>hasRole</code>/<code>hasAuthority</code>.')],
    [tx('Funktions- statt Organigramm-Hierarchie','Functional rather than org chart hierarchy'),tx('Vererben, weil die Aufgabe die andere umfasst – nicht, weil jemand höher steht.','Inherit because the job includes the other one – not because someone ranks higher.')]
  ]},
  demoHint:tx('Schalte Vererbungen an und sieh, woher jedes Recht kommt.','Turn on inheritance edges and see where each right comes from.'),
  demo:`<div class="two"><fieldset class="panel"><legend style="font-weight:700">${tx('Kanten','Edges')}</legend>
  <label class="check-row"><input type="checkbox" data-e="TEAM_LEAD>VIEWER" checked><span>TEAM_LEAD → VIEWER</span></label>
  <label class="check-row"><input type="checkbox" data-e="ACCOUNTANT>VIEWER" checked><span>ACCOUNTANT → VIEWER</span></label>
  <label class="check-row"><input type="checkbox" data-e="CFO>TEAM_LEAD"><span>CFO → TEAM_LEAD</span></label>
  <label class="check-row"><input type="checkbox" data-e="CFO>ACCOUNTANT"><span>CFO → ACCOUNTANT</span></label>
  <label class="check-row"><input type="checkbox" data-e="ADMIN>CFO"><span>ADMIN → CFO ${tx('(Organigramm-Denken)','(org chart thinking)')}</span></label>
</fieldset><div class="field"><label for="rh-role">${tx('Rolle','Role')}</label><select id="rh-role"><option>VIEWER</option><option selected>TEAM_LEAD</option><option>ACCOUNTANT</option><option>CFO</option><option>ADMIN</option></select><div id="rh-out"></div></div></div>`,
  init(root){
    const OWN={VIEWER:['invoice:read','report:read'],TEAM_LEAD:['invoice:approve'],ACCOUNTANT:['invoice:create','invoice:edit','invoice:pay','invoice:export'],CFO:['invoice:delete'],ADMIN:['user:manage','audit:read']};
    const run=()=>{const edges=$$('input[data-e]:checked',root).map(c=>c.dataset.e.split('>'));
      const res=new Map();const walk=(r,path)=>{(OWN[r]||[]).forEach(p=>{if(!res.has(p))res.set(p,path)});edges.filter(([s])=>s===r).forEach(([,j])=>{if(!path.includes(j))walk(j,[...path,j])})};
      const role=$('#rh-role',root).value;walk(role,[role]);
      $('#rh-out',root).innerHTML=`<ul class="trace" style="margin-top:10px">${[...res].map(([p,path])=>`<li class="t-ok">${ic('ok')}<span><code>${p}</code> <span class="hint">${path.length>1?tx('geerbt über ','inherited via ')+path.join(' → '):tx('eigene','own')}</span></span></li>`).join('')}</ul><p class="hint">${tx(`${res.size} von ${PERMS.length} Permissions`,`${res.size} of ${PERMS.length} permissions`)}</p>`+(role==='ADMIN'&&res.has('invoice:pay')?verdict(false,tx('Ada kann jetzt Rechnungen bezahlen und löschen.','Ada can now pay and delete invoices.'),tx('Eine Kante nach Organigramm hat aus „verwaltet Benutzer“ einen Superuser gemacht.','One org chart edge turned “manages users” into a superuser.')):'')};
    root.addEventListener('change',run);run();
  },
  code:[{t:tx('Spring Security: RoleHierarchy','Spring Security: RoleHierarchy'),lang:'java',src:`@Bean
static RoleHierarchy roleHierarchy() {
  return RoleHierarchyImpl.fromHierarchy("""
      ROLE_TEAM_LEAD > ROLE_VIEWER
      ROLE_ACCOUNTANT > ROLE_VIEWER
      """);
}
// Picked up by authorizeHttpRequests and method security (@PreAuthorize):
// hasRole('VIEWER') is now also true for team leads and accounting.`,note:tx('Für Method Security die Bean <code>static</code> deklarieren, damit sie früh genug existiert. Die Hierarchie wirkt auf Rollen und Authorities gleichermaßen.','Declare the bean <code>static</code> for method security so it exists early enough. The hierarchy applies to roles and authorities alike.')}],
  do:tx(['Hierarchien flach halten (zwei, drei Ebenen).','Nur vererben, wenn die höhere Aufgabe die niedrigere fachlich umfasst.','Effektive Rechte jeder Rolle sichtbar machen (wie in der Demo).'],['Keep hierarchies flat (two, three levels).','Only inherit when the senior job really includes the junior one.','Make every role’s effective rights visible (as in the demo).']),
  dont:tx(['Das Organigramm als Rollenhierarchie abbilden.','Admin-Rollen von Fachrollen erben lassen.','Zyklen bauen (A → B → A).'],['Mirror the org chart as a role hierarchy.','Let admin roles inherit from business roles.','Build cycles (A → B → A).']),
  why:tx('<p>Die Hierarchie ist eine Abkürzung beim Schreiben der Matrix – aber eine, die man beim Lesen leicht übersieht. Wer nur „ADMIN → CFO“ sieht, ahnt nicht, dass daraus „Admin darf bezahlen“ folgt. Darum gilt: Jede Kante muss eine fachliche Begründung haben, und die effektiven Rechte gehören in jeden Review.</p>','<p>The hierarchy is a shortcut when writing the matrix – but one that’s easy to overlook when reading. Whoever only sees “ADMIN → CFO” doesn’t suspect it means “admin may pay”. Hence: every edge needs a business reason, and effective rights belong in every review.</p>')
});

LESSONS.push({
  id:'rbac-sod',cat:'models',
  title:tx('Funktionstrennung und Vier-Augen-Prinzip','Separation of duties and the four-eyes principle'),
  short:tx('Wer anlegt, gibt nicht frei. Wer freigibt, bezahlt nicht.','Whoever creates doesn’t approve. Whoever approves doesn’t pay.'),
  keys:'separation of duties sod funktionstrennung vier augen four eyes static dynamic ssd dsd constrained rbac konflikt conflict compliance',
  refs:[['NIST RBAC: Constrained RBAC (SSD/DSD)','https://csrc.nist.gov/projects/role-based-access-control/faqs']],
  rule:tx('<b>Funktionstrennung</b> (Separation of Duties) verhindert, dass eine Person einen kritischen Vorgang allein durchziehen kann. <b>Statisch</b>: Zwei Rollen dürfen nie derselben Person gehören (etwa Freigeben und Bezahlen). <b>Dynamisch</b>: Jemand darf beide Rollen haben, aber nicht beide Schritte am <i>selben</i> Vorgang ausführen – das Vier-Augen-Prinzip.','<b>Separation of duties</b> prevents a single person from pushing a critical process through alone. <b>Static</b>: two roles may never belong to the same person (e.g. approving and paying). <b>Dynamic</b>: someone may hold both roles, but may not perform both steps on the <i>same</i> case – the four-eyes principle.'),
  glance:{rows:[
    ['SSD',tx('Static Separation of Duty: Konflikt bei der Rollenvergabe. Wird beim Zuweisen geprüft.','Static separation of duty: conflict at role assignment. Checked when assigning.')],
    ['DSD',tx('Dynamic Separation of Duty: Konflikt pro Vorgang. Wird bei der Aktion geprüft.','Dynamic separation of duty: conflict per case. Checked at the action.')],
    [tx('Vier-Augen-Prinzip','Four-eyes principle'),tx('Zwei verschiedene Personen für einen kritischen Vorgang.','Two different people for one critical process.')],
    [tx('Bei Nordwind','At Nordwind'),tx('Anlegen → Freigeben → Bezahlen: drei Schritte, mindestens zwei Personen.','Create → approve → pay: three steps, at least two people.')]
  ]},
  demoHint:tx('Erst Rollen vergeben (statisch), dann einen Vorgang durchspielen (dynamisch).','First assign roles (static), then play through a case (dynamic).'),
  demo:`<div class="two"><div class="panel"><h3>${tx('Statisch: Rollen für Bea','Static: roles for Bea')}</h3>
  ${['ACCOUNTANT','TEAM_LEAD','VIEWER'].map((r,i)=>`<label class="check-row"><input type="checkbox" data-sod="${r}" ${i===0?'checked':''}>${ROLES[r].label}</label>`).join('')}
  <div id="sod-s"></div></div>
<div class="panel"><h3>${tx('Dynamisch: Rechnung R-1006','Dynamic: invoice R-1006')}</h3>
  ${[['c',tx('Angelegt von','Created by')],['a',tx('Freigegeben von','Approved by')],['p',tx('Bezahlt von','Paid by')]].map(([k,l])=>`<div class="field"><label for="sod-${k}">${l}</label><select id="sod-${k}">${['bea','tom','ada'].map(id=>`<option value="${id}"${(k==='c'&&id==='bea')||(k==='a'&&id==='tom')||(k==='p'&&id==='bea')?' selected':''}>${PERSONA_BY[id].name}</option>`).join('')}</select></div>`).join('')}
  <div id="sod-d"></div></div></div>`,
  init(root){
    const run=()=>{const rs=$$('input[data-sod]:checked',root).map(c=>c.dataset.sod);
      $('#sod-s',root).innerHTML=rs.includes('ACCOUNTANT')&&rs.includes('TEAM_LEAD')?verdict(false,tx('Konflikt: Buchhaltung + Teamleitung','Conflict: accounting + team lead'),tx('Bea könnte anlegen, freigeben und bezahlen. Die Zuweisung wird abgelehnt.','Bea could create, approve and pay. The assignment is rejected.')):verdict(true,tx('Keine Konfliktrollen','No conflicting roles'));
      const c=$('#sod-c',root).value,a=$('#sod-a',root).value,p=$('#sod-p',root).value,errs=[];
      if(c===a)errs.push(tx('Ersteller gibt selbst frei.','Creator approves themselves.'));
      if(a===p)errs.push(tx('Freigeber bezahlt selbst.','Approver pays themselves.'));
      if(!PERSONA_BY[a].roles.includes('TEAM_LEAD'))errs.push(tx(`${PERSONA_BY[a].name} hat kein invoice:approve.`,`${PERSONA_BY[a].name} has no invoice:approve.`));
      if(!PERSONA_BY[p].roles.includes('ACCOUNTANT'))errs.push(tx(`${PERSONA_BY[p].name} hat kein invoice:pay.`,`${PERSONA_BY[p].name} has no invoice:pay.`));
      $('#sod-d',root).innerHTML=errs.length?verdict(false,tx('Abgelehnt','Rejected'),errs.join(' ')):verdict(true,tx('Vier Augen eingehalten','Four eyes respected'),c===p?tx('Bea legt an und bezahlt – erlaubt, weil Tom dazwischen freigibt.','Bea creates and pays – allowed because Tom approves in between.'):'')};
    root.addEventListener('change',run);run();
  },
  lang:'java',
  good:{code:`// dynamic SoD lives in the policy – it needs the invoice
public boolean canApprove(UserPrincipal u, Invoice inv) {
  return u.has("invoice:approve")
      && !inv.getCreatedBy().equals(u.id());          // four eyes
}
public boolean canPay(UserPrincipal u, Invoice inv) {
  return u.has("invoice:pay")
      && inv.getStatus() == APPROVED
      && !inv.getApprovedBy().equals(u.id());         // approver ≠ payer
}

// static SoD belongs where roles are assigned (IdP, admin service)
static final Set<Set<String>> CONFLICTS = Set.of(Set.of("ACCOUNTANT", "TEAM_LEAD"));`,note:tx('Statische Konflikte prüft Keycloak nicht von selbst – das übernimmt der Prozess der Rollenvergabe (Identity Governance) oder ein eigener Admin-Dienst.','Keycloak doesn’t check static conflicts on its own – that’s the job of the role assignment process (identity governance) or your own admin service.')},
  do:tx(['Kritische Abläufe (Geld, Rechte, Daten löschen) auf mindestens zwei Personen verteilen.','Dynamische Prüfungen in der Policy, mit dem Objekt als Eingabe.','Wer was getan hat, am Objekt speichern (<code>createdBy</code>, <code>approvedBy</code>).'],['Spread critical processes (money, rights, deleting data) across at least two people.','Dynamic checks in the policy, with the object as input.','Store who did what on the object (<code>createdBy</code>, <code>approvedBy</code>).']),
  dont:tx(['Funktionstrennung nur organisatorisch („machen wir halt nicht“).','Admins von der Vier-Augen-Regel ausnehmen.','Den Ersteller per Request-Parameter übernehmen statt aus dem Token.'],['Separation of duties only by convention (“we just don’t do that”).','Exempt admins from the four-eyes rule.','Take the creator from a request parameter instead of the token.']),
  why:tx('<p>Die meisten Betrugsfälle in Unternehmen brauchen genau eine Person, die mehrere Schritte allein ausführen kann. Funktionstrennung ist darum in vielen Branchen Pflicht (internes Kontrollsystem, SOX, Bankenaufsicht). Technisch ist die dynamische Variante eine Bedingung über Attribute des Objekts – hier sieht man schön, wo reines RBAC endet.</p>','<p>Most corporate fraud needs exactly one person who can perform several steps alone. That’s why separation of duties is mandatory in many industries (internal control systems, SOX, banking supervision). Technically, the dynamic variant is a condition over the object’s attributes – a nice spot to see where pure RBAC ends.</p>')
});

LESSONS.push({
  id:'role-explosion',cat:'models',
  title:tx('Rollen-Explosion','Role explosion'),
  short:tx('Wenn jede Bedingung eine neue Rolle braucht – und wie Attribute das auffangen.','When every condition needs a new role – and how attributes absorb it.'),
  keys:'role explosion rollen explosion rbac grenzen limits attribute abac kombinatorik combinatorics',
  refs:[['NIST SP 800-162: ABAC (Abschnitt RBAC-Grenzen)','https://csrc.nist.gov/pubs/sp/800/162/upd2/final']],
  rule:tx('Sobald Rechte von Merkmalen abhängen – Team, Region, Betragsgrenze –, braucht reines RBAC für jede Kombination eine eigene Rolle. Die Zahl wächst multiplikativ: 8 Teams × 3 Regionen × 4 Limits = 96 Rollen nur für die Freigabe. Die Lösung ist nicht mehr Rollen, sondern <b>eine Rolle plus Bedingungen</b> über Attribute.','As soon as rights depend on characteristics – team, region, amount limit – pure RBAC needs a separate role for every combination. The number grows multiplicatively: 8 teams × 3 regions × 4 limits = 96 roles just for approval. The solution isn’t more roles but <b>one role plus conditions</b> over attributes.'),
  glance:{rows:[
    [tx('Rollen-Explosion','Role explosion'),tx('Rollen kodieren Daten (Team, Region, Limit) statt Aufgaben.','Roles encode data (team, region, limit) instead of jobs.')],
    [tx('Symptom','Symptom'),tx('Rollennamen wie <code>APPROVER_SALES_EAST_10K</code>, hunderte Rollen, niemand weiß mehr, wer was darf.','Role names like <code>APPROVER_SALES_EAST_10K</code>, hundreds of roles, nobody knows who may do what anymore.')],
    [tx('Ausweg','Way out'),tx('Rolle <code>TEAM_LEAD</code> + Attribute am Benutzer (<code>team</code>, <code>region</code>, <code>limit</code>) + eine Regel.','Role <code>TEAM_LEAD</code> + attributes on the user (<code>team</code>, <code>region</code>, <code>limit</code>) + one rule.')]
  ]},
  demoHint:tx('Wie viele Rollen bräuchte reines RBAC?','How many roles would pure RBAC need?'),
  demo:`${[['re-t',tx('Teams','Teams'),8,1,20],['re-r',tx('Regionen','Regions'),3,1,10],['re-l',tx('Freigabe-Limits','Approval limits'),4,1,8],['re-b',tx('Grundrollen (Viewer, Teamleitung …)','Base roles (viewer, team lead …)'),4,1,8]].map(([id,l,v,min,max])=>`<div class="field"><label for="${id}">${l}: <output id="${id}-o">${v}</output></label><input type="range" id="${id}" min="${min}" max="${max}" value="${v}"></div>`).join('')}<div id="re-out"></div>`,
  init(root){
    const run=()=>{const v=k=>+$('#'+k,root).value;['re-t','re-r','re-l','re-b'].forEach(k=>$('#'+k+'-o',root).textContent=v(k));
      const rb=v('re-t')*v('re-r')*v('re-l')*v('re-b');
      $('#re-out',root).innerHTML=`<div class="two" style="margin-top:8px"><div class="panel"><h3>${tx('Reines RBAC','Pure RBAC')}</h3><p style="margin:0;font:700 2rem/1 var(--font-mono)">${rb}</p><p class="hint">${tx('Rollen, je Kombination eine','roles, one per combination')}</p></div><div class="panel"><h3>${tx('RBAC + Attribute','RBAC + attributes')}</h3><p style="margin:0;font:700 2rem/1 var(--font-mono)">${v('re-b')}</p><p class="hint">${tx(`Rollen, dazu 3 Attribute am Benutzer und eine Regel`,`roles, plus 3 attributes on the user and one rule`)}</p></div></div>`};
    root.addEventListener('input',run);run();
  },
  lang:'java',
  bad:{code:`@PreAuthorize("hasAnyRole('APPROVER_SALES_EAST_5K', 'APPROVER_SALES_EAST_10K', " +
              "'APPROVER_SALES_WEST_5K', 'APPROVER_SALES_WEST_10K', …)")
public void approve(String id) { … }`},
  good:{code:`@PreAuthorize("hasAuthority('invoice:approve') and @invoicePolicy.canApprove(principal, #id)")
public void approve(String id) { … }

// invoicePolicy: inv.team == user.team && inv.region == user.region
//                && inv.amount <= user.approvalLimit`,note:tx('Team, Region und Limit stehen als Attribute am Benutzer (im IdP oder in der HR-Datenbank) und an der Rechnung. Eine neue Region braucht keine neue Rolle.','Team, region and limit are attributes on the user (in the IdP or the HR database) and on the invoice. A new region needs no new role.')},
  do:tx(['Rollen für Aufgaben, Attribute für Daten.','Attribute aus einer verlässlichen Quelle (HR, IdP) beziehen.','Wenn die Rollenliste wächst: nach Mustern in den Namen suchen – das sind verkappte Attribute.'],['Roles for jobs, attributes for data.','Source attributes from a reliable system (HR, IdP).','When the role list grows: look for patterns in the names – they’re hidden attributes.']),
  dont:tx(['Für jede neue Abteilung Rollen kopieren.','Attribute vom Client entgegennehmen („mein Limit ist 50 000“).'],['Copy roles for every new department.','Accept attributes from the client (“my limit is 50,000”).']),
  why:tx('<p>Rollen-Explosion ist der häufigste Grund, warum RBAC-Systeme nach ein paar Jahren unwartbar werden. Sie entsteht schleichend: Jede einzelne neue Rolle ist eine kleine, vernünftige Änderung. Wer das Muster früh erkennt, wechselt rechtzeitig zu Bedingungen – also zu ABAC für den Teil, der von Daten abhängt.</p>','<p>Role explosion is the most common reason RBAC systems become unmaintainable after a few years. It creeps in: every single new role is a small, reasonable change. Spotting the pattern early lets you switch to conditions in time – that is, to ABAC for the part that depends on data.</p>')
});

LESSONS.push({
  id:'multi-tenancy',cat:'models',
  title:tx('Mandanten: Rollen pro Organisation','Tenants: roles per organization'),
  short:tx('Bea ist Buchhaltung bei Nordwind und nur Viewer bei Südstern.','Bea is accounting at Nordwind and only a viewer at Südstern.'),
  keys:'multi tenancy mandant mandanten tenant organization organisation membership mitgliedschaft rolle pro mandant tenant isolation keycloak organizations',
  refs:[['Keycloak: Organizations','https://www.keycloak.org/docs/latest/server_admin/#_managing_organizations'],['OWASP: Multi-Tenant Security','https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html']],
  rule:tx('In einer mandantenfähigen App gilt eine Rolle nie global, sondern <b>pro Mandant</b>: Die Zuordnung heißt nicht „Bea ist Buchhaltung“, sondern „Bea ist Buchhaltung <i>in Nordwind</i>“. Jede Anfrage läuft im Kontext <i>eines</i> aktiven Mandanten, und jede Datenabfrage ist auf ihn beschränkt. Fremde Mandanten existieren für den Benutzer nicht – Antwort 404, nicht 403.','In a multi-tenant app a role is never global but <b>per tenant</b>: the assignment isn’t “Bea is accounting” but “Bea is accounting <i>at Nordwind</i>”. Every request runs in the context of <i>one</i> active tenant, and every data query is limited to it. Foreign tenants don’t exist for the user – answer 404, not 403.'),
  glance:{rows:[
    [tx('Mandant (Tenant)','Tenant'),tx('Kunde oder Organisation mit eigenen Daten in derselben App.','Customer or organization with its own data in the same app.')],
    [tx('Mitgliedschaft','Membership'),tx('Benutzer × Mandant × Rollen. Eine Person kann Mitglied in mehreren Mandanten sein.','User × tenant × roles. One person can be a member of several tenants.')],
    [tx('Aktiver Mandant','Active tenant'),tx('Aus Subdomain, Pfad oder Token-Claim – nie aus einem frei wählbaren Header ohne Prüfung.','From subdomain, path or token claim – never from a freely chosen header without a check.')],
    [tx('Isolation','Isolation'),tx('Jede Abfrage enthält <code>tenant_id</code> – am besten erzwungen (Hibernate <code>@TenantId</code>, Row-Level Security).','Every query contains <code>tenant_id</code> – ideally enforced (Hibernate <code>@TenantId</code>, row-level security).')]
  ]},
  demoHint:tx('Bea arbeitet für zwei Mandanten.','Bea works for two tenants.'),
  demo:`${table([tx('Mandant','Tenant'),tx('Beas Rolle','Bea’s role')],[['Nordwind GmbH','ACCOUNTANT'],['Südstern AG','VIEWER']],{caption:tx('Beas Mitgliedschaften','Bea’s memberships')})}
<div class="row"><div class="field"><label for="mt-active">${tx('Aktiver Mandant im Token','Active tenant in the token')}</label><select id="mt-active"><option value="nordwind">Nordwind GmbH</option><option value="suedstern">Südstern AG</option></select></div>
<div class="field"><label for="mt-req">${tx('Anfrage','Request')}</label><select id="mt-req"><option value="pay|nordwind">POST /api/invoices/R-1005/pay (Nordwind)</option><option value="read|suedstern">GET /api/invoices/S-2001 (Südstern)</option><option value="pay|suedstern">POST /api/invoices/S-2001/pay (Südstern)</option></select></div></div><div id="mt-out"></div>`,
  init(root){
    const MEM={nordwind:'ACCOUNTANT',suedstern:'VIEWER'};
    const run=()=>{const act=$('#mt-active',root).value,[a,t]=$('#mt-req',root).value.split('|');
      let r;if(t!==act)r=verdict(false,'404 Not Found',tx(`Die Abfrage läuft mit tenant_id = ${act}. Eine Rechnung aus ${t} wird gar nicht gefunden – es gibt sie für diese Anfrage nicht.`,`The query runs with tenant_id = ${act}. An invoice from ${t} isn’t found at all – it doesn’t exist for this request.`));
      else{const role=MEM[act],perm=a==='pay'?'invoice:pay':'invoice:read',ok=ROLES[role].perms.includes(perm);r=ok?verdict(true,'200 OK',tx(`In ${act} ist Bea ${ROLES[role].label} → ${perm} vorhanden.`,`In ${act} Bea is ${ROLES[role].label} → ${perm} present.`)):verdict(false,'403 Forbidden',tx(`In ${act} ist Bea nur ${ROLES[role].label} – kein ${perm}. Dass sie woanders bezahlen darf, zählt hier nicht.`,`In ${act} Bea is only ${ROLES[role].label} – no ${perm}. That she may pay elsewhere doesn’t count here.`))}
      $('#mt-out',root).innerHTML=r};
    root.addEventListener('change',run);run();
  },
  code:[
    {t:tx('Spring: Rollen des aktiven Mandanten aus dem Token','Spring: roles of the active tenant from the token'),lang:'java',src:`// token: { "org": "nordwind", "org_roles": { "nordwind": ["ACCOUNTANT"], "suedstern": ["VIEWER"] } }
Collection<GrantedAuthority> authorities(Jwt jwt) {
  String active = jwt.getClaimAsString("org");
  Map<String, List<String>> byOrg = jwt.getClaim("org_roles");
  return rolePermissions.authoritiesFor(byOrg.getOrDefault(active, List.of()));
}`},
    {t:tx('Hibernate: Mandant in jeder Abfrage erzwingen','Hibernate: enforce the tenant in every query'),lang:'java',src:`@Entity
class Invoice {
  @Id String id;
  @TenantId String tenantId;     // Hibernate adds "where tenant_id = ?" automatically
  …
}

@Component
class TokenTenantResolver implements CurrentTenantIdentifierResolver<String> {
  public String resolveCurrentTenantIdentifier() {
    return SecurityContextHolder.getContext().getAuthentication() instanceof JwtAuthenticationToken t
        ? t.getToken().getClaimAsString("org") : "none";
  }
  public boolean validateExistingCurrentSessions() { return true; }
}`,note:tx('Der Wert <code>"none"</code> trifft keine Zeile – ohne Mandant gibt es keine Daten (fail closed).','The value <code>"none"</code> matches no row – without a tenant there is no data (fail closed).')}
  ],
  do:tx(['Rollen immer als Mitgliedschaft pro Mandant modellieren.','Den Mandanten serverseitig aus dem geprüften Token ableiten.','Isolation in der Datenschicht erzwingen, nicht nur in jeder Abfrage „dran denken“.'],['Always model roles as membership per tenant.','Derive the tenant server-side from the verified token.','Enforce isolation in the data layer instead of “remembering” it in every query.']),
  dont:tx(['Globale Rollen, die in jedem Mandanten gelten.','Mandant aus einem Header <code>X-Tenant</code> übernehmen, ohne die Mitgliedschaft zu prüfen.','Fremden Mandanten mit 403 antworten – das verrät, dass es die ID gibt.'],['Global roles that apply in every tenant.','Take the tenant from an <code>X-Tenant</code> header without checking membership.','Answer foreign tenants with 403 – that reveals the ID exists.']),
  why:tx('<p>Ein Datenleck zwischen Mandanten ist für ein SaaS-Produkt der schlimmste Fall: Kunde A sieht die Rechnungen von Kunde B. Es passiert fast immer an einer einzigen vergessenen <code>where</code>-Bedingung. Darum gehört die Mandantentrennung in die Infrastruktur, wo man sie nicht vergessen kann.</p>','<p>A data leak between tenants is the worst case for a SaaS product: customer A sees customer B’s invoices. It almost always happens at a single forgotten <code>where</code> clause. That’s why tenant separation belongs in infrastructure, where it can’t be forgotten.</p>')
});

LESSONS.push({
  id:'abac',cat:'models',
  title:tx('ABAC: Attribute entscheiden','ABAC: attributes decide'),
  short:tx('Subjekt, Ressource, Aktion, Umgebung – ein Playground mit allen Regeln.','Subject, resource, action, environment – a playground with every rule.'),
  keys:'abac attribute based access control attribut subject resource action environment context regel rule bedingung condition uhrzeit netzwerk',
  refs:[['NIST SP 800-162: ABAC','https://csrc.nist.gov/pubs/sp/800/162/upd2/final'],['OWASP: Prefer ABAC/ReBAC over RBAC','https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html#prefer-attribute-and-relationship-based-access-control-over-rbac']],
  rule:tx('Bei ABAC entscheidet eine Regel über <b>Attribute</b> von vier Dingen: dem <b>Subjekt</b> (Rolle, Team, Limit, MFA), der <b>Ressource</b> (Team, Betrag, Status, Ersteller), der <b>Aktion</b> und der <b>Umgebung</b> (Uhrzeit, Netzwerk). Rollen sind dabei nur ein Attribut unter vielen. So lassen sich Regeln ausdrücken wie „Teamleitung gibt Rechnungen des eigenen Teams bis zu ihrem Limit frei, aber nicht die selbst erstellten“.','In ABAC a rule decides over <b>attributes</b> of four things: the <b>subject</b> (role, team, limit, MFA), the <b>resource</b> (team, amount, status, creator), the <b>action</b> and the <b>environment</b> (time, network). Roles are just one attribute among many. That lets you express rules like “team leads approve their own team’s invoices up to their limit, but not those they created”.'),
  glance:{head:[tx('Attributgruppe','Attribute group'),tx('Beispiele bei Nordwind','Examples at Nordwind')],rows:[
    [tx('Subjekt','Subject'),tx('<code>roles</code>, <code>team</code>, <code>approvalLimit</code>, <code>mfa</code> – aus Token oder HR.','<code>roles</code>, <code>team</code>, <code>approvalLimit</code>, <code>mfa</code> – from token or HR.')],
    [tx('Ressource','Resource'),tx('<code>team</code>, <code>amount</code>, <code>status</code>, <code>createdBy</code> – aus der Datenbank.','<code>team</code>, <code>amount</code>, <code>status</code>, <code>createdBy</code> – from the database.')],
    [tx('Aktion','Action'),'<code>read</code>, <code>approve</code>, <code>pay</code> …'],
    [tx('Umgebung','Environment'),tx('Uhrzeit, Wochentag, Netzwerk (Büro, VPN, Internet), Risiko-Score.','Time of day, weekday, network (office, VPN, internet), risk score.')]
  ]},
  demoHint:tx('Alle Attribute sind einstellbar. Das Subjekt ist die Person oben.','All attributes are adjustable. The subject is the person at the top.'),
  demo:`<div class="two">
<fieldset class="panel"><legend style="font-weight:700">${tx('Ressource und Aktion','Resource and action')}</legend>
  <div class="field"><label for="ab-act">${tx('Aktion','Action')}</label><select id="ab-act"><option value="approve">approve</option><option value="pay">pay</option><option value="read">read</option></select></div>
  <div class="field"><label for="ab-team">${tx('Team der Rechnung','Invoice team')}</label><select id="ab-team"><option value="sales">${TEAMS.sales}</option><option value="finance">${TEAMS.finance}</option></select></div>
  <div class="field"><label for="ab-amt">${tx('Betrag','Amount')}: <output id="ab-amt-o"></output></label><input type="range" id="ab-amt" min="100" max="20000" step="100" value="4300"></div>
  <div class="field"><label for="ab-status">Status</label><select id="ab-status"><option value="submitted">${STATUS.submitted}</option><option value="approved">${STATUS.approved}</option><option value="draft">${STATUS.draft}</option></select></div>
  <div class="field"><label for="ab-by">${tx('Erstellt von','Created by')}</label><select id="ab-by">${['bea','tom','vera'].map(id=>`<option value="${id}">${PERSONA_BY[id].name}</option>`).join('')}</select></div>
</fieldset>
<fieldset class="panel"><legend style="font-weight:700">${tx('Umgebung','Environment')}</legend>
  <div class="field"><label for="ab-hour">${tx('Uhrzeit','Time')}: <output id="ab-hour-o"></output></label><input type="range" id="ab-hour" min="0" max="23" value="10"></div>
  <div class="field"><label for="ab-net">${tx('Netzwerk','Network')}</label><select id="ab-net"><option value="office">${tx('Büro','Office')}</option><option value="vpn">VPN</option><option value="internet">Internet</option></select></div>
  <label class="check-row"><input type="checkbox" id="ab-mfa" checked>${tx('Mit MFA angemeldet','Signed in with MFA')}</label>
</fieldset></div><div id="ab-out"></div>`,
  init(root){
    const v=id=>$('#'+id,root);
    const run=()=>{const p=persona(),act=v('ab-act').value,amt=+v('ab-amt').value,hour=+v('ab-hour').value,net=v('ab-net').value,mfa=v('ab-mfa').checked,team=v('ab-team').value,status=v('ab-status').value,by=v('ab-by').value;
      v('ab-amt-o').textContent=eur(amt);v('ab-hour-o').textContent=`${String(hour).padStart(2,'0')}:00`;
      const R=[];const rule=(id,txt,ok)=>{R.push([ok?'ok':'no',`<b>${id}</b> ${txt}`]);return ok};
      const seeAll=p.roles.includes('ACCOUNTANT')||p.roles.includes('ADMIN');
      let ok=rule('R1',tx(`Subjekt hat invoice:${act} (${roleLabel(p)})`,`subject has invoice:${act} (${roleLabel(p)})`),can('invoice:'+act,p));
      if(act==='read')ok=rule('R2',tx(`subjekt.team = ressource.team oder Subjekt sieht alle Teams (${p.team||'—'} / ${team})`,`subject.team = resource.team or subject sees all teams (${p.team||'—'} / ${team})`),seeAll||p.team===team)&&ok;
      if(act==='approve'){ok=rule('R2',tx(`subjekt.team = ressource.team (${p.team||'—'} = ${team})`,`subject.team = resource.team (${p.team||'—'} = ${team})`),p.team===team)&&ok;
        ok=rule('R3',tx(`ressource.betrag ≤ subjekt.limit (${eur(amt)} ≤ ${p.limit?eur(p.limit):'—'})`,`resource.amount ≤ subject.limit (${eur(amt)} ≤ ${p.limit?eur(p.limit):'—'})`),amt<=(p.limit??0))&&ok;
        ok=rule('R4',tx(`ressource.erstelltVon ≠ subjekt (${by} ≠ ${p.id})`,`resource.createdBy ≠ subject (${by} ≠ ${p.id})`),by!==p.id)&&ok;
        ok=rule('R5',tx(`ressource.status = eingereicht (${status})`,`resource.status = submitted (${status})`),status==='submitted')&&ok;}
      if(act==='pay'){ok=rule('R5',tx(`ressource.status = freigegeben (${status})`,`resource.status = approved (${status})`),status==='approved')&&ok;
        ok=rule('R6',tx(`umgebung.uhrzeit zwischen 07 und 19 Uhr (${hour} Uhr)`,`environment.time between 07 and 19 (${hour}:00)`),hour>=7&&hour<19)&&ok;
        ok=rule('R7',tx(`umgebung.netzwerk ≠ Internet oder MFA (${net}, MFA ${mfa?'ja':'nein'})`,`environment.network ≠ internet or MFA (${net}, MFA ${mfa?'yes':'no'})`),net!=='internet'||mfa)&&ok;}
      $('#ab-out',root).innerHTML=traceHTML(R)+`<div style="margin-top:10px">${ok?verdict(true,'permit'):verdict(false,'deny',tx('Alle Regeln müssen erfüllt sein (UND-Verknüpfung).','All rules must hold (AND).'))}</div>`};
    root.addEventListener('input',run);root.addEventListener('change',run);return onPersona(run);
  },
  code:[
    {t:tx('Spring: ABAC-Regel als Bean, aufgerufen aus @PreAuthorize','Spring: ABAC rule as a bean, called from @PreAuthorize'),lang:'java',src:`@PreAuthorize("@invoicePolicy.canPay(principal, #id, #ctx)")
public void pay(String id, RequestContext ctx) { … }

@Component("invoicePolicy")
class InvoicePolicy {
  boolean canPay(UserPrincipal u, String id, RequestContext ctx) {
    Invoice inv = invoices.get(id);                           // PIP: resource attributes
    LocalTime t = LocalTime.now(clock);
    return u.has("invoice:pay")                               // R1
        && inv.getStatus() == APPROVED                        // R5
        && !t.isBefore(LocalTime.of(7, 0)) && t.isBefore(LocalTime.of(19, 0))  // R6
        && (ctx.network() != Network.INTERNET || u.mfa());     // R7
  }
}`},
    {t:tx('Angular: dieselbe Frage fürs UI – Ergebnis vom Server','Angular: the same question for the UI – result from the server'),lang:'ts',src:`// The API returns allowed actions per invoice, computed by the same policy:
// GET /api/invoices → [{ id: 'R-1002', …, _actions: ['read', 'approve'] }]
@if (invoice()._actions.includes('approve')) {
  <button type="button" (click)="approve()">Approve</button>
}`,note:tx('Das Frontend kennt weder Limit noch Uhrzeit-Regel – es bekommt das Ergebnis. So können sich Regel und Anzeige nicht widersprechen.','The frontend knows neither limit nor time rule – it gets the result. That way rule and display can’t contradict each other.')}
  ],
  do:tx(['Attribute aus vertrauenswürdigen Quellen laden – Token, Datenbank, HR –, nie aus dem Request-Body.','Regeln als reine Funktionen schreiben und mit Tabellen testen.','Dem Frontend erlaubte Aktionen pro Objekt mitliefern.'],['Load attributes from trusted sources – token, database, HR – never from the request body.','Write rules as pure functions and test them with tables.','Deliver allowed actions per object to the frontend.']),
  dont:tx(['ABAC-Regeln im Frontend nachbauen und dort „entscheiden“.','Uhrzeit vom Client nehmen.','Hunderte Einzelregeln ohne Struktur – dann lohnt sich PBAC.'],['Rebuild ABAC rules in the frontend and “decide” there.','Take the time from the client.','Hundreds of unstructured individual rules – that’s when PBAC pays off.']),
  why:tx('<p>ABAC drückt aus, was Fachleute tatsächlich sagen: „Teamleitungen geben Rechnungen ihres Teams bis 5000 € frei.“ Darin stecken drei Attribute und eine Rolle. Mit reinem RBAC wäre das eine Rolle pro Team und Limit; mit ABAC ist es eine Zeile. Der Preis: Die Frage „wer darf R-1003 freigeben?“ lässt sich nicht mehr an einer Tabelle ablesen, sondern nur durch Auswerten der Regel beantworten.</p>','<p>ABAC expresses what domain experts actually say: “team leads approve their team’s invoices up to €5,000.” That contains three attributes and one role. With pure RBAC that’s one role per team and limit; with ABAC it’s one line. The price: the question “who may approve R-1003?” can no longer be read off a table, only answered by evaluating the rule.</p>')
});

LESSONS.push({
  id:'pbac',cat:'models',
  title:tx('PBAC: Policies als Code','PBAC: policies as code'),
  short:tx('Regeln raus aus dem Code, rein in Cedar oder Rego – permit, forbid, default deny.','Rules out of the code, into Cedar or Rego – permit, forbid, default deny.'),
  keys:'pbac policy based access control policy as code opa open policy agent rego cedar aws verified permissions cerbos permit forbid default deny decision log',
  refs:[['Cedar Policy Language','https://docs.cedarpolicy.com/'],['Open Policy Agent','https://www.openpolicyagent.org/docs/latest/'],['Cerbos','https://docs.cerbos.dev/']],
  rule:tx('PBAC trennt die <b>Regeln</b> vom <b>Anwendungscode</b>: Policies stehen als eigene Dateien in einer Policy-Sprache (Cedar, Rego), liegen versioniert in Git, werden getestet und von einem PDP ausgewertet. Der Code fragt nur noch „darf er?“. In Cedar gilt: Alles ist verboten, bis ein <code>permit</code> passt – und ein passendes <code>forbid</code> schlägt jedes <code>permit</code>.','PBAC separates the <b>rules</b> from the <b>application code</b>: policies live as separate files in a policy language (Cedar, Rego), versioned in Git, tested, and evaluated by a PDP. The code only asks “may they?”. In Cedar: everything is forbidden until a <code>permit</code> matches – and a matching <code>forbid</code> beats every <code>permit</code>.'),
  glance:{rows:[
    ['Policy as Code',tx('Regeln als versionierte, testbare, reviewbare Dateien – wie Infrastruktur als Code.','Rules as versioned, testable, reviewable files – like infrastructure as code.')],
    ['Cedar',tx('Policy-Sprache von AWS (Open Source), formal analysierbar. Struktur: <code>permit</code>/<code>forbid</code>(principal, action, resource) <code>when</code> {…}.','AWS policy language (open source), formally analyzable. Structure: <code>permit</code>/<code>forbid</code>(principal, action, resource) <code>when</code> {…}.')],
    ['OPA / Rego',tx('Open Policy Agent, CNCF-Projekt. Rego ist eine Datalog-artige Sprache, sehr flexibel, auch für Kubernetes und CI.','Open Policy Agent, a CNCF project. Rego is a Datalog-like language, very flexible, also used for Kubernetes and CI.')],
    ['Default Deny',tx('Ohne passendes <code>permit</code> → verweigert.','Without a matching <code>permit</code> → denied.')],
    [tx('Forbid schlägt Permit','Forbid beats permit'),tx('Ausnahmen („nie die eigene Rechnung“) als <code>forbid</code> schreiben, nicht in jedes <code>permit</code> einbauen.','Write exceptions (“never your own invoice”) as <code>forbid</code> instead of building them into every <code>permit</code>.')],
    ['Decision Log',tx('Der PDP protokolliert jede Entscheidung mit Eingabe und Policy – ideal fürs Audit.','The PDP logs every decision with input and policy – ideal for audits.')]
  ]},
  demoHint:tx('Schalte Policies an und aus. Die Anfrage kommt von der Person oben.','Turn policies on and off. The request comes from the person at the top.'),
  demo:`<div class="row"><div class="field"><label for="pb-act">${tx('Aktion','Action')}</label><select id="pb-act"><option>approve</option><option>pay</option><option>read</option><option>edit</option></select></div><div class="field"><label for="pb-inv">${tx('Ressource','Resource')}</label><select id="pb-inv">${INVOICES.map(i=>`<option value="${i.id}">${i.id} · ${TEAMS[i.team]} · ${eur(i.amount)} · ${STATUS[i.status]} · ${tx('von','by')} ${i.createdBy}</option>`).join('')}</select></div></div>
<label class="check-row"><input type="checkbox" id="pb-mfa" checked>context.mfa</label>
<div id="pb-pols"></div><div id="pb-out"></div>`,
  init(root){
    const POL=[
      {id:'P1',eff:'permit',src:`permit(principal in Role::"TEAM_LEAD", action == Action::"approve", resource)
when { resource.team == principal.team && resource.amount <= principal.limit };`,m:(p,a,r)=>p.roles.includes('TEAM_LEAD')&&a==='approve'&&r.team===p.team&&r.amount<=(p.limit??0)},
      {id:'P2',eff:'permit',src:`permit(principal in Role::"ACCOUNTANT",
       action in [Action::"read", Action::"edit", Action::"pay"], resource);`,m:(p,a)=>p.roles.includes('ACCOUNTANT')&&['read','edit','pay'].includes(a)},
      {id:'P3',eff:'permit',src:`permit(principal, action == Action::"read", resource)
when { resource.team == principal.team };`,m:(p,a,r)=>p.roles.length>0&&a==='read'&&r.team===p.team},
      {id:'P4',eff:'forbid',src:`forbid(principal, action == Action::"approve", resource)
when { resource.createdBy == principal };`,m:(p,a,r)=>a==='approve'&&r.createdBy===p.id},
      {id:'P5',eff:'forbid',src:`forbid(principal, action == Action::"pay", resource)
unless { resource.status == "approved" };`,m:(p,a,r)=>a==='pay'&&r.status!=='approved'},
      {id:'P6',eff:'forbid',src:`forbid(principal, action == Action::"pay", resource)
unless { context.mfa };`,m:(p,a,r,c)=>a==='pay'&&!c.mfa}
    ];
    $('#pb-pols',root).innerHTML=POL.map(x=>`<label class="pb-pol"><input type="checkbox" data-pol="${x.id}" checked><span><b>${x.id}</b> <span class="pill">${x.eff}</span><pre class="k-pre"><code>${hl(x.src,'cedar')}</code></pre></span></label>`).join('');
    const run=()=>{const p=persona(),a=$('#pb-act',root).value,r=INVOICES.find(i=>i.id===$('#pb-inv',root).value),c={mfa:$('#pb-mfa',root).checked};
      const on=new Set($$('input[data-pol]:checked',root).map(x=>x.dataset.pol));
      const hits=POL.filter(x=>on.has(x.id)&&x.m(p,a,r,c));
      $$('.pb-pol',root).forEach(el=>{const id=$('input',el).dataset.pol;el.classList.toggle('is-hit',hits.some(h=>h.id===id))});
      const f=hits.filter(h=>h.eff==='forbid'),pm=hits.filter(h=>h.eff==='permit');
      $('#pb-out',root).innerHTML=f.length?verdict(false,`deny – ${tx('forbid greift','forbid applies')}: ${f.map(h=>h.id).join(', ')}`,pm.length?tx(`${pm.map(h=>h.id).join(', ')} hätte erlaubt – forbid gewinnt.`,`${pm.map(h=>h.id).join(', ')} would have permitted – forbid wins.`):''):pm.length?verdict(true,`allow – ${tx('erlaubt durch','permitted by')} ${pm.map(h=>h.id).join(', ')}`):verdict(false,'deny – default deny',tx('Keine permit-Policy passt.','No permit policy matches.'))};
    root.addEventListener('change',run);return onPersona(run);
  },
  css:`.pb-pol{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;margin-bottom:6px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer}.pb-pol input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}.pb-pol .k-pre{padding:6px 0 0;white-space:pre-wrap}.pb-pol.is-hit{border-color:var(--brand);background:var(--brand-soft)}`,
  code:[
    {t:tx('Dieselbe Regel in Rego (OPA)','The same rule in Rego (OPA)'),lang:'rego',src:`package nordwind.invoices

default allow := false

allow if {
    input.action == "approve"
    "TEAM_LEAD" in input.subject.roles
    input.resource.team == input.subject.team
    input.resource.amount <= input.subject.limit
    not self_approval
}

self_approval if input.resource.createdBy == input.subject.id`},
    {t:tx('Test der Policy (OPA)','Testing the policy (OPA)'),lang:'rego',src:`test_tom_approves_own_team if {
    allow with input as {"action": "approve",
        "subject": {"id": "tom", "roles": ["TEAM_LEAD"], "team": "sales", "limit": 5000},
        "resource": {"team": "sales", "amount": 4300, "createdBy": "bea"}}
}
test_no_self_approval if {
    not allow with input as {"action": "approve",
        "subject": {"id": "tom", "roles": ["TEAM_LEAD"], "team": "sales", "limit": 5000},
        "resource": {"team": "sales", "amount": 900, "createdBy": "tom"}}
}`,note:tx('<code>opa test .</code> läuft in der CI. Eine Policy-Änderung ist ein Pull Request mit Review und Tests – wie Code.','<code>opa test .</code> runs in CI. A policy change is a pull request with review and tests – like code.')}
  ],
  do:tx(['Ausnahmen als <code>forbid</code>, Normalfälle als <code>permit</code>.','Policies testen und versionieren wie Code.','Decision Logs fürs Audit speichern.','Mit eingebettetem PDP (Bibliothek) anfangen, bevor du einen Dienst betreibst.'],['Exceptions as <code>forbid</code>, normal cases as <code>permit</code>.','Test and version policies like code.','Keep decision logs for audits.','Start with an embedded PDP (library) before running a service.']),
  dont:tx(['Policies ohne Tests „live“ im Admin-UI ändern.','Den PDP bei jeder Listenzeile einzeln über das Netz fragen (Latenz) – Batch-Anfragen oder Filter nutzen.','PBAC einführen, um ein Team-internes Durcheinander zu verstecken.'],['Change policies “live” in the admin UI without tests.','Ask the PDP over the network for every list row (latency) – use batch requests or filters.','Introduce PBAC to hide internal chaos.']),
  why:tx('<p>Wenn fünf Dienste in drei Sprachen dieselbe Freigaberegel brauchen, ist „die Regel im Code“ fünfmal da – und fünfmal anders. PBAC macht die Regel zu <i>einem</i> Artefakt, das alle Dienste fragen, das die Revision lesen kann und dessen Änderungen nachvollziehbar sind. Cedar geht noch weiter: Die Sprache ist so gebaut, dass Werkzeuge beweisen können, ob zwei Policy-Versionen dasselbe erlauben.</p>','<p>When five services in three languages need the same approval rule, “the rule in the code” exists five times – and five times differently. PBAC turns the rule into <i>one</i> artifact that every service asks, that auditors can read and whose changes are traceable. Cedar goes further: the language is designed so tools can prove whether two policy versions allow the same thing.</p>')
});

LESSONS.push({
  id:'rebac',cat:'models',
  title:tx('ReBAC: Beziehungen statt Rollen','ReBAC: relationships instead of roles'),
  short:tx('Zanzibar-Tupel, ein OpenFGA-Modell und ein Graph, den du selbst bearbeitest.','Zanzibar tuples, an OpenFGA model and a graph you edit yourself.'),
  keys:'rebac relationship based access control zanzibar openfga spicedb tupel tuple relation graph check teilen sharing ordner folder',
  refs:[['OpenFGA: Concepts','https://openfga.dev/docs/concepts'],['Zanzibar Paper (Google, 2019)','https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/'],['SpiceDB','https://authzed.com/docs']],
  rule:tx('Bei ReBAC entstehen Rechte aus <b>Beziehungen</b>: „Tom ist <i>Leitung</i> von Team Vertrieb“, „Team Vertrieb ist <i>Eigentümer</i> von R-1002“. Ein <b>Modell</b> sagt, wie Beziehungen sich fortsetzen („wer Leitung des Eigentümer-Teams ist, darf freigeben“). Eine Prüfung ist dann die Frage, ob im Graphen ein Pfad vom Benutzer zur Beziehung am Objekt führt.','In ReBAC rights come from <b>relationships</b>: “Tom is <i>lead</i> of team sales”, “team sales is <i>owner</i> of R-1002”. A <b>model</b> says how relationships carry over (“whoever leads the owner team may approve”). A check is then the question whether a path in the graph leads from the user to the relation on the object.'),
  glance:{rows:[
    [tx('Tupel','Tuple'),tx('<code>objekt#relation@subjekt</code>, etwa <code>team:sales#lead@user:tom</code>. Das sind die Daten.','<code>object#relation@subject</code>, e.g. <code>team:sales#lead@user:tom</code>. That’s the data.')],
    [tx('Modell','Model'),tx('Typen und Relationen mit Regeln (<code>or</code>, <code>from</code>). Das ist die Logik.','Types and relations with rules (<code>or</code>, <code>from</code>). That’s the logic.')],
    ['Check',tx('„Hat user:tom die Relation approver auf invoice:R-1002?“ → ja/nein.','“Does user:tom have the approver relation on invoice:R-1002?” → yes/no.')],
    ['ListObjects',tx('„Welche Rechnungen darf Tom sehen?“ – für Listen und Filter.','“Which invoices may Tom see?” – for lists and filters.')],
    ['Userset',tx('Ein Subjekt kann selbst eine Menge sein: <code>team:sales#member</code>.','A subject can itself be a set: <code>team:sales#member</code>.')],
    ['Zanzibar',tx('Googles System hinter Drive, YouTube, Calendar. OpenFGA und SpiceDB sind Open-Source-Nachbauten.','Google’s system behind Drive, YouTube, Calendar. OpenFGA and SpiceDB are open-source reimplementations.')]
  ]},
  body:code(tx('Das Modell (OpenFGA)','The model (OpenFGA)'),`model
  schema 1.1

type user

type team
  relations
    define lead: [user]
    define member: [user] or lead

type invoice
  relations
    define owner_team: [team]
    define approver: lead from owner_team
    define viewer: [user, team#member] or member from owner_team or approver`,'fga'),
  demoHint:tx('Füge Tupel hinzu oder entferne sie und prüfe Beziehungen.','Add or remove tuples and check relationships.'),
  demo:`<div class="two"><div><h3>${tx('Tupel','Tuples')}</h3><ul class="rb-tuples" id="rbx-list"></ul>
<div class="row"><div class="field"><label for="rbx-new">${tx('Neues Tupel','New tuple')}</label><input class="input mono" id="rbx-new" value="invoice:R-1004#viewer@user:vera" spellcheck="false"></div><button type="button" class="btn btn-secondary" id="rbx-add">${tx('Hinzufügen','Add')}</button></div></div>
<div><h3>Check</h3><div class="row"><div class="field"><label for="rbx-u">${tx('Benutzer','User')}</label><select id="rbx-u">${['vera','tom','bea','ada'].map(u=>`<option value="${u}"${u==='tom'?' selected':''}>user:${u}</option>`).join('')}</select></div><div class="field"><label for="rbx-r">Relation</label><select id="rbx-r"><option>approver</option><option>viewer</option></select></div><div class="field"><label for="rbx-o">${tx('Objekt','Object')}</label><select id="rbx-o">${INVOICES.map(i=>`<option value="${i.id}"${i.id==='R-1002'?' selected':''}>invoice:${i.id}</option>`).join('')}</select></div></div><div id="rbx-out"></div></div></div>`,
  init(root){
    const INIT=['team:sales#lead@user:tom','team:sales#member@user:vera','team:finance#member@user:bea',...INVOICES.map(i=>`invoice:${i.id}#owner_team@team:${i.team}`)];
    let T=[...INIT];
    const parse=s=>{const m=/^(\w+):([\w-]+)#(\w+)@(\w+):([\w-]+)(?:#(\w+))?$/.exec(s.trim());return m?{ot:m[1],oid:m[2],rel:m[3],st:m[4],sid:m[5],srel:m[6]||null}:null};
    const direct=(o,rel)=>T.map(parse).filter(t=>t&&`${t.ot}:${t.oid}`===o&&t.rel===rel);
    // check(user, relation, object) → Pfad oder null. Nachbau der Rewrites aus dem Modell oben.
    function check(u,rel,obj,seen=new Set()){
      const key=`${obj}#${rel}`;if(seen.has(key))return null;seen=new Set(seen).add(key);
      const [type]=obj.split(':');
      for(const t of direct(obj,rel)){
        if(t.st==='user'&&t.sid===u)return[`${obj}#${rel}@user:${u}`];
        if(t.srel){const sub=check(u,t.srel,`${t.st}:${t.sid}`,seen);if(sub)return[...sub,`${obj}#${rel}@${t.st}:${t.sid}#${t.srel}`]}
      }
      const fromRel=(tupleRel,targetRel)=>{for(const t of direct(obj,tupleRel)){const sub=check(u,targetRel,`${t.st}:${t.sid}`,seen);if(sub)return[...sub,`${obj}#${tupleRel}@${t.st}:${t.sid} → ${rel}`]}return null};
      if(type==='team'&&rel==='member')return check(u,'lead',obj,seen);
      if(type==='invoice'&&rel==='approver')return fromRel('owner_team','lead');
      if(type==='invoice'&&rel==='viewer')return fromRel('owner_team','member')||check(u,'approver',obj,seen);
      return null;
    }
    const draw=()=>{$('#rbx-list',root).innerHTML=T.map((t,i)=>`<li><code>${esc(t)}</code><button type="button" class="icon-btn" data-del="${i}" aria-label="${tx('Tupel entfernen','Remove tuple')}: ${esc(t)}">${ic('x')}</button></li>`).join('');
      const u=$('#rbx-u',root).value,r=$('#rbx-r',root).value,o='invoice:'+$('#rbx-o',root).value,path=check(u,r,o);
      $('#rbx-out',root).innerHTML=`<p class="mono" style="margin:8px 0">check(user:${u}, ${r}, ${o})</p>`+(path?verdict(true,'allowed: true',`<ol class="rb-path">${path.map(x=>`<li><code>${esc(x)}</code></li>`).join('')}</ol>`):verdict(false,'allowed: false',tx('Kein Pfad im Graphen.','No path in the graph.')))};
    root.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){T.splice(+d.dataset.del,1);draw()}
      if(e.target.closest('#rbx-add')){const v=$('#rbx-new',root).value.trim();if(!parse(v)){toast({msg:tx('Format: typ:id#relation@typ:id','Format: type:id#relation@type:id'),type:'error'});return}if(!T.includes(v))T.push(v);draw()}});
    root.addEventListener('change',draw);draw();
  },
  css:`.rb-tuples{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:3px;max-height:18rem;overflow:auto}.rb-tuples li{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 2px 2px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.rb-tuples .icon-btn{width:36px;height:36px}.rb-path{margin:6px 0 0;padding-left:1.2em;font-weight:400}`,
  after:tx('<p><b>Probier:</b> Prüfe <code>user:vera</code>, <code>viewer</code>, <code>invoice:R-1004</code> (Buchhaltung) – nein. Füge das Tupel <code>invoice:R-1004#viewer@user:vera</code> hinzu – jetzt ja. So funktioniert „Teilen“ in Google Drive. Und entferne <code>team:sales#lead@user:tom</code>: Tom verliert alle Freigaberechte auf einen Schlag.</p>','<p><b>Try:</b> check <code>user:vera</code>, <code>viewer</code>, <code>invoice:R-1004</code> (finance) – no. Add the tuple <code>invoice:R-1004#viewer@user:vera</code> – now yes. That’s how “sharing” works in Google Drive. And remove <code>team:sales#lead@user:tom</code>: Tom loses all approval rights in one go.</p>'),
  code:[{t:tx('Spring: OpenFGA fragen','Spring: asking OpenFGA'),lang:'java',src:`@Component("fga")
class FgaPolicy {
  private final OpenFgaClient fga;

  boolean check(String user, String relation, String object) throws Exception {
    var res = fga.check(new ClientCheckRequest()
        .user("user:" + user).relation(relation)._object(object)).get();
    return Boolean.TRUE.equals(res.getAllowed());
  }
}

@PreAuthorize("@fga.check(principal.id, 'approver', 'invoice:' + #id)")
public void approve(String id) { … }

// write a tuple when data changes – in the same business transaction
// (outbox pattern, so database and FGA can’t drift apart)
fga.write(new ClientWriteRequest().writes(List.of(new ClientTupleKey()
    .user("team:" + inv.getTeam()).relation("owner_team")._object("invoice:" + inv.getId()))));`,note:tx('Die schwierigste Stelle ist nicht die Abfrage, sondern die Synchronisation: Jede Änderung an Teams und Rechnungen muss als Tupel nachgezogen werden.','The hardest part isn’t the query but the synchronization: every change to teams and invoices has to be mirrored as a tuple.')}],
  do:tx(['ReBAC nehmen, wenn Rechte an Objekten geteilt oder über Hierarchien vererbt werden (Ordner, Projekte, Organisationen).','Tupel transaktional mit den Fachdaten schreiben (Outbox).','Bedingungen (Limit, Uhrzeit) über Conditions/Caveats ergänzen statt in Tupel zu gießen.'],['Use ReBAC when rights on objects are shared or inherited through hierarchies (folders, projects, organizations).','Write tuples transactionally with the business data (outbox).','Add conditions (limit, time) via conditions/caveats instead of casting them into tuples.']),
  dont:tx(['ReBAC für eine App mit drei Rollen und ohne Teilen.','Tupel per Nacht-Job synchronisieren – stundenlang falsche Rechte.','Für Listen jede Zeile einzeln prüfen; dafür gibt es ListObjects.'],['ReBAC for an app with three roles and no sharing.','Sync tuples with a nightly job – hours of wrong rights.','Check every row of a list individually; that’s what ListObjects is for.']),
  why:tx('<p>Manche Fragen sind von Natur aus Graphen: „Darf ich dieses Dokument sehen, weil es in einem Ordner liegt, der mit einer Gruppe geteilt ist, in der ich Mitglied bin?“ Mit Rollen oder flachen Attributen wird das zu einem Knäuel aus Joins. ReBAC macht genau diese Frage schnell und konsistent – Google beantwortet so Millionen Prüfungen pro Sekunde.</p>','<p>Some questions are graphs by nature: “may I see this document because it’s in a folder shared with a group I’m a member of?” With roles or flat attributes this becomes a tangle of joins. ReBAC makes exactly this question fast and consistent – Google answers millions of checks per second this way.</p>')
});

LESSONS.push({
  id:'choose-model',cat:'models',
  title:tx('Welches Modell wann?','Which model when?'),
  short:tx('Fünf Fragen, eine Empfehlung – und warum es fast immer eine Mischung wird.','Five questions, one recommendation – and why it almost always ends up mixed.'),
  keys:'entscheidung decision modell wählen choose model hybrid rbac abac pbac rebac empfehlung recommendation',
  refs:[['OWASP Authorization Cheat Sheet','https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html']],
  rule:tx('Fang mit <b>RBAC</b> für Funktionsrechte an. Ergänze <b>Bedingungen (ABAC)</b>, sobald Rechte von Daten oder Kontext abhängen. Nimm <b>ReBAC</b>, wenn Objekte geteilt oder über Hierarchien vererbt werden. Hol dir eine <b>Policy-Engine (PBAC)</b>, wenn mehrere Dienste dieselben Regeln brauchen oder Regeln unabhängig vom Code geprüft und geändert werden müssen.','Start with <b>RBAC</b> for functional rights. Add <b>conditions (ABAC)</b> as soon as rights depend on data or context. Use <b>ReBAC</b> when objects are shared or inherited through hierarchies. Get a <b>policy engine (PBAC)</b> when several services need the same rules or rules must be reviewed and changed independently of the code.'),
  demoTitle:tx('Entscheidungshelfer','Decision helper'),demoHint:tx('Beantworte die Fragen für dein Projekt.','Answer the questions for your project.'),
  demo:`<div id="cm-q"></div><div id="cm-out"></div>`,
  init(root){
    const Q=[
      ['cond',tx('Hängen Rechte von Daten ab – Betrag, Team, Status, Besitzer?','Do rights depend on data – amount, team, status, owner?')],
      ['ctx',tx('Hängen Rechte vom Kontext ab – Uhrzeit, Netzwerk, MFA, Risiko?','Do rights depend on context – time, network, MFA, risk?')],
      ['share',tx('Teilen Benutzer einzelne Objekte miteinander oder gibt es Ordner-/Projekt-Hierarchien?','Do users share individual objects or are there folder/project hierarchies?')],
      ['multi',tx('Brauchen mehrere Dienste (evtl. in verschiedenen Sprachen) dieselben Regeln?','Do several services (maybe in different languages) need the same rules?')],
      ['audit',tx('Müssen Regeln von Nicht-Entwicklern geprüft oder ohne Release geändert werden?','Must rules be reviewed by non-developers or changed without a release?')]
    ];
    $('#cm-q',root).innerHTML=Q.map(([k,q])=>`<fieldset class="seg cm-f"><legend>${q}</legend><div class="seg-opts"><label><input type="radio" name="cm-${k}" value="1">${tx('Ja','Yes')}</label><label><input type="radio" name="cm-${k}" value="0" checked>${tx('Nein','No')}</label></div></fieldset>`).join('');
    const run=()=>{const a=Object.fromEntries(Q.map(([k])=>[k,$(`input[name="cm-${k}"]:checked`,root).value==='1']));
      const rec=[[tx('<b>RBAC</b> für Funktionsrechte: Rollen im IdP, Permissions im Code.','<b>RBAC</b> for functional rights: roles in the IdP, permissions in code.'),true]];
      if(a.cond||a.ctx)rec.push([tx('<b>ABAC-Bedingungen</b> in einer Policy-Klasse pro Ressource (Spring-Bean, aufgerufen aus <code>@PreAuthorize</code>).','<b>ABAC conditions</b> in a policy class per resource (Spring bean called from <code>@PreAuthorize</code>).'),true]);
      if(a.share)rec.push([tx('<b>ReBAC</b> mit OpenFGA oder SpiceDB für Teilen und Hierarchien.','<b>ReBAC</b> with OpenFGA or SpiceDB for sharing and hierarchies.'),true]);
      if(a.multi||a.audit)rec.push([tx('<b>PBAC</b>: Regeln in Cedar oder Rego, ein PDP für alle Dienste, Decision Logs.','<b>PBAC</b>: rules in Cedar or Rego, one PDP for all services, decision logs.'),true]);
      $('#cm-out',root).innerHTML=`<h3 style="margin-top:16px">${tx('Empfehlung','Recommendation')}</h3><ol class="trace">${rec.map(([t])=>`<li class="t-ok">${ic('ok')}<span>${t}</span></li>`).join('')}</ol>${rec.length===1?`<p class="hint">${tx('Mehr brauchst du nicht – und das ist eine gute Nachricht.','You don’t need more – and that’s good news.')}</p>`:''}`};
    root.addEventListener('change',run);run();
  },
  css:`.cm-f{margin-bottom:12px}`,
  after:tx(`<h2>Typische Kombinationen</h2>
${table([tx('Art von App','Kind of app'),tx('Modell','Model')],[
  ['Internes Tool, wenige Rollen','RBAC'],
  ['Fachanwendung mit Freigaben, Limits, Teams (Nordwind)','RBAC + ABAC-Bedingungen'],
  ['SaaS mit Kundenorganisationen','RBAC pro Mandant + ABAC'],
  ['Dokumente, Projekte, Teilen (wie Google Drive, Notion)','ReBAC + RBAC für Admin'],
  ['Viele Microservices, Compliance-Anforderungen','PBAC (Cedar/OPA) + RBAC-Rollen als Eingabe']
],{caption:'Kombinationen'})}`,`<h2>Typical combinations</h2>
${table(['Kind of app','Model'],[
  ['Internal tool, few roles','RBAC'],
  ['Business app with approvals, limits, teams (Nordwind)','RBAC + ABAC conditions'],
  ['SaaS with customer organizations','RBAC per tenant + ABAC'],
  ['Documents, projects, sharing (like Google Drive, Notion)','ReBAC + RBAC for admin'],
  ['Many microservices, compliance requirements','PBAC (Cedar/OPA) + RBAC roles as input']
],{caption:'Combinations'})}`),
  do:tx(['Klein anfangen, das Modell wachsen lassen.','Den Zugriff hinter einer eigenen Schnittstelle kapseln (<code>authz.can(user, action, resource)</code>), damit du das Modell darunter wechseln kannst.'],['Start small, let the model grow.','Encapsulate access behind your own interface (<code>authz.can(user, action, resource)</code>) so you can swap the model underneath.']),
  dont:tx(['Das mächtigste Modell nehmen, „weil wir es später vielleicht brauchen“.','Modelle mischen, ohne festzulegen, welches wofür zuständig ist.'],['Pick the most powerful model “because we might need it later”.','Mix models without defining which is responsible for what.']),
  why:tx('<p>Jedes Modell hat Betriebskosten: Rollen müssen gepflegt, Attribute aktuell, Tupel synchron, Policies getestet werden. Das richtige Modell ist das einfachste, das deine Fachregeln ehrlich abbildet. Eine gekapselte Schnittstelle <code>can(…)</code> hält den Weg offen, später zu wechseln.</p>','<p>Every model has running costs: roles must be maintained, attributes current, tuples in sync, policies tested. The right model is the simplest one that honestly expresses your business rules. An encapsulated <code>can(…)</code> interface keeps the door open to switch later.</p>')
});

  code:[
    {t:'auth.store.ts',lang:'ts',src:`export interface Me {
  id: string;
  name: string;
  team: string;
  permissions: Permission[];
}

@Service()
export class AuthStore {
  private readonly oidc = inject(OidcSecurityService);

  /** true/false from the OIDC library, as a signal */
  readonly isAuthenticated = toSignal(
    this.oidc.isAuthenticated$.pipe(map(r => r.isAuthenticated)), { initialValue: false });

  /** Server is the source of truth for permissions */
  private readonly meResource = httpResource<Me>(() =>
    this.isAuthenticated() ? '/api/me' : undefined);   // undefined → no request

  readonly me = computed(() => this.meResource.hasValue() ? this.meResource.value() : null);
  readonly loading = this.meResource.isLoading;
  readonly permissions = computed(() => new Set(this.me()?.permissions ?? []));

  can(p: Permission): boolean { return this.permissions().has(p); }
  canAny(...ps: Permission[]): boolean { return ps.some(p => this.can(p)); }

  login(returnUrl = '/') { this.oidc.authorize(undefined, { customParams: { state: returnUrl } }); }
  logout() { this.oidc.logoff().subscribe(); }
  reload() { this.meResource.reload(); }   // e.g. after a role change
}`,note:tx('Weil <code>can()</code> ein Signal liest, ist jeder Aufruf im Template oder in einem <code>computed</code> automatisch reaktiv. Melde Tom ab und wieder an – alles zeichnet sich neu, ohne dass eine Komponente etwas abonnieren muss.','Because <code>can()</code> reads a signal, every call in a template or a <code>computed</code> is automatically reactive. Sign Tom out and back in – everything re-renders without any component having to subscribe.')},
    {t:tx('Verwenden','Using it'),lang:'ts',src:`@Component({
  selector: 'app-invoice-toolbar',
  template: \`
    @if (auth.can('invoice:create')) {
      <button type="button" (click)="create()">New invoice</button>
    }\`,
})
export class InvoiceToolbar {
  protected readonly auth = inject(AuthStore);
}`}
  ],
  do:tx(['Rechte vom Server laden (<code>/api/me</code>) – dieselbe Logik wie bei der Durchsetzung.','Einen einzigen Store, alles andere als <code>computed</code>.','Ladezustand beachten: Solange <code>me()</code> fehlt, nichts Sensibles anzeigen (und nichts voreilig ausblenden, was dann flackert).'],['Load permissions from the server (<code>/api/me</code>) – the same logic as enforcement.','One single store, everything else as <code>computed</code>.','Respect the loading state: while <code>me()</code> is missing, show nothing sensitive (and don’t prematurely hide things that then flicker).']),
  dont:tx(['Rechte in jeder Komponente aus dem Token dekodieren.','Rechte in <code>localStorage</code> cachen – das ist eine Einladung zum Manipulieren (auch wenn der Server trotzdem prüft).','<code>BehaviorSubject</code> plus manuelles Abonnieren, wo ein Signal reicht.'],['Decode permissions from the token in every component.','Cache permissions in <code>localStorage</code> – an invitation to tamper (even though the server still checks).','<code>BehaviorSubject</code> plus manual subscriptions where a signal suffices.']),
  why:tx('<p>Wenn Frontend und Backend die Rechte unabhängig voneinander berechnen, laufen sie auseinander: Der Knopf ist da, die API sagt 403 – oder umgekehrt fehlt der Knopf für etwas, das erlaubt wäre. Mit <code>/api/me</code> gibt es eine Wahrheit, und das Frontend zeigt sie nur an. Signals sorgen dafür, dass sich jede Stelle von selbst aktualisiert.</p>','<p>When frontend and backend compute permissions independently, they drift apart: the button is there and the API says 403 – or the button is missing for something that would be allowed. With <code>/api/me</code> there’s one truth, and the frontend only displays it. Signals make every place update on its own.</p>')
});

  good:{code:`const API = 'https://api.nordwind.example/';

export const authInterceptor: HttpInterceptorFn = (req, next) => {
  if (!req.url.startsWith(API)) return next(req);             // never leak to third parties

  const tokens = inject(TokenService);
  const withToken = (t: string) => req.clone({ setHeaders: { Authorization: \`Bearer \${t}\` } });

  return next(withToken(tokens.accessToken())).pipe(
    catchError((err: unknown) => {
      if (!(err instanceof HttpErrorResponse) || err.status !== 401) return throwError(() => err);
      return tokens.refreshOnce().pipe(                       // shared by all waiting requests
        switchMap(t => next(withToken(t))),                   // retry exactly once
        catchError(e => { tokens.signOut(); return throwError(() => e); }));
    }));
};

@Service()
export class TokenService {

  private inFlight: Observable<string> | null = null;

      finalize(() => (this.inFlight = null)),
      shareReplay({ bufferSize: 1, refCount: false }));
    return this.inFlight;
  }

}`,note:tx('<code>??=</code> sorgt dafür, dass nur der erste 401 einen Refresh startet; alle weiteren hängen sich an dasselbe Observable.','<code>??=</code> makes sure only the first 401 starts a refresh; all others attach to the same observable.')},

  code:[
    {t:'permission.guard.ts',lang:'ts',src:`/** One factory for all routes: permission comes from the route data */
export const requirePermission: CanMatchFn = (route, segments) => {
  const auth = inject(AuthStore);
  const router = inject(Router);
  const needed = route.data?.['permission'] as Permission | undefined;

  if (!auth.isAuthenticated()) {
    const returnUrl = '/' + segments.map(s => s.path).join('/');
    return new RedirectCommand(router.parseUrl(\`/login?returnUrl=\${encodeURIComponent(returnUrl)}\`));
  }

    {t:'app.routes.ts',lang:'ts',src:`export const routes: Routes = [
