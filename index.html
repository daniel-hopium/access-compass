  do:tx(['Eine Guard-Fabrik, Permission in <code>data</code>.','<code>canMatch</code> für lazy Bereiche, <code>canActivate</code> nur, wenn du Parameter brauchst.','Nicht angemeldet → Login mit <code>returnUrl</code>; angemeldet ohne Recht → eigene Seite.'],['One guard factory, permission in <code>data</code>.','<code>canMatch</code> for lazy areas, <code>canActivate</code> only when you need parameters.','Not signed in → login with <code>returnUrl</code>; signed in without the right → a dedicated page.']),

LESSONS.push({
  id:'ng-directive',cat:'angular',
  title:tx('Komponenten zeigen oder verstecken: *appCan','Showing or hiding components: *appCan'),
  short:tx('Eine Structural Directive mit Signals – und wann ein schlichtes @if besser ist.','A structural directive with signals – and when a plain @if is better.'),
  keys:'structural directive strukturelle direktive appCan hasPermission templateRef viewContainerRef effect @if else template ui gating permission-based rendering',
  refs:[['Angular: Structural directives','https://angular.dev/guide/directives/structural-directives']],
  rule:tx('Für Teile der Oberfläche, die nur mit einem bestimmten Recht erscheinen, gibt es zwei gleichwertige Wege: <code>@if (auth.can(\'invoice:approve\'))</code> direkt im Template oder eine <b>Structural Directive</b> <code>*appCan="\'invoice:approve\'"</code>. Beide entfernen das Element ganz aus dem DOM – nicht nur unsichtbar. Die Direktive lohnt sich, wenn du mehrere Permissions, einen Else-Zweig und einheitliches Verhalten an vielen Stellen brauchst.','For parts of the UI that only appear with a certain permission there are two equivalent ways: <code>@if (auth.can(\'invoice:approve\'))</code> directly in the template, or a <b>structural directive</b> <code>*appCan="\'invoice:approve\'"</code>. Both remove the element from the DOM entirely – not just invisible. The directive pays off when you need several permissions, an else branch and consistent behavior in many places.'),
  glance:{rows:[
    ['<code>@if (auth.can(…))</code>',tx('Kein eigener Code, gut lesbar, reaktiv durch Signals.','No custom code, readable, reactive through signals.')],
    ['<code>*appCan</code>',tx('Eigene Direktive: <code>TemplateRef</code> + <code>ViewContainerRef</code>, reagiert per <code>effect()</code>.','Custom directive: <code>TemplateRef</code> + <code>ViewContainerRef</code>, reacts via <code>effect()</code>.')],
    [tx('Else-Template','Else template'),tx('<code>*appCan="\'invoice:pay\'; else noPay"</code> zeigt eine Alternative (Hinweis statt Knopf).','<code>*appCan="\'invoice:pay\'; else noPay"</code> shows an alternative (hint instead of button).')],
    [tx('Aus dem DOM, nicht versteckt','Out of the DOM, not hidden'),tx('Kein <code>[hidden]</code> oder <code>display:none</code> – sonst bleibt der Knopf per DevTools klickbar und Komponenten laufen trotzdem.','No <code>[hidden]</code> or <code>display:none</code> – otherwise the button stays clickable via DevTools and components still run.')]

  body:`<p class="hint">${NG_NOTE}</p>`,
  demoTitle:tx('Die Rechnungs-App mit *appCan','The invoicing app with *appCan'),
  demo:'<div id="dir-mini"></div>',
  init(root){const h=$('#dir-mini',root);return miniInit(h,p=>{h.innerHTML=miniHTML(p,{mode:'hide'})})},
  code:[
    {t:'can.directive.ts',lang:'ts',src:`@Directive({ selector: '[appCan]' })
export class CanDirective {
  private readonly auth = inject(AuthStore);
  private readonly tpl = inject(TemplateRef<unknown>);
  private readonly vcr = inject(ViewContainerRef);

  /** one permission or several (any of them is enough) */
  readonly appCan = input.required<Permission | Permission[]>();
  readonly appCanElse = input<TemplateRef<unknown> | null>(null);

  private shown: 'then' | 'else' | null = null;

  constructor() {
    effect(() => {
      const needed = this.appCan();
      const allowed = Array.isArray(needed) ? this.auth.canAny(...needed) : this.auth.can(needed);
      const next = allowed ? 'then' : this.appCanElse() ? 'else' : null;
      if (next === this.shown) return;                 // don't rebuild on every change
      this.vcr.clear();
      if (next === 'then') this.vcr.createEmbeddedView(this.tpl);
      if (next === 'else') this.vcr.createEmbeddedView(this.appCanElse()!);
      this.shown = next;
    });
  }

  static ngTemplateContextGuard(_d: CanDirective, _ctx: unknown): _ctx is object { return true; }
}`},
    {t:tx('Im Template','In the template'),lang:'html',src:`<button type="button" *appCan="'invoice:create'" (click)="create()">New invoice</button>

<ng-container *appCan="['invoice:pay', 'invoice:export']; else readOnly">
  <app-payment-panel [invoice]="invoice()" />
</ng-container>
<ng-template #readOnly><p>Payment is handled by accounting.</p></ng-template>

<!-- equivalent without a directive -->
@if (auth.can('invoice:create')) {
  <button type="button" (click)="create()">New invoice</button>
}`}
  ],
  lang:'html',
  bad:{code:`<!-- still in the DOM, still clickable, the component still loads data -->
<button type="button" [hidden]="!isAdmin" (click)="deleteAll()">Delete all</button>
<app-payment-panel [style.display]="role === 'ACCOUNTANT' ? 'block' : 'none'" />`},
  good:{code:`<button type="button" *appCan="'invoice:delete'" (click)="deleteAll()">Delete all</button>
<app-payment-panel *appCan="'invoice:pay'" />`,note:tx('Nicht erlaubte Teile existieren nicht – keine versteckten Knöpfe, keine Komponente, die im Hintergrund Daten lädt und 403 bekommt.','Disallowed parts don’t exist – no hidden buttons, no component loading data in the background and getting 403.')},
  do:tx(['Elemente aus dem DOM nehmen (<code>@if</code> oder Structural Directive).','Für den Normalfall <code>@if (auth.can(…))</code>, die Direktive für wiederkehrende Muster.','Permissions statt Rollen an die Direktive geben.'],['Remove elements from the DOM (<code>@if</code> or a structural directive).','<code>@if (auth.can(…))</code> for the normal case, the directive for recurring patterns.','Pass permissions, not roles, to the directive.']),
  dont:tx(['<code>[hidden]</code>, <code>display:none</code> oder <code>opacity:0</code> als Rechte-Mechanismus.','Ganze Seiten per Direktive ausblenden – dafür gibt es Guards.','Rechte in der Direktive selbst berechnen statt im Store.'],['<code>[hidden]</code>, <code>display:none</code> or <code>opacity:0</code> as a permissions mechanism.','Hide whole pages via directive – that’s what guards are for.','Compute permissions in the directive itself instead of the store.']),
  why:tx('<p>Ein Knopf, den jemand nicht benutzen darf, ist Lärm – und eine Einladung, es trotzdem zu versuchen. Strukturell entfernt, ist er wirklich weg: Keine Komponente startet, kein Request geht raus. Die Sicherheit liefert trotzdem die API; die Direktive sorgt dafür, dass die Oberfläche ehrlich ist.</p>','<p>A button someone may not use is noise – and an invitation to try anyway. Structurally removed, it’s really gone: no component starts, no request goes out. Security still comes from the API; the directive makes sure the UI is honest.</p>')
});

LESSONS.push({
  id:'ng-hide-disable',cat:'angular',
  title:tx('Ausblenden oder deaktivieren?','Hide or disable?'),
  short:tx('Wann ein Knopf verschwindet, wann er mit Begründung grau wird.','When a button disappears, when it turns grey with a reason.'),
  keys:'ausblenden deaktivieren hide disable disabled aria-disabled tooltip begründung reason ux benutzerführung',
  refs:[['UI-Atlas (Schwester-App)','https://daniel-hopium.github.io/ui-atlas/'],['MDN: aria-disabled','https://developer.mozilla.org/docs/Web/Accessibility/ARIA/Attributes/aria-disabled']],
  rule:tx('<b>Ausblenden</b>, wenn die Person die Aktion grundsätzlich nie ausführen wird – sie gehört nicht zu ihrer Rolle (Vera und „Bezahlen“). <b>Deaktivieren mit Begründung</b>, wenn die Aktion zu ihrer Rolle gehört, aber gerade nicht geht – wegen Status, Limit oder Vier-Augen-Regel (Tom und eine Rechnung über seinem Limit). So versteht jeder, was er kann und warum etwas nicht geht.','<b>Hide</b> when the person will never perform the action at all – it isn’t part of their role (Vera and “pay”). <b>Disable with a reason</b> when the action belongs to their role but isn’t possible right now – due to status, limit or the four-eyes rule (Tom and an invoice above his limit). That way everyone understands what they can do and why something isn’t possible.'),

  demo:`<fieldset class="seg"><legend>${tx('Darstellung','Presentation')}</legend><div class="seg-opts"><label><input type="radio" name="hd-m" value="naive">${tx('Alles zeigen (naiv)','Show everything (naive)')}</label><label><input type="radio" name="hd-m" value="hide">${tx('Nur ausblenden','Hide only')}</label><label><input type="radio" name="hd-m" value="smart" checked>${tx('Ausblenden + deaktivieren','Hide + disable')}</label></div></fieldset><div id="hd-mini"></div>`,

  code:[{t:tx('Begründung aus dem Server-Ergebnis','Reason from the server result'),lang:'ts',src:`// API: { id: 'R-1003', …, _actions: { approve: { allowed: false, reason: 'ABOVE_LIMIT' } } }

  do:tx(['Rollenfremdes ausblenden, Situatives deaktivieren und erklären.','<code>aria-disabled</code> plus sichtbare Begründung.','Begründungen vom Server liefern lassen (Code wie <code>ABOVE_LIMIT</code>), Text im Frontend.'],['Hide what’s foreign to the role, disable and explain what’s situational.','<code>aria-disabled</code> plus a visible reason.','Have the server deliver reasons (codes like <code>ABOVE_LIMIT</code>), text in the frontend.']),
  dont:tx(['Alles anzeigen und auf den 403 warten.','Graue Knöpfe ohne jede Erklärung.','Nur <code>title</code>-Tooltips als Begründung – auf Touch-Geräten und per Tastatur kaum erreichbar.'],['Show everything and wait for the 403.','Grey buttons without any explanation.','Only <code>title</code> tooltips as the reason – hardly reachable on touch devices and by keyboard.']),
  why:tx('<p>Die Oberfläche ist die erste Stelle, an der Menschen dein Berechtigungskonzept erleben. Ein fehlender Knopf ohne Grund fühlt sich wie ein Fehler an, ein Knopf, der 403 liefert, wie ein kaputtes System. Die Unterscheidung „nie“ gegen „gerade nicht“ macht aus Regeln Verständnis – und spart Support-Tickets.</p>','<p>The UI is the first place people experience your permission concept. A missing button without a reason feels like a bug, a button that returns 403 like a broken system. The distinction “never” versus “not right now” turns rules into understanding – and saves support tickets.</p>')

  code:[{t:'nav.ts',lang:'ts',src:`export interface NavData { label: string; icon: string; order: number; }

/** Collects every route (also children) that has nav data */
function navEntries(routes: Routes, base = ''): Array<NavData & { path: string; permission?: Permission }> {

  });
}

  demoHint:tx('Links die Regeln, die der Server für die Person oben schickt; rechts das Ergebnis pro Rechnung.','Left: the rules the server sends for the person at the top; right: the result per invoice.'),
  demo:`<div class="two"><div><h3>GET /api/me/abilities</h3><pre class="out" id="ca-rules"></pre></div><div><h3>ability.can('approve', invoice)</h3><ul class="trace" id="ca-res"></ul></div></div>`,
  init(root){
    const rulesFor=p=>{const r=[];if(can('invoice:read',p))r.push(p.roles.includes('ACCOUNTANT')||p.roles.includes('ADMIN')?{action:'read',subject:'Invoice'}:{action:'read',subject:'Invoice',conditions:{team:p.team}});
      if(can('invoice:approve',p)){r.push({action:'approve',subject:'Invoice',conditions:{team:p.team,status:'submitted',amount:{$lte:p.limit}}});r.push({action:'approve',subject:'Invoice',inverted:true,conditions:{createdBy:p.id},reason:'OWN_INVOICE'})}
      if(can('invoice:pay',p))r.push({action:'pay',subject:'Invoice',conditions:{status:'approved'}});return r};
    const match=(c,o)=>!c||Object.entries(c).every(([k,v])=>typeof v==='object'?('$lte' in v?o[k]<=v.$lte:true):o[k]===v);
    const canDo=(rules,action,o)=>{let res=false,why='';for(const r of rules){if(r.action!==action)continue;if(match(r.conditions,o)){if(r.inverted)return[false,r.reason];res=true}}

    return onPersona(p=>{const rules=rulesFor(p);$('#ca-rules',root).textContent=JSON.stringify(rules,null,2);
      $('#ca-res',root).innerHTML=INVOICES.map(i=>{const [ok,why]=canDo(rules,'approve',i);return`<li class="t-${ok?'ok':'no'}">${ic(ok?'ok':'xc')}<span><b class="mono">${i.id}</b> ${TEAMS[i.team]} · ${eur(i.amount)} · ${STATUS[i.status]}${ok?'':` <span class="hint">${why}</span>`}</span></li>`}).join('')});
  },
  code:[
    {t:'ability.ts',lang:'ts',src:`import { createMongoAbility, MongoAbility, RawRuleOf, subject } from '@casl/ability';

type Actions = 'read' | 'create' | 'edit' | 'approve' | 'pay' | 'delete';
type Subjects = 'Invoice' | Invoice | 'all';
export type AppAbility = MongoAbility<[Actions, Subjects]>;

@Service()
export class AbilityStore {
  private readonly auth = inject(AuthStore);
  private readonly ability = createMongoAbility<AppAbility>();
  private readonly version = signal(0);         // bumps on every rule update → signals re-run

  private readonly rules = httpResource<RawRuleOf<AppAbility>[]>(() =>
    this.auth.isAuthenticated() ? '/api/me/abilities' : undefined);

  constructor() {
    effect(() => {
      this.ability.update(this.rules.hasValue() ? this.rules.value() : []);
      this.version.update(v => v + 1);
    });
  }

  can(action: Actions, inv: Invoice): boolean {
    this.version();                              // dependency for computed/templates
    return this.ability.can(action, subject('Invoice', inv));
  }
}`},
    {t:tx('Im Template','In the template'),lang:'html',src:`@for (inv of invoices(); track inv.id) {
  <tr>
    <td>{{ inv.id }}</td>
    <td>
      @if (abilities.can('approve', inv)) {
        <button type="button" (click)="approve(inv)">Approve</button>
      }
    </td>
  </tr>
}`},
    {t:tx('Spring: Regeln pro Benutzer bauen','Spring: building rules per user'),lang:'java',src:`@GetMapping("/api/me/abilities")
List<Map<String, Object>> abilities(@AuthenticationPrincipal UserPrincipal me) {
  var rules = new ArrayList<Map<String, Object>>();
  if (me.has("invoice:approve")) {
    rules.add(Map.of("action", "approve", "subject", "Invoice",
        "conditions", Map.of("team", me.team(), "status", "submitted",
                             "amount", Map.of("$lte", me.approvalLimit()))));
    rules.add(Map.of("action", "approve", "subject", "Invoice", "inverted", true,
        "conditions", Map.of("createdBy", me.id()), "reason", "OWN_INVOICE"));
  }
  return rules;   // the same conditions as InvoicePolicy.canApprove – ideally generated from it
}`,note:tx('Die Bedingungen spiegeln die Server-Policy. Wer es noch einfacher will: Die API liefert pro Objekt gleich die erlaubten Aktionen (<code>_actions</code>) – dann braucht das Frontend gar keine Regel-Engine.','The conditions mirror the server policy. For even simpler: the API delivers the allowed actions per object (<code>_actions</code>) – then the frontend needs no rule engine at all.')}
  ],
  do:tx(['Regeln vom Server erzeugen lassen, im Frontend nur auswerten.','<code>inverted</code>-Regeln mit <code>reason</code> für erklärbare Verbote.','Für Listen aus der API lieber <code>_actions</code> pro Objekt mitliefern; CASL lohnt sich bei Offline-Fähigkeit oder vielen lokalen Objekten.'],['Let the server generate rules, only evaluate them in the frontend.','<code>inverted</code> rules with <code>reason</code> for explainable denials.','For lists from the API, prefer delivering <code>_actions</code> per object; CASL pays off for offline capability or many local objects.']),
  dont:tx(['Regeln im Frontend hart kodieren und im Backend separat pflegen.','CASL-Ergebnisse als Sicherheit verstehen.'],['Hard-code rules in the frontend and maintain them separately in the backend.','Treat CASL results as security.']),
  why:tx('<p>Objektbezogene Knöpfe („Freigeben“ nur bei passenden Rechnungen) sind der Punkt, an dem Frontends anfangen, Geschäftslogik zu kopieren. CASL gibt dieser Logik eine Form – und wenn die Regeln vom Server kommen, ist es keine Kopie mehr, sondern eine Übertragung.</p>','<p>Object-related buttons (“approve” only for matching invoices) are where frontends start copying business logic. CASL gives that logic a shape – and when the rules come from the server, it’s no longer a copy but a transfer.</p>')
});

LESSONS.push({
  id:'ng-forms',cat:'angular',
  title:tx('Formulare je nach Recht mit Signal Forms','Forms by permission with Signal Forms'),
  short:tx('readonly, disabled und hidden als Regeln im Formular-Schema.','readonly, disabled and hidden as rules in the form schema.'),
  keys:'signal forms form() formField readonly disabled hidden schema feld field berechtigung permission formular angular 22',
  refs:[['Angular: Signal Forms','https://angular.dev/guide/forms/signals/overview'],['Angular: Field state','https://angular.dev/guide/forms/signals/field-state-management']],
  rule:tx('Felder, die jemand sehen, aber nicht ändern darf, sind <b>readonly</b>; Felder, die er gar nicht sehen darf, sind <b>hidden</b> – und kommen am besten gar nicht erst vom Server. In Signal Forms (stabil seit Angular 22) stehen diese Regeln direkt im <b>Schema</b> des Formulars, reaktiv über <code>auth.can()</code>. Beim Speichern prüft der Server trotzdem jedes Feld.','Fields someone may see but not change are <b>readonly</b>; fields they may not see at all are <b>hidden</b> – and ideally don’t come from the server in the first place. In Signal Forms (stable since Angular 22) these rules live directly in the form’s <b>schema</b>, reactive via <code>auth.can()</code>. On save, the server still checks every field.'),
  glance:{rows:[
    ['<code>readonly(path, fn)</code>',tx('Feld sichtbar, nicht änderbar. Wert wird mitgeschickt.','Field visible, not editable. Value is submitted.')],
    ['<code>disabled(path, fn)</code>',tx('Feld deaktiviert, kann einen Grund liefern (String statt <code>true</code>). Wird nicht validiert.','Field disabled, can return a reason (a string instead of <code>true</code>). Not validated.')],
    ['<code>hidden(path, fn)</code>',tx('Feld gilt als versteckt (<code>field().hidden()</code>); das Template rendert es nicht.','Field counts as hidden (<code>field().hidden()</code>); the template doesn’t render it.')],
    [tx('Server','Server'),tx('Eigene Request-DTOs pro Aktion; Felder ohne Recht werden abgelehnt, nicht still übernommen.','Dedicated request DTOs per action; fields without permission are rejected, not silently applied.')]

  body:`<p class="hint">${NG_NOTE}</p>`,

  init(root){

    return onPersona(p=>{
      if(!can('invoice:read',p)){f.innerHTML=verdict(false,tx('Kein Zugriff auf Rechnungen','No access to invoices'));return}
      const edit=can('invoice:edit',p),pay=can('invoice:pay',p),lead=p.roles.includes('TEAM_LEAD');
      const fld=(id,label,val,{ro=false,hide=false,dis=''}={})=>hide?`<p class="hint fm-hidden">${label}: <i>${tx('hidden – nicht gerendert','hidden – not rendered')}</i></p>`:`<div class="field"><label for="fm-${id}">${label}${ro?` <span class="pill">readonly</span>`:''}${dis?` <span class="pill">disabled</span>`:''}</label><input class="input" id="fm-${id}" value="${esc(val)}" ${ro?'readonly':''} ${dis?`disabled aria-describedby="fm-${id}-d"`:''}>${dis?`<p class="hint" id="fm-${id}-d">${dis}</p>`:''}</div>`;
      f.innerHTML=fld('cust',tx('Kunde','Customer'),'Café Linde',{ro:!edit})+fld('amt',tx('Betrag','Amount'),'4300',{ro:!edit})+fld('iban','IBAN','AT61 1904 3002 3457 3201',{hide:!pay,ro:!edit})+fld('note',tx('Interne Notiz','Internal note'),tx('Skonto 2 %','2 % discount'),{hide:!(pay||lead),ro:!edit})+fld('status','Status',STATUS.submitted,{dis:tx('Status ändert sich nur über „Freigeben“ und „Bezahlen“.','Status only changes via “approve” and “pay”.')})+(edit?`<button type="button" class="btn btn-primary">${tx('Speichern','Save')}</button>`:`<p class="hint">${tx('Nur lesen – kein invoice:edit.','Read only – no invoice:edit.')}</p>`);

  css:`.fm-form{display:grid;gap:12px;max-width:28rem}.fm-form .input[readonly]{background:var(--surface-2)}.fm-hidden{margin:0}`,
  code:[{t:'invoice-edit.ts',lang:'ts',src:`import { form, FormField, required, readonly, disabled, hidden } from '@angular/forms/signals';

@Component({
  selector: 'app-invoice-edit',
  imports: [FormField],
  template: \`
    <label>Customer <input [formField]="f.customer"></label>
    <label>Amount <input type="number" [formField]="f.amount"></label>
    @if (!f.iban().hidden()) {
      <label>IBAN <input [formField]="f.iban"></label>
    }
    <label>Status <input [formField]="f.status"></label>
    @for (r of f.status().disabledReasons(); track r) { <p class="hint">{{ r.message }}</p> }
  \`,
})
export class InvoiceEdit {
  private readonly auth = inject(AuthStore);
  readonly invoice = input.required<InvoiceDraft>();
  private readonly model = linkedSignal(() => ({ ...this.invoice() }));

  protected readonly f = form(this.model, (s) => {
    required(s.customer);
    readonly(s.customer, () => !this.auth.can('invoice:edit'));
    readonly(s.amount, () => !this.auth.can('invoice:edit'));
    hidden(s.iban, () => !this.auth.can('invoice:pay'));
    disabled(s.status, () => 'Status changes only via approve and pay.');
  });
}`,note:tx('Die Regeln sind Funktionen, die Signals lesen – ändern sich die Rechte, ändert sich das Formular. Besser noch als <code>hidden</code>: Der Server schickt die IBAN gar nicht erst mit, dann gibt es nichts zu verstecken.','The rules are functions that read signals – when permissions change, the form changes. Even better than <code>hidden</code>: the server doesn’t send the IBAN at all, then there’s nothing to hide.')}],
  do:tx(['Rechte-Regeln ins Formular-Schema, nicht als <code>@if</code>-Gewirr ins Template.','Sensible Felder serverseitig weglassen statt nur verstecken.','Server-seitig pro Aktion eigene DTOs annehmen.'],['Put permission rules into the form schema, not as an <code>@if</code> tangle in the template.','Leave sensitive fields out server-side instead of just hiding them.','Accept dedicated DTOs per action on the server.']),
  dont:tx(['Ein Feld nur per CSS verstecken und den Wert mitschicken.','Darauf vertrauen, dass ein <code>readonly</code>-Feld nicht verändert ankommt.'],['Hide a field only via CSS and submit its value.','Trust that a <code>readonly</code> field doesn’t arrive changed.']),
  why:tx('<p>Formulare sind der Ort, an dem Rechte in die Daten zurückfließen. Ein „schreibgeschütztes“ Feld ist im Browser nur eine Bitte – mit den DevTools ist es in Sekunden änderbar. Signal Forms machen die Regeln im Frontend sauber und lesbar, die Wirkung muss aber der Server garantieren.</p>','<p>Forms are where permissions flow back into data. A “read-only” field in the browser is merely a request – with the DevTools it can be changed in seconds. Signal Forms make the rules clean and readable in the frontend, but the server has to guarantee the effect.</p>')
});

LESSONS.push({
  id:'ng-errors',cat:'angular',
  title:tx('401, 403 und abgelaufene Sessions','401, 403 and expired sessions'),
  short:tx('Jeder Fehler bekommt seine eigene, verständliche Reaktion.','Every error gets its own understandable reaction.'),
  keys:'401 403 404 fehlerbehandlung error handling session abgelaufen expired returnUrl forbidden page toast interceptor global error',
  refs:[['Angular: Error handling','https://angular.dev/best-practices/error-handling']],
  rule:tx('Die App reagiert auf jede Antwort anders: <b>401</b> → still erneuern, sonst zum Login mit Rücksprung, ohne Eingaben zu verlieren. <b>403</b> → „Dafür fehlen dir die Rechte“ und die Rechte neu laden (sie könnten sich geändert haben). <b>404</b> bei fremden Objekten → „nicht gefunden“. Und läuft die Session bald ab, warnt die App rechtzeitig.','The app reacts differently to each response: <b>401</b> → renew silently, otherwise to login with a return URL, without losing input. <b>403</b> → “You lack the permission for this” and reload permissions (they may have changed). <b>404</b> for foreign objects → “not found”. And if the session is about to expire, the app warns in time.'),
  glance:{head:[tx('Antwort','Response'),tx('Reaktion','Reaction')],rows:[
    ['<code>401</code>',tx('Einmal erneuern und wiederholen. Scheitert das: Entwurf sichern, zum Login mit <code>returnUrl</code>.','Renew once and retry. If that fails: save the draft, go to login with <code>returnUrl</code>.')],
    ['<code>403</code>',tx('Meldung, kein Login. <code>auth.reload()</code>, damit die Oberfläche den neuen Stand zeigt.','Message, no login. <code>auth.reload()</code> so the UI shows the new state.')],
    ['<code>404</code>',tx('Neutral „nicht gefunden“ – auch wenn der Server ein fremdes Objekt so verbirgt.','Neutral “not found” – even when the server hides a foreign object that way.')],
    ['<code>invalid_grant</code>',tx('Refresh Token ungültig (widerrufen, abgelaufen): sauber abmelden.','Refresh token invalid (revoked, expired): sign out cleanly.')],
    [tx('Session-Warnung','Session warning'),tx('Vor Ablauf der IdP-Session (Max Lifetime) einen Dialog „Weiterarbeiten?“ zeigen.','Before the IdP session ends (max lifetime), show a “keep working?” dialog.')]
  ]},
  demoHint:tx('Tom bearbeitet gerade eine Rechnung und klickt „Speichern“. Was antwortet der Server?','Tom is editing an invoice and clicks “save”. What does the server answer?'),
  demo:`<div class="row"><div class="field"><label for="er-r">${tx('Antwort des Servers','Server response')}</label><select id="er-r"><option value="401r">${tx('401, Refresh klappt','401, refresh works')}</option><option value="401x">${tx('401, Refresh scheitert (invalid_grant)','401, refresh fails (invalid_grant)')}</option><option value="403">403 Forbidden</option><option value="404">404 Not Found</option><option value="500">500</option></select></div><button type="button" class="btn btn-primary" id="er-go">${tx('Speichern','Save')}</button></div><div id="er-out"></div>`,
  init(root){
    const R={'401r':[['ok',tx('Interceptor: 401 → Refresh → Anfrage wiederholt → 200.','Interceptor: 401 → refresh → request retried → 200.')],verdict(true,tx('Gespeichert','Saved'),tx('Tom hat nichts davon bemerkt.','Tom noticed nothing.'))],
      '401x':[['no',tx('Interceptor: 401 → Refresh → invalid_grant.','Interceptor: 401 → refresh → invalid_grant.')],verdict(false,tx('„Deine Sitzung ist abgelaufen. Dein Entwurf ist gesichert.“','“Your session has expired. Your draft is saved.”'),tx('Entwurf in sessionStorage, dann Login mit returnUrl=/invoices/R-1002/edit. Nach dem Login ist der Entwurf wieder da.','Draft in sessionStorage, then login with returnUrl=/invoices/R-1002/edit. After login the draft is back.'),'is-warn')],
      '403':[['no',tx('Kein Retry, kein Login. AuthStore.reload() – Toms Rechte haben sich vielleicht geändert.','No retry, no login. AuthStore.reload() – Tom’s permissions may have changed.')],verdict(false,tx('„Dafür fehlen dir die Rechte.“','“You lack the permission for this.”'),tx('Die Oberfläche zeigt danach den aktuellen Stand – der Knopf ist jetzt evtl. weg.','The UI then shows the current state – the button may be gone now.'))],
      '404':[['no',tx('Objekt existiert nicht (oder ist für Tom unsichtbar).','Object doesn’t exist (or is invisible to Tom).')],verdict(false,tx('„Diese Rechnung gibt es nicht (mehr).“','“This invoice doesn’t exist (anymore).”'),tx('Keine Unterscheidung zwischen „gelöscht“ und „fremd“ – das ist Absicht.','No distinction between “deleted” and “foreign” – that’s on purpose.'))],
      '500':[['no',tx('Kein Rechte-Thema – allgemeine Fehlerbehandlung.','Not a permissions topic – general error handling.')],verdict(false,tx('„Etwas ist schiefgegangen. Bitte versuch es noch einmal.“','“Something went wrong. Please try again.”'),'')]};
    $('#er-go',root).addEventListener('click',()=>{const [s,v]=R[$('#er-r',root).value];$('#er-out',root).innerHTML=traceHTML([s])+`<div style="margin-top:10px">${v}</div>`});
  },
  code:[{t:'auth-errors.interceptor.ts',lang:'ts',src:`export const authErrorInterceptor: HttpInterceptorFn = (req, next) => {
  const auth = inject(AuthStore);
  const toast = inject(ToastService);
  const router = inject(Router);
  const drafts = inject(DraftStore);

  return next(req).pipe(
    catchError((err: unknown) => {
      if (err instanceof HttpErrorResponse) {
        switch (err.status) {
          case 401:   // the token interceptor already tried to refresh → session is gone
            drafts.saveCurrent();
            auth.login(router.url);
            break;
          case 403:
            toast.error($localize\`You lack the permission for this.\`);
            auth.reload();                       // permissions may have changed
            break;
        }
      }
      return throwError(() => err);
    }));
};`,note:tx('Alle <code>inject()</code>-Aufrufe stehen oben – im <code>catchError</code> gibt es keinen Injection Context mehr. Reihenfolge in <code>withInterceptors</code>: zuerst Token/Refresh, dann Fehlerbehandlung.','All <code>inject()</code> calls are at the top – inside <code>catchError</code> there’s no injection context anymore. Order in <code>withInterceptors</code>: token/refresh first, then error handling.')}],
  do:tx(['401 und 403 getrennt behandeln.','Bei 401 Eingaben sichern und nach dem Login zurückführen.','Bei 403 die Rechte neu laden.'],['Handle 401 and 403 separately.','On 401 save input and return after login.','On 403 reload permissions.']),
  dont:tx(['Bei jedem Fehler zum Login.','Rohfehler („Forbidden: AccessDeniedException at …“) anzeigen.','Unterschiedliche Meldungen für „gibt es nicht“ und „darfst du nicht sehen“.'],['Go to login on every error.','Show raw errors (“Forbidden: AccessDeniedException at …”).','Different messages for “doesn’t exist” and “you may not see it”.']),
  why:tx('<p>Wie eine App mit verweigertem Zugriff umgeht, entscheidet, ob Benutzer dem System vertrauen. Ein verlorenes Formular nach abgelaufener Session ist ärgerlicher als jede Sicherheitsregel – und genau das führt dazu, dass jemand fordert, die Session-Dauer auf eine Woche zu setzen.</p>','<p>How an app handles denied access decides whether users trust the system. A lost form after an expired session is more annoying than any security rule – and that’s exactly what leads someone to demand a one-week session lifetime.</p>')
});

LESSONS.push({
  id:'ng-testing',cat:'angular',
  title:tx('Rechte testen in Angular','Testing permissions in Angular'),
  short:tx('Guard, Direktive und Store mit Vitest – als Matrix aus Person und Erwartung.','Guard, directive and store with Vitest – as a matrix of person and expectation.'),
  keys:'test testing vitest testbed runInInjectionContext guard test directive test fake authstore matrix it.each',
  refs:[['Angular: Testing','https://angular.dev/guide/testing'],['Vitest','https://vitest.dev/']],
  rule:tx('Rechte testet man als <b>Matrix</b>: Für jede Person (oder Permission-Menge) steht fest, was erlaubt ist und was nicht – und ein Test prüft jede Zelle. Im Frontend ersetzt ein <b>Fake-AuthStore</b> mit festen Permissions den echten; Guards laufen per <code>TestBed.runInInjectionContext</code>, Direktiven in einer kleinen Host-Komponente.','Permissions are tested as a <b>matrix</b>: for every person (or permission set) it’s defined what’s allowed and what isn’t – and a test checks every cell. In the frontend, a <b>fake AuthStore</b> with fixed permissions replaces the real one; guards run via <code>TestBed.runInInjectionContext</code>, directives in a small host component.'),
  glance:{rows:[
    ['Fake-Store',tx('<code>{ provide: AuthStore, useValue: fakeAuth([\'invoice:read\']) }</code> – keine HTTP-Aufrufe, keine Tokens.','<code>{ provide: AuthStore, useValue: fakeAuth([\'invoice:read\']) }</code> – no HTTP calls, no tokens.')],
    ['<code>runInInjectionContext</code>',tx('Funktionale Guards brauchen einen Injection Context für <code>inject()</code>.','Functional guards need an injection context for <code>inject()</code>.')],
    ['<code>it.each</code>',tx('Eine Tabelle, ein Test pro Zeile – liest sich wie die Rechte-Matrix.','One table, one test per row – reads like the permission matrix.')],
    [tx('Negativfälle','Negative cases'),tx('Mindestens so viele „darf nicht“-Tests wie „darf“-Tests.','At least as many “may not” tests as “may” tests.')]
  ]},
  body:`<p class="hint">${NG_NOTE} ${tx('Vitest ist seit Angular 21 der Standard-Testrunner neuer Projekte.','Vitest has been the default test runner for new projects since Angular 21.')}</p>`,
  demoTitle:tx('Test-Lauf','Test run'),demoHint:tx('Baue einen Fehler in den Guard ein und lass die Tests laufen.','Put a bug into the guard and run the tests.'),
  demo:`<label class="check-row"><input type="checkbox" id="tt-bug">${tx('Fehler einbauen: Guard prüft nur „angemeldet“, nicht die Permission','Introduce a bug: guard checks only “signed in”, not the permission')}</label><button type="button" class="btn btn-primary" id="tt-run">${ic('play')}npx ng test</button><ul class="log" id="tt-log" style="margin-top:10px"></ul>`,
  init(root){
    $('#tt-run',root).addEventListener('click',()=>{const bug=$('#tt-bug',root).checked;const cases=[];
      PERSONAS.forEach(p=>[['/invoices','invoice:read'],['/admin','user:manage'],['/reports','report:read']].forEach(([u,perm])=>{const exp=p.roles.length?can(perm,p):'login';const got=!p.roles.length?'login':bug?true:can(perm,p);cases.push([`${p.name} → ${u}`,exp,got])}));
      const fail=cases.filter(c=>c[1]!==c[2]).length;
      $('#tt-log',root).innerHTML=cases.map(([n,e,g])=>`<li class="l-${e===g?'ok':'no'}">${e===g?'✓':'✗'} requirePermission: ${n} ${tx('erwartet','expects')} ${e}${e===g?'':`, ${tx('bekommt','got')} ${g}`}</li>`).join('')+`<li class="l-${fail?'no':'ok'}"><b>Tests: ${fail?`${fail} failed, `:''}${cases.length-fail} passed (${cases.length})</b></li>`});
  },
  code:[
    {t:'testing/fake-auth.ts',lang:'ts',src:`export function fakeAuth(permissions: Permission[] = [], authenticated = true): Partial<AuthStore> {
  const set = new Set(permissions);
  return {
    isAuthenticated: signal(authenticated).asReadonly(),
    can: (p: Permission) => set.has(p),
    canAny: (...ps: Permission[]) => ps.some(p => set.has(p)),
  };
}`},
    {t:'permission.guard.spec.ts',lang:'ts',src:`describe('requirePermission', () => {
  const run = (perms: Permission[] | null, needed: Permission) => {
    TestBed.configureTestingModule({
      providers: [provideRouter([]),
        { provide: AuthStore, useValue: fakeAuth(perms ?? [], perms !== null) }],
    });
    const route: Route = { path: 'x', data: { permission: needed } };
    return TestBed.runInInjectionContext(() => requirePermission(route, [new UrlSegment('x', {})]));
  };

  it.each([
    // person          permissions                       route needs        expected
    ['Vera',           ['invoice:read', 'report:read'],  'invoice:read',    true],
    ['Vera',           ['invoice:read', 'report:read'],  'user:manage',     false],
    ['Ada',            ['invoice:read', 'user:manage'],  'user:manage',     true],

@EnableMethodSecurity                       // @PreAuthorize & co.
class SecurityConfig {

  @Bean
  SecurityFilterChain api(HttpSecurity http, KeycloakJwtConverter jwtConverter) throws Exception {
    return http
        .securityMatcher("/api/**")
        .cors(Customizer.withDefaults())
        .csrf(csrf -> csrf.disable())                                  // bearer only, no cookies
        .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))
        .oauth2ResourceServer(o -> o.jwt(j -> j.jwtAuthenticationConverter(jwtConverter)))
        .authorizeHttpRequests(a -> a
            .requestMatchers(HttpMethod.GET, "/api/me", "/api/me/**").authenticated()
            .requestMatchers(HttpMethod.GET, "/api/invoices/**").hasAuthority("invoice:read")
            .requestMatchers(HttpMethod.POST, "/api/invoices").hasAuthority("invoice:create")
            .requestMatchers(HttpMethod.POST, "/api/invoices/*/approve").hasAuthority("invoice:approve")
            .requestMatchers(HttpMethod.POST, "/api/invoices/*/pay").hasAuthority("invoice:pay")
            .requestMatchers("/api/admin/users/**").hasAuthority("user:manage")
            .anyRequest().denyAll())
        .build();
  }

  @Bean
  CorsConfigurationSource cors() {
    var c = new CorsConfiguration();
    c.setAllowedOrigins(List.of("https://app.nordwind.example"));
    c.setAllowedMethods(List.of("GET", "POST", "PUT", "DELETE"));
    c.setAllowedHeaders(List.of("Authorization", "Content-Type"));
    var src = new UrlBasedCorsConfigurationSource();
    src.registerCorsConfiguration("/api/**", c);
    return src;
  }
}`,note:tx('Spring Security 7 kennt nur noch die Lambda-DSL (kein <code>.and()</code> mehr) und <code>authorizeHttpRequests</code> statt des alten <code>authorizeRequests</code>. Den Converter zeigt die nächste Lektion.','Spring Security 7 only knows the lambda DSL (no more <code>.and()</code>) and <code>authorizeHttpRequests</code> instead of the old <code>authorizeRequests</code>. The converter is in the next lesson.')}

  code:[{t:'KeycloakJwtConverter.java',lang:'java',src:`@Component
class KeycloakJwtConverter implements Converter<Jwt, AbstractAuthenticationToken> {

  private final JwtGrantedAuthoritiesConverter scopes = new JwtGrantedAuthoritiesConverter(); // SCOPE_…
  private final RolePermissions matrix;

  KeycloakJwtConverter(RolePermissions matrix) { this.matrix = matrix; }

  @Override
  public AbstractAuthenticationToken convert(Jwt jwt) {
    Collection<String> roles = Optional.ofNullable(jwt.getClaimAsMap("realm_access"))
        .map(ra -> (Collection<String>) ra.get("roles"))
        .orElse(List.of());

    Set<GrantedAuthority> authorities = new HashSet<>(scopes.convert(jwt));
    roles.forEach(r -> authorities.add(new SimpleGrantedAuthority("ROLE_" + r)));  // optional
    authorities.addAll(matrix.authoritiesFor(roles));                             // invoice:approve …

    return new JwtAuthenticationToken(jwt, authorities, jwt.getClaimAsString("preferred_username"));
  }
}`,note:tx('Liegen die Permissions schon als Client-Rollen im Token (<code>resource_access.invoice-api.roles</code>), liest der Converter die direkt – dann entfällt die Matrix im Code.','If the permissions are already in the token as client roles (<code>resource_access.invoice-api.roles</code>), the converter reads them directly – then the matrix in code goes away.')}],

  code:[{t:tx('Eigener AuthorizationManager für eine URL-Regel','Custom AuthorizationManager for a URL rule'),lang:'java',src:`// only from the company network or with MFA
AuthorizationManager<RequestAuthorizationContext> officeOrMfa = (auth, ctx) -> {
  boolean office = ctx.getRequest().getRemoteAddr().startsWith("10.20.");
  boolean mfa = auth.get() instanceof JwtAuthenticationToken t
      && "mfa".equals(t.getToken().getClaimAsString("acr"));
  return new AuthorizationDecision(office || mfa);
};

http.authorizeHttpRequests(a -> a
    .requestMatchers(HttpMethod.POST, "/api/invoices/*/pay")
        .access(AuthorizationManagers.allOf(hasAuthority("invoice:pay"), officeOrMfa))
    …
    .anyRequest().denyAll());`}],
  do:tx(['Von spezifisch nach allgemein ordnen, <code>denyAll()</code> zuletzt.','HTTP-Methode immer mit angeben, wo sie zählt.','URL-Regeln grob, Objektregeln in der Methode.'],['Order from specific to general, <code>denyAll()</code> last.','Always specify the HTTP method where it matters.','URL rules coarse, object rules in the method.']),
  dont:tx(['<code>"/api/admin"</code> ohne <code>/**</code> – schützt <code>/api/admin/users</code> nicht.','Regeln, die sich gegenseitig verdecken, ohne Test.'],['<code>"/api/admin"</code> without <code>/**</code> – doesn’t protect <code>/api/admin/users</code>.','Rules that shadow each other, without tests.']),
  why:tx('<p>„First match wins“ ist bequem, aber gnadenlos: Eine zu früh stehende allgemeine Regel macht alle spezifischen darunter wirkungslos – ohne Warnung. Die Reihenfolge ist darum Teil der Sicherheitsentscheidung, und ein Test pro Regel ist billig.</p>','<p>“First match wins” is convenient but merciless: a general rule placed too early makes every specific rule below it ineffective – without warning. Order is therefore part of the security decision, and one test per rule is cheap.</p>')
});

LESSONS.push({
  id:'sp-method-security',cat:'spring',
  title:tx('Methodensicherheit: @PreAuthorize & Co.','Method security: @PreAuthorize & co.'),
  short:tx('Rechte an der Service-Methode – und die Falle mit dem Selbstaufruf.','Permissions on the service method – and the self-invocation trap.'),
  keys:'enablemethodsecurity preauthorize postauthorize prefilter postfilter spel proxy aop self invocation selbstaufruf meta annotation authorizeReturnObject',
  refs:[['Spring Security: Method Security','https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html']],
  rule:tx('Mit <code>@EnableMethodSecurity</code> schützt du Service-Methoden direkt: <code>@PreAuthorize</code> prüft <b>vor</b> dem Aufruf (mit Zugriff auf Parameter wie <code>#id</code>), <code>@PostAuthorize</code> <b>danach</b> (mit <code>returnObject</code>), <code>@PostFilter</code> filtert Listen. Spring setzt das über einen Proxy um – ein Aufruf innerhalb derselben Klasse (<code>this.approve()</code>) läuft daran vorbei.','With <code>@EnableMethodSecurity</code> you protect service methods directly: <code>@PreAuthorize</code> checks <b>before</b> the call (with access to parameters like <code>#id</code>), <code>@PostAuthorize</code> <b>after</b> it (with <code>returnObject</code>), <code>@PostFilter</code> filters lists. Spring implements this via a proxy – a call within the same class (<code>this.approve()</code>) bypasses it.'),
  glance:{rows:[
    ['<code>@PreAuthorize</code>',tx('Vor der Methode. SpEL mit <code>#parameter</code>, <code>principal</code>, <code>authentication</code>, <code>@bean</code>.','Before the method. SpEL with <code>#parameter</code>, <code>principal</code>, <code>authentication</code>, <code>@bean</code>.')],
    ['<code>@PostAuthorize</code>',tx('Nach der Methode, mit <code>returnObject</code>. Gut für „lesen nur, wenn eigenes Team“.','After the method, with <code>returnObject</code>. Good for “read only if own team”.')],
    ['<code>@PostFilter</code>',tx('Filtert eine zurückgegebene Liste. Bequem, aber lädt erst alles – besser in der Abfrage filtern.','Filters a returned list. Convenient, but loads everything first – better filter in the query.')],
    [tx('Meta-Annotation','Meta annotation'),tx('Eigene Annotation wie <code>@CanApprove</code>, die <code>@PreAuthorize</code> bündelt – lesbarer, einheitlich.','Your own annotation like <code>@CanApprove</code> that bundles <code>@PreAuthorize</code> – more readable, consistent.')],
    [tx('Selbstaufruf','Self-invocation'),tx('<code>this.method()</code> geht am Proxy vorbei – keine Prüfung!','<code>this.method()</code> bypasses the proxy – no check!')]
  ]},
  body:`<p class="hint">${SP_NOTE}</p>`,
  demoTitle:tx('Proxy oder nicht?','Proxy or not?'),demoHint:tx('Vera (Viewer) löst eine Sammelfreigabe aus.','Vera (viewer) triggers a bulk approval.'),
  demo:`<fieldset class="seg"><legend>${tx('Aufruf','Call')}</legend><div class="seg-opts"><label><input type="radio" name="ms-c" value="proxy" checked>${tx('Controller → invoiceService.approve()','controller → invoiceService.approve()')}</label><label><input type="radio" name="ms-c" value="self">${tx('approveAll() → this.approve()','approveAll() → this.approve()')}</label></div></fieldset><div id="ms-out"></div>`,
  init(root){
    const run=()=>{const self=$('input[name="ms-c"]:checked',root).value==='self';
      $('#ms-out',root).innerHTML=traceHTML(self?[['ok',tx('Controller ruft <code>invoiceService.approveAll()</code> – Proxy prüft: keine Annotation, weiter.','Controller calls <code>invoiceService.approveAll()</code> – proxy checks: no annotation, continue.')],['no',tx('In <code>approveAll()</code>: <code>this.approve(id)</code> – direkt auf dem Objekt, <b>nicht</b> über den Proxy.','In <code>approveAll()</code>: <code>this.approve(id)</code> – directly on the object, <b>not</b> via the proxy.')],['skip',tx('<code>@PreAuthorize("hasAuthority(\'invoice:approve\')")</code> wird nie ausgewertet.','<code>@PreAuthorize("hasAuthority(\'invoice:approve\')")</code> is never evaluated.')]]:[['ok',tx('Controller ruft <code>invoiceService.approve(id)</code> – das ist der Proxy.','Controller calls <code>invoiceService.approve(id)</code> – that’s the proxy.')],['no',tx('Proxy wertet <code>@PreAuthorize</code> aus: Vera hat kein invoice:approve.','Proxy evaluates <code>@PreAuthorize</code>: Vera has no invoice:approve.')]])+`<div style="margin-top:10px">${self?verdict(false,tx('200 OK – drei Rechnungen freigegeben. Von Vera.','200 OK – three invoices approved. By Vera.'),tx('Die Annotation steht da, wirkt aber nicht.','The annotation is there but has no effect.')):verdict(true,tx('403 Forbidden – wie gewollt','403 Forbidden – as intended'))}</div>`};
    root.addEventListener('change',run);run();
  },
  lang:'java',
  bad:{code:`@Service
class InvoiceService {
  public void approveAll(List<String> ids) {        // no annotation
    ids.forEach(this::approve);                      // self-invocation: bypasses the proxy
  }

  @PreAuthorize("hasAuthority('invoice:approve')")
  public void approve(String id) { … }
}`},
  good:{code:`@Target(METHOD) @Retention(RUNTIME)
@PreAuthorize("hasAuthority('invoice:approve') and @invoicePolicy.canApprove(principal, #id)")
public @interface CanApproveInvoice {}

@Service
class InvoiceService {
  @PreAuthorize("hasAuthority('invoice:approve')")   // coarse check on the entry point too
  public void approveAll(List<String> ids) {
    ids.forEach(approvals::approve);                  // separate bean → through its proxy
  }
}

@Service
class Approvals {
  @CanApproveInvoice
  public void approve(String id) { … }                // per-object check for every id
}`,note:tx('Jeder Einstiegspunkt hat eine eigene Prüfung, und Aufrufe gehen über eine andere Bean, also durch deren Proxy. Alternativ: Prüfung explizit im Code (<code>policy.assertCanApprove(…)</code>).','Every entry point has its own check, and calls go through another bean, i.e. through its proxy. Alternatively: an explicit check in code (<code>policy.assertCanApprove(…)</code>).')},
  code:[{t:tx('@PostAuthorize und @PostFilter','@PostAuthorize and @PostFilter'),lang:'java',src:`@PostAuthorize("returnObject.team == principal.team or hasAuthority('invoice:read-all')")
public Invoice get(String id) { return repo.findById(id).orElseThrow(); }

@PostFilter("filterObject.team == principal.team")      // careful: loads everything first
public List<Invoice> all() { return repo.findAll(); }

// better for lists: filter in the query
public List<Invoice> visibleFor(UserPrincipal me) {
  return me.has("invoice:read-all") ? repo.findAll() : repo.findByTeam(me.team());
}`}],
  do:tx(['Methodensicherheit zusätzlich zu URL-Regeln.','Meta-Annotationen für wiederkehrende Ausdrücke.','Jede öffentliche Einstiegsmethode absichern.'],['Method security in addition to URL rules.','Meta annotations for recurring expressions.','Secure every public entry method.']),
  dont:tx(['Annotierte Methoden aus derselben Klasse aufrufen.','Lange SpEL-Ausdrücke inline – lieber eine Policy-Bean.','<code>@PostFilter</code> auf großen Listen.'],['Call annotated methods from within the same class.','Long inline SpEL expressions – prefer a policy bean.','<code>@PostFilter</code> on large lists.']),
  why:tx('<p>URL-Regeln kennen nur Pfade. Methodensicherheit sitzt an der Fachlogik und schützt sie, egal ob der Aufruf vom REST-Controller, einem Message-Listener oder einem Batch-Job kommt. Die Proxy-Falle ist der Preis – wer sie kennt, baut Einstiegspunkte bewusst.</p>','<p>URL rules only know paths. Method security sits at the business logic and protects it, no matter whether the call comes from a REST controller, a message listener or a batch job. The proxy trap is the price – knowing it lets you design entry points deliberately.</p>')
});

LESSONS.push({
  id:'sp-object-policy',cat:'spring',
  title:tx('Objektrechte: die Policy-Bean','Object rights: the policy bean'),
  short:tx('Eine Klasse pro Ressource, aufgerufen aus @PreAuthorize – der vollständige Weg einer Anfrage.','One class per resource, called from @PreAuthorize – the complete path of a request.'),
  keys:'policy bean invoicepolicy preauthorize bean spel authorizationmanager permissionevaluator hasPermission objekt object ownership 404 idor',
  refs:[['Spring Security: Using a Custom Bean in SpEL','https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html#use-a-bean'],['Spring Security: PermissionEvaluator','https://docs.spring.io/spring-security/reference/servlet/authorization/method-security.html#_using_a_custom_permissionevaluator']],
  rule:tx('Objektrechte gehören in eine <b>Policy-Bean</b> pro Ressource – <code>InvoicePolicy</code> mit Methoden wie <code>canApprove(user, invoice)</code>. <code>@PreAuthorize("@invoicePolicy.canApprove(principal, #id)")</code> ruft sie auf, <code>/api/me</code> ruft sie auf, der Batch-Job ruft sie auf. Für Lesezugriffe filtert die Datenbankabfrage gleich mit – dann antwortet die API bei fremden Objekten mit 404.','Object rights belong in a <b>policy bean</b> per resource – <code>InvoicePolicy</code> with methods like <code>canApprove(user, invoice)</code>. <code>@PreAuthorize("@invoicePolicy.canApprove(principal, #id)")</code> calls it, <code>/api/me</code> calls it, the batch job calls it. For reads, the database query filters along – then the API answers 404 for foreign objects.'),
  glance:{rows:[
    [tx('Policy-Bean','Policy bean'),tx('Reine Fachlogik, gut testbar, ohne Spring-Security-Typen in der Signatur.','Pure business logic, easy to test, without Spring Security types in the signature.')],
    ['<code>@bean</code> in SpEL',tx('<code>@invoicePolicy.canApprove(principal, #id)</code> – Bean-Name mit <code>@</code>.','<code>@invoicePolicy.canApprove(principal, #id)</code> – bean name with <code>@</code>.')],
    ['<code>PermissionEvaluator</code>',tx('Klassischer Weg: <code>hasPermission(#id, \'Invoice\', \'approve\')</code>. Generisch, aber stringbasiert.','Classic way: <code>hasPermission(#id, \'Invoice\', \'approve\')</code>. Generic, but string-based.')],
    ['<code>AuthorizationManager</code>',tx('Eigener Manager für Methoden oder Requests – volle Kontrolle, etwas mehr Code.','Your own manager for methods or requests – full control, a bit more code.')],
    ['404 statt 403',tx('Für Objekte außerhalb der eigenen Sicht – verrät nicht, dass es sie gibt.','For objects outside one’s view – doesn’t reveal they exist.')]
  ]},
  body:`<p class="hint">${SP_NOTE}</p>`,
  demoTitle:tx('Request-Simulator','Request simulator'),demoHint:tx('Die vollständige Prüfung in Spring – als die Person oben.','The complete check in Spring – as the person at the top.'),
  demo:`<div class="row"><div class="field"><label for="op-a">${tx('Aktion','Action')}</label><select id="op-a"><option value="read">GET /api/invoices/{id}</option><option value="approve" selected>POST /api/invoices/{id}/approve</option><option value="pay">POST /api/invoices/{id}/pay</option></select></div><div class="field"><label for="op-i">{id}</label><select id="op-i">${INVOICES.map(i=>`<option value="${i.id}"${i.id==='R-1002'?' selected':''}>${i.id} · ${TEAMS[i.team]} · ${eur(i.amount)} · ${STATUS[i.status]}</option>`).join('')}</select></div></div><div id="op-out"></div>`,
  init(root){
    const run=()=>{const p=persona(),a=$('#op-a',root).value,inv=INVOICES.find(i=>i.id===$('#op-i',root).value),perm='invoice:'+a,steps=[];let res;
      const visible=p.roles.includes('ACCOUNTANT')||p.roles.includes('ADMIN')||inv.team===p.team;
      if(!p.roles.length){steps.push(['no',tx('BearerTokenAuthenticationFilter: kein Token','BearerTokenAuthenticationFilter: no token')]);res=verdict(false,'401 Unauthorized')}
      else{steps.push(['ok',tx(`BearerTokenAuthenticationFilter: ${p.name}, Authorities ${permsOf(p).length}`,`BearerTokenAuthenticationFilter: ${p.name}, ${permsOf(p).length} authorities`)]);
        const url=can(perm,p);steps.push([url?'ok':'no',tx(`AuthorizationFilter: hasAuthority('${perm}')`,`AuthorizationFilter: hasAuthority('${perm}')`)]);
        if(!url)res=verdict(false,'403 Forbidden');
        else{steps.push([visible?'ok':'no',tx(`Repository: findVisible('${inv.id}', team=${p.team}) → ${visible?'gefunden':'leer'}`,`Repository: findVisible('${inv.id}', team=${p.team}) → ${visible?'found':'empty'}`)]);
          if(!visible)res=verdict(false,'404 Not Found',tx('Fremdes Team – die Rechnung existiert für diese Anfrage nicht.','Foreign team – the invoice doesn’t exist for this request.'));
          else if(a==='read')res=verdict(true,'200 OK');
          else{const r=defaultCheck(perm,inv,p);steps.push([r.ok?'ok':'no',`@PreAuthorize → invoicePolicy.can${a[0].toUpperCase()+a.slice(1)}(${p.id}, ${inv.id})${r.ok?'':' – '+r.why}`]);res=r.ok?verdict(true,'200 OK'):verdict(false,'403 Forbidden',r.why)}}}
      $('#op-out',root).innerHTML=traceHTML(steps)+`<div style="margin-top:10px">${res}</div>`};
    root.addEventListener('change',run);return onPersona(run);
  },
  code:[
    {t:'InvoicePolicy.java',lang:'java',src:`@Component("invoicePolicy")
public class InvoicePolicy {
  private final InvoiceRepository invoices;

  public InvoicePolicy(InvoiceRepository invoices) { this.invoices = invoices; }

  // called from SpEL with the id
  public boolean canApprove(UserPrincipal u, String id) {
    return invoices.findVisible(id, u).map(inv -> canApprove(u, inv)).orElse(false);
  }

  // pure rule – also used by /api/me and in tests
  public boolean canApprove(UserPrincipal u, Invoice inv) {
    return reasonNotToApprove(u, inv).isEmpty();
  }

  public Optional<String> reasonNotToApprove(UserPrincipal u, Invoice inv) {
    if (!u.has("invoice:approve"))              return Optional.of("NO_PERMISSION");
    if (inv.getStatus() != Status.SUBMITTED)    return Optional.of("WRONG_STATUS");
    if (!inv.getTeam().equals(u.team()))        return Optional.of("OTHER_TEAM");
    if (inv.getAmount().compareTo(u.approvalLimit()) > 0) return Optional.of("ABOVE_LIMIT");
    if (inv.getCreatedBy().equals(u.id()))      return Optional.of("OWN_INVOICE");
    return Optional.empty();
  }
}`},
    {t:'InvoiceController.java',lang:'java',src:`@RestController
@RequestMapping("/api/invoices")
class InvoiceController {

  @GetMapping("/{id}")
  InvoiceDto get(@PathVariable String id, @AuthenticationPrincipal UserPrincipal me) {
    return invoices.findVisible(id, me).map(i -> InvoiceDto.from(i, me))
        .orElseThrow(() -> new ResponseStatusException(HttpStatus.NOT_FOUND));
  }

  @PostMapping("/{id}/approve")
  @PreAuthorize("@invoicePolicy.canApprove(principal, #id)")
  void approve(@PathVariable String id, @AuthenticationPrincipal UserPrincipal me) {
    service.approve(id, me);
  }
}`,note:tx('<code>UserPrincipal</code> ist ein eigener Typ, den der Converter aus dem JWT baut (id, team, Limit, Permissions) – so steckt in Controllern und Policies kein Token-Format. Prüft die Policy vor dem Laden nicht, ob die Rechnung sichtbar ist, gibt <code>canApprove</code> für fremde IDs <code>false</code> zurück → 403; wer 404 will, wirft im Service eine <code>NotFound</code>-Ausnahme.','<code>UserPrincipal</code> is your own type the converter builds from the JWT (id, team, limit, permissions) – so no token format leaks into controllers and policies. If the policy doesn’t check visibility before loading, <code>canApprove</code> returns <code>false</code> for foreign IDs → 403; if you want 404, throw a <code>NotFound</code> exception in the service.')}
  ],
  do:tx(['Eine Policy-Klasse pro Ressource mit reinen Regel-Methoden.','Gründe zurückgeben (<code>reasonNotTo…</code>), nicht nur <code>boolean</code> – fürs Frontend und fürs Audit.','Lesezugriffe in der Abfrage filtern.'],['One policy class per resource with pure rule methods.','Return reasons (<code>reasonNotTo…</code>), not just a <code>boolean</code> – for the frontend and for audits.','Filter reads in the query.']),
  dont:tx(['Objektprüfungen im Controller als <code>if</code>-Ketten.','Erst laden, dann prüfen, dann trotzdem das Objekt im Fehlertext zurückgeben.'],['Object checks in the controller as <code>if</code> chains.','Load first, check, then return the object in the error message anyway.']),
  why:tx('<p>Die Policy-Bean ist der PDP aus der Architektur-Lektion – nur in klein, mitten in deiner Anwendung. Sie macht aus verstreuten Prüfungen eine testbare Klasse, und weil sie Gründe liefert, kann dieselbe Regel den Knopf im Frontend erklären, die API schützen und im Audit-Log stehen.</p>','<p>The policy bean is the PDP from the architecture lesson – just small, right in your application. It turns scattered checks into one testable class, and because it returns reasons, the same rule can explain the button in the frontend, protect the API and appear in the audit log.</p>')
});

LESSONS.push({
  id:'sp-me-endpoint',cat:'spring',
  title:tx('/api/me: Rechte fürs Frontend','/api/me: permissions for the frontend'),
  short:tx('Der Server sagt der Oberfläche, was sie zeigen darf – mit denselben Policies.','The server tells the UI what it may show – with the same policies.'),
  keys:'/api/me me endpoint permissions frontend _actions hateoas affordances allowed actions single source of truth',
  refs:[['Spring HATEOAS: Affordances','https://docs.spring.io/spring-hateoas/docs/current/reference/html/#server.affordances']],
  rule:tx('Statt Regeln im Frontend nachzubauen, liefert der Server sie aus: <code>GET /api/me</code> gibt Benutzer und <b>Permissions</b> zurück (für Menü, Guards, globale Knöpfe), und jede Liste oder Detailantwort enthält pro Objekt die <b>erlaubten Aktionen</b> samt Grund (für Knöpfe an Zeilen). Beide werden aus den Policies berechnet, die auch die Durchsetzung machen.','Instead of rebuilding rules in the frontend, the server delivers them: <code>GET /api/me</code> returns the user and <b>permissions</b> (for menu, guards, global buttons), and every list or detail response contains the <b>allowed actions</b> per object with reasons (for buttons on rows). Both are computed from the policies that also do the enforcement.'),
  glance:{rows:[
    ['<code>/api/me</code>',tx('Wer bin ich, welche Permissions habe ich – global, ändert sich selten.','Who am I, which permissions do I have – global, rarely changes.')],
    ['<code>_actions</code>',tx('Pro Objekt: <code>{ approve: { allowed: false, reason: "ABOVE_LIMIT" } }</code>.','Per object: <code>{ approve: { allowed: false, reason: "ABOVE_LIMIT" } }</code>.')],
    [tx('Cache','Cache'),tx('<code>/api/me</code> nach Login und bei 403 neu laden.','Reload <code>/api/me</code> after login and on 403.')],
    ['HATEOAS',tx('Dieselbe Idee als REST-Prinzip: Links/Affordances nur für erlaubte Aktionen.','The same idea as a REST principle: links/affordances only for allowed actions.')]
  ]},
  body:`<p class="hint">${SP_NOTE}</p>`,
  demoHint:tx('Die Antworten des Servers für die Person oben.','The server’s responses for the person at the top.'),
  demo:`<div class="two"><div><h3>GET /api/me</h3><pre class="out" id="me-me"></pre></div><div><h3>GET /api/invoices/R-1003</h3><pre class="out" id="me-inv"></pre></div></div>`,
  init(root){
    return onPersona(p=>{
      if(!p.roles.length){$('#me-me',root).textContent='401 Unauthorized';$('#me-inv',root).textContent='401 Unauthorized';return}
      $('#me-me',root).textContent=JSON.stringify({id:p.id,name:p.name,team:p.team,permissions:permsOf(p)},null,2);
      const inv=INVOICES[2],visible=p.roles.includes('ACCOUNTANT')||p.roles.includes('ADMIN')||inv.team===p.team;
      if(!visible||!can('invoice:read',p)){$('#me-inv',root).textContent='404 Not Found';return}
      const acts={};['edit','approve','pay','delete'].forEach(a=>{if(!can('invoice:'+a,p))return;const r=defaultCheck('invoice:'+a,inv,p);acts[a]=r.ok?{allowed:true}:{allowed:false,reason:r.why}});
      $('#me-inv',root).textContent=JSON.stringify({id:inv.id,customer:inv.customer,amount:inv.amount,team:inv.team,status:inv.status,_actions:acts},null,2)});
  },
  code:[{t:'MeController.java',lang:'java',src:`@RestController
class MeController {
  @GetMapping("/api/me")
  MeDto me(@AuthenticationPrincipal UserPrincipal me) {
    return new MeDto(me.id(), me.name(), me.team(), me.permissions());
  }
}

record ActionState(boolean allowed, String reason) {}

// InvoiceDto.from(…) adds the actions – only those the user has the permission for at all
Map<String, ActionState> actions(UserPrincipal u, Invoice inv) {
  var m = new LinkedHashMap<String, ActionState>();
  if (u.has("invoice:approve"))
    m.put("approve", policy.reasonNotToApprove(u, inv)
        .map(r -> new ActionState(false, r)).orElse(new ActionState(true, null)));
  if (u.has("invoice:pay"))
    m.put("pay", policy.reasonNotToPay(u, inv)
        .map(r -> new ActionState(false, r)).orElse(new ActionState(true, null)));
  return m;
}`}],
  do:tx(['Permissions und erlaubte Aktionen aus denselben Policies berechnen.','Aktionen ohne Permission ganz weglassen (→ Knopf ausblenden), mit Permission aber unzulässig: mit Grund.','<code>/api/me</code> klein halten.'],['Compute permissions and allowed actions from the same policies.','Leave out actions without permission entirely (→ hide button); with permission but not allowed: with a reason.','Keep <code>/api/me</code> small.']),
  dont:tx(['Die Rollen-Matrix ins Frontend kopieren.','Interne Regeln im Detail ausliefern („Limit 5000“), wenn ein Grund-Code genügt.'],['Copy the role matrix into the frontend.','Ship internal rules in detail (“limit 5000”) when a reason code is enough.']),
  why:tx('<p>Die häufigste Inkonsistenz in Apps mit Rechten: Der Knopf ist da, die API sagt Nein. Wenn der Server beides aus derselben Policy berechnet, kann das nicht mehr passieren – und das Frontend wird einfacher, weil es nicht mehr denken muss, nur noch anzeigen.</p>','<p>The most common inconsistency in apps with permissions: the button is there, the API says no. When the server computes both from the same policy, that can’t happen anymore – and the frontend gets simpler because it no longer has to think, only display.</p>')
});

  code:[{t:'OpaAuthorizationManager.java',lang:'java',src:`@Component
class OpaInvoiceAuthorization implements AuthorizationManager<MethodInvocation> {
  private final RestClient opa;

  OpaInvoiceAuthorization(InvoiceRepository invoices) {
    var factory = new SimpleClientHttpRequestFactory();
    factory.setConnectTimeout(Duration.ofMillis(100));
    factory.setReadTimeout(Duration.ofMillis(200));
    this.opa = RestClient.builder().baseUrl("http://localhost:8181").requestFactory(factory).build();
    this.invoices = invoices;
  }

  @Override
  public AuthorizationResult authorize(Supplier<? extends Authentication> auth, MethodInvocation mi) {
    var user = (UserPrincipal) auth.get().getPrincipal();
    var invoice = invoices.get((String) mi.getArguments()[0]);       // PIP
    var input = Map.of("input", Map.of(
        "action", mi.getMethod().getName(),
        "subject", Map.of("id", user.id(), "roles", user.roles(), "team", user.team(), "limit", user.approvalLimit()),
        "resource", Map.of("team", invoice.getTeam(), "amount", invoice.getAmount(), "createdBy", invoice.getCreatedBy())));
    try {
      var res = opa.post().uri("/v1/data/nordwind/invoices/allow").body(input)
          .retrieve().body(OpaResult.class);
      return new AuthorizationDecision(res != null && Boolean.TRUE.equals(res.result()));
    } catch (RestClientException e) {
      log.warn("OPA unreachable – denying", e);
      return new AuthorizationDecision(false);                          // fail closed
    }
  }
  record OpaResult(Boolean result) {}
}

// wire it to an annotation
@Bean
static Advisor approveAuthorization(OpaInvoiceAuthorization opa) {
  return AuthorizationManagerBeforeMethodInterceptor.preAuthorize(opa);  // or a custom pointcut
}`,note:tx('Der Timeout ist bewusst knapp: Lieber ein seltenes 403 (oder 503) als Anfragen, die bei einem hängenden PDP minutenlang warten. Decision Logs schreibt OPA selbst.','The timeout is deliberately tight: better a rare 403 (or 503) than requests waiting for minutes on a hanging PDP. OPA writes decision logs itself.')}],
  do:tx(['PDP nah am Dienst betreiben (Sidecar) oder einbetten.','Timeout + fail closed + Alarm.','Für Listen Batch-Anfragen oder Filter-Abfragen (<code>listObjects</code>, partielle Auswertung).'],['Run the PDP close to the service (sidecar) or embed it.','Timeout + fail closed + alert.','For lists, batch requests or filter queries (<code>listObjects</code>, partial evaluation).']),
  dont:tx(['Pro Tabellenzeile einen Netzwerkaufruf.','Bei PDP-Ausfall „vorübergehend alles erlauben“.','Entscheidungen ungeprüft lange cachen, wenn sich Rechte schnell ändern.'],['One network call per table row.','“Temporarily allow everything” when the PDP is down.','Cache decisions for long without checks when rights change quickly.']),
  why:tx('<p>Ein externer PDP bringt Einheitlichkeit und Audit, aber er steht jetzt auf dem kritischen Pfad jeder Anfrage. Wer Latenz und Ausfall nicht von Anfang an einplant, baut sich entweder eine langsame App oder – schlimmer – eine, die bei Störungen die Türen öffnet.</p>','<p>An external PDP brings uniformity and auditing, but it now sits on the critical path of every request. Whoever doesn’t plan for latency and outages from the start builds either a slow app or – worse – one that opens the doors during incidents.</p>')
});

    {t:'InvoiceSecurityTest.java',lang:'java',src:`@WebMvcTest(InvoiceController.class)
@Import({ SecurityConfig.class, KeycloakJwtConverter.class, RolePermissions.class, InvoicePolicy.class })
class InvoiceSecurityTest {
  @Autowired MockMvc mvc;
  @MockitoBean InvoiceService service;
  @MockitoBean InvoiceRepository invoices;

  static Stream<Arguments> matrix() {
    return Stream.of(
      //          method  path                          authorities                   status
      arguments("GET",  "/api/invoices",              List.of(),                     401),
      arguments("GET",  "/api/invoices",              List.of("invoice:read"),       200),
      arguments("POST", "/api/invoices/R-1005/pay",   List.of("invoice:read"),       403),
      arguments("POST", "/api/invoices/R-1005/pay",   List.of("invoice:pay"),        204),
      arguments("GET",  "/api/admin/users",           List.of("invoice:read"),       403));
  }

  @ParameterizedTest(name = "{0} {1} with {2} → {3}")
  @MethodSource("matrix")
  void access(String method, String path, List<String> authorities, int status) throws Exception {
    var req = request(HttpMethod.valueOf(method), path);
    if (!authorities.isEmpty()) {
      req.with(jwt().authorities(authorities.stream().map(SimpleGrantedAuthority::new).toList()));
    }
    mvc.perform(req).andExpect(status().is(status));
  }
}`},
    {t:'InvoicePolicyTest.java',lang:'java',src:`class InvoicePolicyTest {
  InvoicePolicy policy = new InvoicePolicy(mock(InvoiceRepository.class));
  UserPrincipal tom = new UserPrincipal("tom", "sales", new BigDecimal("5000"), Set.of("invoice:approve"));

  @Test void approvesOwnTeamWithinLimit() {
    assertThat(policy.canApprove(tom, invoice("sales", "4300", "bea", SUBMITTED))).isTrue();
  }
  @Test void notAboveLimit() {
    assertThat(policy.reasonNotToApprove(tom, invoice("sales", "12800", "bea", SUBMITTED))).contains("ABOVE_LIMIT");
  }
  @Test void notOwnInvoice() {
    assertThat(policy.reasonNotToApprove(tom, invoice("sales", "900", "tom", SUBMITTED))).contains("OWN_INVOICE");
  }
}`}
  ],

  dont:tx(['Security in Tests abschalten (<code>addFilters = false</code>), „damit es einfacher ist“.','Nur den Erfolgsfall testen.'],['Turn off security in tests (<code>addFilters = false</code>) “to keep it simple”.','Only test the success case.']),
  why:tx('<p>Eine vergessene Annotation erzeugt keinen Fehler, keine Warnung, keinen roten Build – nur eine Lücke. Die Endpunkt-Matrix ist der Ort, an dem das Soll steht und automatisch mit dem Ist verglichen wird. Sie ist schnell geschrieben und fängt genau die Fehler, die im Review am leichtesten durchrutschen.</p>','<p>A forgotten annotation produces no error, no warning, no red build – only a hole. The endpoint matrix is where the intended state lives and is automatically compared with reality. It’s quick to write and catches exactly the bugs that slip through review most easily.</p>')
});

@Component
class AuthorizationAudit {
  private static final Logger AUDIT = LoggerFactory.getLogger("AUDIT");

  @EventListener
  void onDenied(AuthorizationDeniedEvent<?> e) {
    AUDIT.atWarn()
        .addKeyValue("sub", e.getAuthentication().get().getName())
        .addKeyValue("decision", "DENY")
        .addKeyValue("resource", describe(e.getSource()))
        .addKeyValue("reason", String.valueOf(e.getAuthorizationResult()))
        .log("authorization denied");
  }
}
