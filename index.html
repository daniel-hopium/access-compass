const listEl=$('#list'),search=$('#q'),qStatus=$('#q-status');
let currentId=null,statusTimer=null;
const itemHTML=l=>`<a class="item" href="#${l.id}" data-id="${l.id}"><span class="item-title">${l.title}</span>${learned.has(l.id)?`<span class="item-badge">${ic('check')}${tx('gelernt','learned')}</span>`:'<span></span>'}<span class="item-short">${l.short}</span></a>`;
const strip=s=>String(s||'').replace(/<[^>]+>/g,' ');
function renderList(){
  const q=norm(search.value.trim());
  const match=l=>!q||norm(strip(`${l.title} ${l.short} ${chapterOf(l.cat).title} ${l.keys||''} ${(l.glance?.rows||[]).map(r=>r[0]).join(' ')}`)).includes(q);
  let html='',count=0;
  if(!q)html+=`<ul class="items">${[START,REF].map(p=>`<li>${itemHTML(p)}</li>`).join('')}</ul>`;
  CHAPTERS.forEach(c=>{
    const ls=LESSONS.filter(l=>l.cat===c.id&&match(l));if(!ls.length)return;count+=ls.length;
    html+=`<p class="grp" id="grp-${c.id}">${c.title}</p><ul class="items" aria-labelledby="grp-${c.id}">${ls.map(l=>`<li>${itemHTML(l)}</li>`).join('')}</ul>`;
  });
  if(q&&!count)html=`<div class="list-empty">${ic('search')}<p class="le-title">${tx(`Keine Lektion zu „${esc(search.value.trim())}“`,`No lesson for “${esc(search.value.trim())}”`)}</p><p class="hint">${tx('Probier einen Begriff wie „JWT“, „canMatch“ oder „@PreAuthorize“.','Try a term like “JWT”, “canMatch” or “@PreAuthorize”.')}</p><button type="button" class="btn btn-secondary" id="q-reset">${tx('Suche zurücksetzen','Clear search')}</button></div>`;
  listEl.innerHTML=html;
  markActive(currentId);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{qStatus.textContent=q?tx(count===1?'1 Treffer':`${count} Treffer`,count===1?'1 result':`${count} results`):tx(`${LESSONS.length} Lektionen in ${CHAPTERS.length} Kapiteln`,`${LESSONS.length} lessons in ${CHAPTERS.length} chapters`)},q?450:0);
}
function markActive(id){$$('.item',listEl).forEach(a=>{if(a.dataset.id===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
search.addEventListener('input',renderList);
listEl.addEventListener('click',e=>{if(e.target.closest('#q-reset')){search.value='';renderList();search.focus()}});

/* ---------- Lektion ----------
   Aufbau: Regel · Auf einen Blick · Erklärung (body) · Zum Ausprobieren (demo) · So nicht – so ·
   Code (Angular, Spring …) · Richtig/Falsch · Warum? */
const view=$('#view'),master=$('#master'),detail=$('#hauptinhalt'),shell=$('#shell');
let cleanup=[];
function lessonHTML(l){
  const i=LESSONS.indexOf(l),prev=LESSONS[i-1],next=LESSONS[i+1],c=chapterOf(l.cat);
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${c.title} · ${tx(`Lektion ${i+1} von ${LESSONS.length}`,`Lesson ${i+1} of ${LESSONS.length}`)}</p>
  <h1 id="lesson-title" tabindex="-1">${l.title}</h1>
  ${l.refs?.length?`<ul class="refs" aria-label="${tx('Quellen','Sources')}">${l.refs.map(([t,u])=>`<li>${u?ref(t,u):t}</li>`).join('')}</ul>`:''}
  <p class="rule">${l.rule}</p>
  ${l.glance?`<h2>${tx('Auf einen Blick','At a glance')}</h2>${table(l.glance.head||[tx('Begriff','Term'),tx('Bedeutung','Meaning')],l.glance.rows,{cls:'glance',caption:tx('Auf einen Blick','At a glance')})}`:''}
  ${l.body?`<div class="prose">${l.body}</div>`:''}
  ${l.demo?`<section class="demo" aria-labelledby="demo-h">
    <div class="demo-head"><h2 id="demo-h">${l.demoTitle||tx('Zum Ausprobieren','Try it')}</h2><span>${l.demoHint||tx('Wechsle oben die Person unter „Angemeldet als“ – das Beispiel reagiert.','Switch the person under “Signed in as” at the top – the example reacts.')}</span></div>
    <div class="demo-body">${l.demo}</div>
  </section>`:''}
  ${l.bad||l.good?`<h2>${tx('So nicht – so','Don’t – do')}</h2><div class="k-code">${l.bad?codeFig('bad',tx('So nicht','Don’t'),l.bad.code,l.bad.lang||l.lang):''}${l.good?codeFig('good',tx('So','Do'),l.good.code,l.good.lang||l.lang):''}</div>
  ${l.bad?.note||l.good?.note?`<div class="code-notes">${l.bad?.note?`<p><b>${tx('So nicht','Don’t')}:</b> ${l.bad.note}</p>`:''}${l.good?.note?`<p><b>${tx('So','Do')}:</b> ${l.good.note}</p>`:''}</div>`:''}`:''}
  ${l.code?.length?`<h2>${l.codeTitle||tx('Im Code','In code')}</h2>${l.code.map(k=>code(k.t,k.src,k.lang,k.note)).join('')}`:''}
  ${l.after?`<div class="prose">${l.after}</div>`:''}
  ${l.do?`<div class="dodont">
    <section class="dd do" aria-labelledby="do-h"><h2 id="do-h">${ic('ok')} ${tx('Richtig','Do')}</h2><ul>${l.do.map(x=>`<li>${x}</li>`).join('')}</ul></section>
    <section class="dd dont" aria-labelledby="dont-h"><h2 id="dont-h">${ic('xc')} ${tx('Falsch','Don’t')}</h2><ul>${l.dont.map(x=>`<li>${x}</li>`).join('')}</ul></section>
  </div>`:''}
  ${l.why?`<aside class="here" aria-labelledby="why-h"><h2 id="why-h">${tx('Warum?','Why?')}</h2><div class="prose">${l.why}</div></aside>`:''}
  <div class="learned"><input type="checkbox" id="learned-cb" ${learned.has(l.id)?'checked':''}><label for="learned-cb">${tx('Als gelernt markieren','Mark as learned')}<span class="hint">${tx('Wird nur in diesem Browser gespeichert.','Only stored in this browser.')}</span></label></div>
  <nav class="pager" aria-label="${tx('Weitere Lektionen','More lessons')}">${prev?`<a class="prev" href="#${prev.id}"><small>${tx('← Vorherige','← Previous')}</small>${prev.title}</a>`:`<a class="prev" href="#start"><small>${tx('← Zurück zum','← Back to the')}</small>${tx('Start','start page')}</a>`}${next?`<a class="next" href="#${next.id}"><small>${tx('Nächste →','Next →')}</small>${next.title}</a>`:`<a class="next" href="#glossar"><small>${tx('Weiter →','Next →')}</small>${REF.title}</a>`}</nav>
</article>`;
}
function personaTable(){
  return table([tx('Person','Person'),tx('Rolle','Role'),'Team',tx('Darf','May')],PERSONAS.filter(p=>p.roles.length).map(p=>[p.name,roleLabel(p),TEAMS[p.team],`<span class="pills">${permsOf(p).map(x=>`<span class="pill">${x}</span>`).join('')}</span>${p.limit?` <span class="hint">${tx(`Freigabelimit ${eur(p.limit)}`,`approval limit ${eur(p.limit)}`)}</span>`:''}`]),{cls:'persona-tbl',caption:tx('Personen der Nordwind GmbH','People at Nordwind GmbH')});
}
const SISTERS=[
  ['angular-patterns','code','Angular-Patterns',tx('Modernes Angular mit Signals, Control Flow, RxJS und Forms – jedes Muster mit „So nicht – so“ und einer Live-Simulation.','Modern Angular with signals, control flow, RxJS and forms – every pattern with “don’t – do” and a live simulation.')],
  ['aria-compass','tag',tx('ARIA-Kompass','ARIA Compass'),tx('Rollen, Namen und Zustände für Screenreader – mit Accessibility-Inspektor.','Roles, names and states for screen readers – with an accessibility inspector.')],
  ['ui-atlas','button','UI-Atlas',tx('UI-Regeln mit Live-Beispielen – etwa, wann ein Knopf verschwindet und wann er deaktiviert wird.','UI rules with live examples – such as when a button disappears and when it gets disabled.')],
  ['html-atlas','file','HTML-Atlas',tx('HTML-Elemente und Attribute mit Live-Vorschau.','HTML elements and attributes with live previews.')],
  ['css-atlas','palette','CSS-Atlas',tx('Die CSS-Referenz mit Live-Vorschau: Wert anklicken, Wirkung sehen.','The CSS reference with live previews: click a value, see the effect.')]
];
function startHTML(){
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Willkommen','Welcome')}</p>
  <h1 id="lesson-title" tabindex="-1">${tx('Wer bist du – und was darfst du?','Who are you – and what may you do?')}</h1>
  <p class="rule">${tx('Authentifizierung beantwortet die erste Frage, Autorisierung die zweite. Diese App erklärt beide: von Passwort, Session und JWT über OAuth 2.0 und OpenID Connect bis zu RBAC, ABAC, PBAC und ReBAC – und zeigt, wie du das in Angular 22 und Spring Security sauber umsetzt.','Authentication answers the first question, authorization the second. This app explains both: from passwords, sessions and JWTs through OAuth 2.0 and OpenID Connect to RBAC, ABAC, PBAC and ReBAC – and shows how to build it cleanly in Angular 22 and Spring Security.')}</p>
  <h2>${tx('Die Beispielfirma: Nordwind GmbH','The example company: Nordwind GmbH')}</h2>
  <p class="prose-p">${tx('Alle Lektionen spielen in derselben kleinen Rechnungs-App. Rechnungen werden angelegt, von der Teamleitung freigegeben und von der Buchhaltung bezahlt. Wähle oben unter <b>„Angemeldet als“</b> eine Person – jedes Beispiel in der App reagiert darauf.','Every lesson plays in the same small invoicing app. Invoices are created, approved by the team lead and paid by accounting. Pick a person under <b>“Signed in as”</b> at the top – every example in the app reacts to it.')}</p>
  ${personaTable()}
  <div class="demo"><div class="demo-head"><h2>${tx('Die Rechnungs-App','The invoicing app')}</h2><span>${tx('Wechsle die Person und sieh, was sich ändert.','Switch the person and see what changes.')}</span></div><div class="demo-body" id="start-mini"></div></div>
  <h2>${tx('So ist jede Lektion aufgebaut','How each lesson is built')}</h2>
  <ol class="anatomy">
    <li>${tx('<b>Die Regel</b> in einem Absatz.','<b>The rule</b> in one paragraph.')}</li>
    <li>${tx('<b>Auf einen Blick:</b> die Begriffe als Tabelle.','<b>At a glance:</b> the terms as a table.')}</li>
    <li>${tx('<b>Erklärung</b> mit Diagrammen und Vergleichstabellen.','<b>Explanation</b> with diagrams and comparison tables.')}</li>
    <li>${tx('<b>Zum Ausprobieren:</b> Simulator, Playground oder Ablauf zum Durchklicken.','<b>Try it:</b> a simulator, playground or step-through flow.')}</li>
    <li>${tx('<b>So nicht – so</b> als Code, dazu Angular- und Spring-Code.','<b>Don’t – do</b> as code, plus Angular and Spring code.')}</li>
    <li>${tx('<b>Richtig/Falsch</b> und <b>Warum?</b>','<b>Do/Don’t</b> and <b>Why?</b>')}</li>
  </ol>
  <h2>${tx('Die Kapitel','The chapters')}</h2>
  <ul class="chapters">${CHAPTERS.map(c=>{const ls=LESSONS.filter(l=>l.cat===c.id);return ls.length?`<li><a href="#${ls[0].id}">${c.title}<span>${tx(`${ls.length} Lektionen`,`${ls.length} lessons`)}</span></a></li>`:''}).join('')}</ul>
  <h2>${tx('Wichtig vorab','Important up front')}</h2>
  <p class="prose-p">${tx('Alles, was im Browser läuft, kann der Benutzer verändern. Rechte im Frontend sind <b>Bedienkomfort</b>: Sie blenden aus, was ohnehin nicht geht. <b>Durchgesetzt</b> werden sie immer auf dem Server. Die Beispiele hier simulieren beides – Tokens, Server und Identity Provider laufen als Attrappe im Browser.','Everything that runs in the browser can be changed by the user. Permissions in the frontend are <b>convenience</b>: they hide what wouldn’t work anyway. They are always <b>enforced</b> on the server. The examples here simulate both – tokens, server and identity provider run as a mock in the browser.')}</p>
  <h2>${tx('Die Schwester-Apps','The sister apps')}</h2>
  <div class="start-grid sisters">${SISTERS.map(([id,icon,name,d])=>`<div class="tile"><h3>${ic(icon)} ${name}</h3><p>${d}</p><a class="btn btn-secondary" href="https://daniel-hopium.github.io/${id}/?lang=${LANG}">${tx(`${name} öffnen`,`Open ${name}`)}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div>`).join('')}</div>
  <p style="margin-top:28px"><a class="btn btn-primary" href="#${LESSONS[0].id}">${tx('Mit Lektion 1 starten','Start with lesson 1')} ${ic('fwd')}</a></p>
</article>`;
}
function startInit(root){
  const host=$('#start-mini',root);
  return miniInit(host,p=>{host.innerHTML=miniHTML(p,{mode:'disable'})});
}
function refHTML(){
  const rows=LESSONS.flatMap(l=>(l.glance?.rows||[]).map(r=>({t:r[0],d:r[r.length-1],l})));
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Nachschlagen','Reference')}</p>
  <h1 id="lesson-title" tabindex="-1">${REF.title}</h1>
  <p class="rule">${tx(`${rows.length} Begriffe aus allen Lektionen. Der Link führt zur Lektion mit Beispiel.`,`${rows.length} terms from all lessons. The link leads to the lesson with an example.`)}</p>
  <div class="field ref-find"><label for="ref-q">${tx('Begriff suchen','Search term')}</label><input class="input" id="ref-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ref-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="${REF.title}"><table class="kb-table glance"><caption class="sr-only">${REF.title}</caption><thead><tr><th scope="col">${tx('Begriff','Term')}</th><th scope="col">${tx('Bedeutung','Meaning')}</th><th scope="col">${tx('Lektion','Lesson')}</th></tr></thead>
  <tbody>${rows.map(({t,d,l})=>`<tr data-q="${esc(norm(strip(`${t} ${d} ${l.title}`)))}"><td>${t}</td><td>${d}</td><td><a href="#${l.id}">${l.title}</a></td></tr>`).join('')}</tbody></table></div>
</article>`;
}
function refInit(root){
  const q=$('#ref-q',root),rows=$$('tbody tr',root),count=$('#ref-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?tx(`${n} von ${rows.length} Begriffen`,`${n} of ${rows.length} terms`):tx(`${rows.length} Begriffe`,`${rows.length} terms`)},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> ist keine Lektion. Vielleicht hat der Link einen Tippfehler.`,`There is no lesson at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zur Startseite','Go to start page')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Lektion suchen','Search lessons')}</button></div>
  </div></article>`;
}
const APP=tx('Rechte-Kompass','Access Compass');
let lastId=null,masterScroll=0;
function route(fromUser){
  cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  shell.dataset.view=overview?'master':'detail';
  let title;
  if(overview||id==='start'){currentId='start';view.innerHTML=startHTML();title=START.title;cleanup.push(startInit(view))}
  else if(id==='glossar'){currentId=id;view.innerHTML=refHTML();cleanup.push(refInit(view));title=REF.title}
  else if(BY_ID[id]){
    const l=BY_ID[id];currentId=id;view.innerHTML=lessonHTML(l);title=l.title;
    const demo=$('.demo-body',view);
    if(demo&&l.init){const c=l.init(demo);if(typeof c==='function')cleanup.push(c)}
  }
  else{currentId=null;view.innerHTML=notFoundHTML(id);title=tx('Nicht gefunden','Not found')}
  document.title=`${title} · ${APP}`;
  markActive(currentId);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`.item[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{detail.scrollTop=0;$('#lesson-title').focus({preventScroll:true})}
  if(!overview&&currentId)lastId=currentId;
}

/* ---------- Globale Ereignisse ---------- */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
view.addEventListener('change',e=>{
  if(e.target.id!=='learned-cb'||!BY_ID[currentId])return;
  const l=BY_ID[currentId];
  if(e.target.checked)learned.add(l.id);else learned.delete(l.id);
  store.set('learned',[...learned]);renderList();updateProgress();
  toast(e.target.checked?{msg:tx(`„${strip(l.title)}“ als gelernt markiert – ${learned.size} von ${LESSONS.length}.`,`“${strip(l.title)}” marked as learned – ${learned.size} of ${LESSONS.length}.`),type:'success',duration:3500}:{msg:tx('Markierung entfernt.','Mark removed.'),duration:3000});
});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Kürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
});

/* ---------- Start ---------- */
updateLangLink();
setPersona(personaId,true);
updateProgress();
renderList();
route(false);
})();
</script>
</body>
</html>
