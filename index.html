<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<script>try{const t=JSON.parse(localStorage.getItem('rechte-kompass:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{if(JSON.parse(localStorage.getItem('rechte-kompass:width'))==='wide')document.documentElement.setAttribute('data-width','wide')}catch(e){}
try{const w=JSON.parse(localStorage.getItem('rechte-kompass:lessonW'));if(w>0)document.documentElement.style.setProperty('--lesson-w',w+'px')}catch(e){}</script>
<title>Rechte-Kompass</title>
<meta name="description" content="Authentifizierung und Autorisierung zum Anfassen: Sessions, JWT, OAuth 2.0, OpenID Connect, RBAC, ABAC, PBAC und ReBAC – mit Simulatoren und Beispielen in Angular 22 und Spring Security.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --anno:#A3135F; --anno-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --ph-bad:#A3A3A3;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#15803D; --brand-ink-l:#FFFFFF; --brand-soft-l:#E4F4EA;
  --brand-d:#86EFAC; --brand-ink-d:#052E16; --brand-soft-d:#0F2A1A;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --anno:#FF7AB8; --anno-ink:#2A0717;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --ph-bad:#555B64;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --anno:#FF7AB8; --anno-ink:#2A0717;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --ph-bad:#555B64;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.theme-btn .ic-sun,.theme-btn[aria-pressed="true"] .ic-moon{display:none}
.theme-btn[aria-pressed="true"] .ic-sun{display:block}
.width-btn .ic-narrow,.width-btn[aria-pressed="true"] .ic-wide{display:none}
.width-btn[aria-pressed="true"] .ic-narrow{display:block}
/* Unter 1280px ist „breit“ kaum breiter als normal – dann braucht es den Knopf nicht */
@media (max-width:1279px){.width-btn{display:none}}
/* Breite Ansicht: die Lektion nutzt die ganze Spalte statt 48rem */
:root[data-width="wide"] .lesson{position:relative;max-width:var(--lesson-w,none);padding-left:clamp(16px,3vw,56px);padding-right:clamp(16px,3vw,56px)}
/* Zieh-Griff am rechten Rand der Lektion – nur in der breiten Ansicht */
.lesson-grip{display:none}
:root[data-width="wide"] .lesson-grip{display:block;position:absolute;top:0;bottom:0;right:0;width:14px;cursor:ew-resize;touch-action:none}
.lesson-grip::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--line);transition:background-color .15s}
.lesson-grip span{position:sticky;top:calc(50% - 24px);display:block;width:8px;height:48px;margin-left:3px;border-radius:4px;background:var(--line-strong);transition:background-color .15s}
.lesson-grip:hover::before,.lesson-grip:focus-visible::before,.lesson-grip.is-dragging::before,.lesson-grip:hover span,.lesson-grip:focus-visible span,.lesson-grip.is-dragging span{background:var(--brand)}
.lesson-grip:focus-visible{outline-offset:0}
:root.is-resizing,:root.is-resizing *{cursor:ew-resize!important;user-select:none}
@media (max-width:1279px){:root[data-width="wide"] .lesson-grip{display:none}}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Switch */
.switch{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 6px;background:transparent;border:0;border-radius:var(--radius-ctl);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:left}
.switch:hover{background:var(--surface-2)}
.track{width:42px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;transition:background-color .15s;flex:none}
.thumb{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgb(0 0 0 / .3)}
.switch[aria-checked="true"] .track{background:var(--brand)}
.switch[aria-checked="true"] .thumb{transform:translateX(16px);background:var(--brand-ink)}

/* Segmented control */
.seg{border:0;padding:0;margin:0;min-width:0}
.seg legend{font-weight:700;padding:0;margin-bottom:8px}
.seg-opts{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface)}
.seg label{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:.9375rem}
.seg label:hover{background:var(--surface-2)}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.progress{display:grid;gap:6px;position:relative}
.progress-row{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar>span{display:block;height:100%;width:var(--p,0%);background:var(--brand);transition:width .3s}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.lessons-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;position:relative}
.refs li{font:600 .75rem/1.2 var(--font-mono);padding:5px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);color:var(--muted);background:var(--surface)}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin:0;position:relative}
@container (min-width:620px){.numbers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.num{background:var(--surface);padding:14px 16px}
.num dt{font:600 1.0625rem/1.3 var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num dd{margin:5px 0 0;font-size:.875rem;color:var(--muted);line-height:1.4}
.demo{margin-top:40px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);position:relative}
.demo-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.lesson .demo-head h2{margin:0;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase}
.demo-head span{font-size:.875rem;color:var(--muted)}
.demo-body{padding:20px 18px 22px;display:grid;gap:28px;min-width:0}
.demo-body h3{font:700 1rem/1.3 var(--font-body);margin:0 0 10px}
.demo-note{font-size:.875rem;color:var(--muted);margin:10px 0 0;line-height:1.45}
.dodont{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:40px;position:relative}
.dd{border-top:4px solid var(--success);padding-top:12px}
.dd.dont{border-top-color:var(--danger)}
.lesson .dd h2{display:flex;align-items:center;gap:8px;font:700 1rem/1.3 var(--font-body);margin:0 0 10px;color:var(--success)}
.lesson .dd.dont h2{color:var(--danger)}
.dd ul{margin:0;padding-left:1.15em;display:grid;gap:8px}
.prose p{margin:0 0 12px;max-width:68ch}
.here{margin-top:40px;padding:16px 18px 18px;background:var(--brand-soft);border-radius:var(--radius-lg);position:relative}
.lesson .here h2{margin:0 0 6px;font:700 .8125rem/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.here p{margin:0;max-width:68ch}
.learned{margin-top:32px;display:flex;align-items:center;gap:12px;padding:10px 16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);position:relative;min-height:56px}
.learned input{width:24px;height:24px;accent-color:var(--brand);margin:0;flex:none}
.learned label{font-weight:700;cursor:pointer;flex:1}
.learned .hint{display:block;font-weight:400}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Tags used in comparisons */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:700;margin:0 0 8px}
.tag .ic{width:18px;height:18px}
.tag-good{color:var(--success)}
.tag-bad{color:var(--danger)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.compare figure{margin:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);min-width:0}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.anatomy{margin:0;padding-left:1.4em;display:grid;gap:6px}
.anatomy li::marker{font-family:var(--font-mono);color:var(--muted)}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chapters a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-weight:700}
.chapters a:hover{color:var(--brand)}
.chapters span{font-weight:400;color:var(--muted);font-family:var(--font-mono);font-size:.875rem;white-space:nowrap}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.kb-table{width:100%;border-collapse:collapse;font-size:.9375rem}
.kb-table th,.kb-table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kb-table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer}
.refs a{color:inherit;text-decoration:none;display:block;margin:-5px -9px;padding:5px 9px;border-radius:inherit}
.refs li:has(a){border-color:var(--brand);color:var(--brand)}
.refs a:hover{background:var(--brand-soft)}
.k-code{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.k-code-1{grid-template-columns:minmax(0,1fr)}
.k-code figure{margin:0;border:1.5px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);min-width:0}
.k-code figcaption{display:flex;align-items:center;gap:6px;padding:8px 12px;font-weight:700;font-size:.875rem;border-bottom:1px solid var(--line)}
.k-code figcaption .ic{width:18px;height:18px}
.k-bad figcaption{color:var(--danger);background:var(--danger-bg)}
.k-good figcaption{color:var(--success);background:var(--success-bg)}
.k-pre{margin:0;padding:12px 14px;font:400 .8125rem/1.55 var(--font-mono);overflow-x:auto;white-space:pre;tab-size:2}
.k-pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
/* ---------- Rechte-Kompass ---------- */
a.logo{color:inherit;text-decoration:none;border-radius:var(--radius-sm);padding:2px 8px 2px 2px;margin-left:-2px}
a.logo:hover{background:var(--surface-2)}
.logo-name{display:block}
.logo-mark .ic{width:22px;height:22px;stroke-width:2.2}
@media (max-width:479px){.logo-sub{display:none}}
.lang-link{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl)}
.lang-link:hover{background:var(--surface-2)}
@media (max-width:479px){.lang-link{padding:0 8px}}
.start-grid.sisters{margin-top:12px}
/* Persona-Auswahl in der Kopfleiste */
.who{display:flex;align-items:center;gap:8px}
.who label{font-weight:700;font-size:.9375rem;white-space:nowrap}
.who select{min-height:40px;font-weight:700}
.who-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .8125rem/1 var(--font-body);background:var(--brand-soft);color:var(--brand);flex:none}
@media (max-width:719px){.who label .who-long{display:none}}
/* Lektionsseite */
.lesson .prose h3{font:700 1.0625rem/1.35 var(--font-body);margin:28px 0 8px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em;display:grid;gap:6px;max-width:68ch}
.prose li>ul{margin-top:6px}
.prose .table-wrap{margin:8px 0 16px}
.prose blockquote{margin:0 0 12px;padding:10px 16px;border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;max-width:68ch}
.prose blockquote p:last-child{margin:0}
.refs li a{display:flex;align-items:center;gap:4px}
.refs .ic{width:13px;height:13px}
.glance td:first-child{white-space:nowrap}
.glance td:first-child code{background:none;padding:0}
.k-plain figcaption{color:var(--brand);background:var(--brand-soft)}
.k-lang{margin-left:auto;font:600 .75rem/1 var(--font-mono);padding:3px 7px;border-radius:6px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.k-note{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:.9375rem;background:var(--surface)}
.k-pre .c{color:var(--muted);font-style:italic}
.k-pre .s{color:var(--hl-str)}
.k-pre .a{color:var(--hl-ann)}
.k-pre .k{color:var(--hl-kw);font-weight:600}
:root{--hl-str:#9A3412;--hl-ann:#7E22CE;--hl-kw:#1D4ED8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl-str:#FDBA74;--hl-ann:#D8B4FE;--hl-kw:#93C5FD}}
:root[data-theme="dark"]{--hl-str:#FDBA74;--hl-ann:#D8B4FE;--hl-kw:#93C5FD}
.yes{color:var(--success);font-weight:700}
.no{color:var(--danger);font-weight:700}
.meh{color:var(--warn);font-weight:700}
.compare-table th[scope="row"]{white-space:nowrap}
.compare-table td,.compare-table th{min-width:9rem}
/* Diagramm: Kette aus Knoten mit Pfeilen */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:12px 0 18px}
.chain-node{flex:1 1 120px;min-width:0;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);display:grid;gap:2px;align-content:center;text-align:center}
.chain-node b{font-size:.9375rem}
.chain-node small{color:var(--muted);font-size:.8125rem;line-height:1.35}
.chain-node.is-brand{border-color:var(--brand);background:var(--brand-soft)}
.chain-node.is-warn{border-color:var(--warn);background:var(--warn-bg)}
.chain-node.is-bad{border-color:var(--danger);background:var(--danger-bg)}
.chain-node.is-good{border-color:var(--success);background:var(--success-bg)}
.chain-arrow{display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center;min-width:28px;flex:0 1 auto}
.chain-arrow .ic{width:22px;height:22px}
.chain-arrow span{display:block;max-width:8rem;line-height:1.25}
@media (max-width:599px){.chain{flex-direction:column}.chain-arrow .ic{transform:rotate(90deg)}}
/* Sequenzdiagramm */
.seq{--n:3;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 4px;margin:12px 0 18px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:12px 8px;overflow-x:auto;min-width:0}
.seq-actor{text-align:center;font-weight:700;font-size:.875rem;padding:6px 4px;border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:8px;overflow-wrap:anywhere}
.seq-step{position:relative;display:grid;gap:2px;padding:6px 6px 8px;font-size:.8125rem;line-height:1.35;border-radius:var(--radius-sm);text-align:center;min-width:0}
.seq-step::after{content:"";display:block;height:2px;background:var(--line-strong);margin-top:4px;position:relative}
.seq-step .seq-lbl{overflow-wrap:anywhere}
.seq-step .seq-dir{font:700 .75rem/1 var(--font-mono);color:var(--muted)}
.seq-step.is-self::after{background:repeating-linear-gradient(90deg,var(--line-strong) 0 6px,transparent 6px 10px)}
.seq-step.is-on{background:var(--brand-soft);outline:2px solid var(--brand)}
.seq-step.is-on::after{background:var(--brand)}
.seq-step.is-back::after{background:repeating-linear-gradient(90deg,var(--line-strong) 0 6px,transparent 6px 10px)}
.seq-num{font:700 .6875rem/1 var(--font-mono);color:var(--brand)}
.stepper{display:grid;gap:12px}
.stepper-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepper-pos{font:600 .875rem/1 var(--font-mono);color:var(--muted);margin-left:auto}
.stepper-detail{padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--radius-sm);background:var(--surface);min-height:5em}
.stepper-detail p{margin:0 0 6px;max-width:68ch}
.stepper-detail p:last-child{margin:0}
.stepper-detail pre{margin:6px 0 0;padding:8px 10px;background:var(--surface-2);border-radius:6px;font:400 .8125rem/1.5 var(--font-mono);overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
/* Gemeinsame Bausteine der Demos */
.panel{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg);padding:14px;min-width:0}
.panel h3{margin:0 0 10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:start}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .field{flex:1 1 10rem;min-width:0}
.field select{width:100%}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);font-weight:700;border:1.5px solid var(--line-strong);background:var(--surface)}
.verdict .ic{margin-top:2px}
.verdict.is-ok{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.verdict.is-no{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.verdict.is-warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.verdict small{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.trace{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.875rem}
.trace li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start;padding:6px 8px;border-radius:6px;background:var(--surface)}
.trace .ic{width:18px;height:18px;margin-top:1px}
.trace .t-ok .ic{color:var(--success)}
.trace .t-no .ic{color:var(--danger)}
.trace .t-skip{color:var(--muted)}
.trace code{font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 .75rem/1.2 var(--font-mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.is-on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.mono{font-family:var(--font-mono);font-size:.875rem}
.out{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font:400 .8125rem/1.55 var(--font-mono);white-space:pre-wrap;overflow-wrap:anywhere;min-height:3em}
.log{list-style:none;margin:0;padding:8px;display:grid;gap:3px;font:400 .8125rem/1.45 var(--font-mono);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);max-height:16rem;overflow:auto;min-height:4em}
.log li{overflow-wrap:anywhere}
.log .l-ok{color:var(--success)}
.log .l-no{color:var(--danger)}
.log .l-info{color:var(--muted)}
textarea.input{min-height:7em;padding:10px 12px;font:400 .8125rem/1.5 var(--font-mono);resize:vertical}
.matrix{border-collapse:collapse;font-size:.875rem;width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}
.matrix th[scope="row"],.matrix thead th:first-child{text-align:left;white-space:nowrap}
.matrix thead th{font:600 .75rem/1.2 var(--font-mono);vertical-align:bottom}
.matrix input{width:20px;height:20px;accent-color:var(--brand);margin:0;cursor:pointer}
.matrix tr.is-hl>*{background:var(--brand-soft)}
/* Mini-App „Rechnungen“ der Nordwind GmbH */
.mini{border:1.5px solid var(--line-strong);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;font-size:.9375rem;min-width:0}
.mini-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.mini-brand{font-weight:800;font-family:var(--font-display);display:flex;align-items:center;gap:6px}
.mini-brand .ic{color:var(--brand)}
.mini-nav{display:flex;flex-wrap:wrap;gap:2px;list-style:none;margin:0;padding:0}
.mini-nav a{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.875rem}
.mini-nav a[aria-current="page"]{background:var(--surface);color:var(--brand)}
.mini-nav a:hover{background:var(--surface)}
.mini-user{margin-left:auto;font-size:.8125rem;color:var(--muted)}
.mini-body{padding:12px;display:grid;gap:10px;min-width:0}
.mini-body h4{margin:0;font:700 1rem/1.3 var(--font-display)}
.mini-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mini-tbl{width:100%;border-collapse:collapse;font-size:.875rem}
.mini-tbl th,.mini-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.mini-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini-tbl .acts{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.mini .btn{min-height:34px;padding:0 10px;font-size:.8125rem;border-radius:8px}
.mini .btn[aria-disabled="true"]{opacity:.45}
.mini-empty{padding:18px;text-align:center;color:var(--muted)}
.mini-lock{display:flex;gap:8px;align-items:flex-start;padding:12px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-sm);color:var(--muted)}
.status{font:600 .75rem/1.2 var(--font-mono);padding:2px 7px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.status.s-submitted{background:var(--warn-bg);color:var(--warn)}
.status.s-approved{background:var(--success-bg);color:var(--success)}
.status.s-paid{background:var(--brand-soft);color:var(--brand)}
.persona-tbl td:first-child{white-space:nowrap}
/* Quiz */
.quiz{display:grid;gap:4px}
.ue-opts{border:0;padding:0;margin:16px 0 0;min-width:0}
.ue-opts legend{font-weight:700;padding:0;margin-bottom:8px}
.ue-optlist{display:grid;gap:6px}
.ue-opt{display:flex;gap:10px;align-items:center;min-height:44px;padding:6px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;overflow-wrap:anywhere}
.ue-opt:hover{border-color:var(--line-strong)}
.ue-opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.ue-opt input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brand)}
.ue-opt span{min-width:0}
.ue-fb{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;max-width:68ch}
.ue-fb .ic{margin-top:2px}
.ue-fb.is-ok .ic,.ue-fb.is-ok strong{color:var(--success)}
.ue-fb.is-no .ic,.ue-fb.is-no strong{color:var(--danger)}
.quiz-score{margin:12px 0 0;font-weight:700;color:var(--muted);min-height:1.5em}
.tip{position:relative}
</style>
</head>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={
  get(k,d){try{const v=localStorage.getItem('rechte-kompass:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('rechte-kompass:'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- Sprache ----------
   Die Sprache gilt für den ganzen Seitenaufruf, der Umschalter lädt neu. Darum darf tx() auch in Daten
   stehen, die beim Start einmal ausgewertet werden. Reihenfolge: ?lang=, gespeicherte Wahl, Browsersprache. */
const LANG=(()=>{
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='de'||q==='en'){store.set('lang',q);return q}
  const s=store.get('lang',null);
  return s==='de'||s==='en'?s:/^de/i.test(navigator.language||'')?'de':'en';
})();
const tx=(de,en)=>LANG==='en'?en:de;
const LOCALE=tx('de-AT','en-US');
document.documentElement.lang=LANG;
const langHref=l=>{const u=new URL(location.href);u.searchParams.set('lang',l);return u.href};
if(LANG==='en')$$('[data-en],[data-en-label]').forEach(el=>{
  if(el.dataset.en)el.textContent=el.dataset.en;
  if(el.dataset.enLabel)el.setAttribute('aria-label',el.dataset.enLabel);
});

/* Breite ziehen: Griff am rechten Rand der Lektion, nur in der breiten Ansicht. Die Lektion ist
   zentriert, darum wächst sie beim Ziehen nach beiden Seiten – Breite = 2 × Abstand zur Mitte. */
(()=>{
  const root=document.documentElement,view=$('#view');
  const lesson=()=>$('.lesson',view);
  const min=()=>parseFloat(getComputedStyle(root).fontSize)*48;
  const max=()=>view.clientWidth;
  const clamp=w=>Math.min(max(),Math.max(min(),w));
  const set=w=>{if(w==null)root.style.removeProperty('--lesson-w');else root.style.setProperty('--lesson-w',Math.round(w)+'px')};
  const aria=()=>{const g=$('.lesson-grip',view),L=lesson();if(!g||!L)return;
    g.setAttribute('aria-valuemin',Math.round(min()));g.setAttribute('aria-valuemax',Math.round(max()));g.setAttribute('aria-valuenow',Math.round(L.getBoundingClientRect().width))};
  // An den Rand gezogen heißt „ganze Breite“ – dann wächst die Lektion auch mit dem Fenster mit
  const commit=w=>{const full=w>=max()-1;set(full?null:w);store.set('lessonW',full?null:Math.round(w));aria()};
  function attach(){
    const L=lesson();if(!L||$('.lesson-grip',L))return;
    const g=document.createElement('div');
    g.className='lesson-grip';g.tabIndex=0;g.setAttribute('role','separator');g.setAttribute('aria-orientation','vertical');
    g.setAttribute('aria-label',tx('Breite der Lektion','Lesson width'));
    g.title=tx('Ziehen ändert die Breite · Doppelklick: ganze Breite','Drag to resize · double-click: full width');
    g.innerHTML='<span></span>';L.append(g);aria();
  }
  view.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.lesson-grip');if(!g||e.button!==0)return;
    e.preventDefault();
    const r=lesson().getBoundingClientRect(),cx=r.left+r.width/2;
    g.setPointerCapture(e.pointerId);g.classList.add('is-dragging');root.classList.add('is-resizing');
    const move=ev=>set(clamp(2*(ev.clientX-cx)));
    const up=()=>{g.removeEventListener('pointermove',move);g.classList.remove('is-dragging');root.classList.remove('is-resizing');commit(lesson().getBoundingClientRect().width)};
    g.addEventListener('pointermove',move);g.addEventListener('lostpointercapture',up,{once:true});
  });
  view.addEventListener('dblclick',e=>{if(e.target.closest('.lesson-grip'))commit(max())});
  view.addEventListener('keydown',e=>{
    if(!e.target.classList.contains('lesson-grip'))return;
    const w=lesson().getBoundingClientRect().width,step=e.shiftKey?160:40;
    const next={ArrowLeft:w-step,ArrowRight:w+step,Home:min(),End:max()}[e.key];
    if(next!=null){e.preventDefault();e.stopPropagation();commit(clamp(next))}
  });
  view.addEventListener('focusin',e=>{if(e.target.classList.contains('lesson-grip'))aria()});
  new MutationObserver(attach).observe(view,{childList:true});attach();
})();

  const t=document.createElement('div');

  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;

  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label',tx('Meldung schließen','Close message'));closeBtn.innerHTML=ic('x');

  t.append(timer);

  while(toastBox.children.length>3) toastBox.firstElementChild.remove();
  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    const hadFocus=t.contains(document.activeElement);

    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',()=>{clearTimeout(id);remaining-=Date.now()-start});
  t.addEventListener('mouseleave',()=>{start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))});

}

/* ---------- Bausteine für Lektionen ----------
   hl(): sehr kleiner Syntax-Hervorheber. Ein einziger regulärer Ausdruck findet Kommentare, Strings,
   Annotationen und Schlüsselwörter von links nach rechts – was er nicht trifft, wird nur escaped. */
const KW='const|let|var|function|return|if|else|export|import|from|class|new|public|private|protected|static|final|void|async|await|true|false|null|this|interface|type|extends|implements|readonly|throw|try|catch|default|package|record|permit|forbid|when|unless|allow|deny|some|in|not';
const HL_RE=new RegExp(String.raw`(\/\/[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|\x60(?:\\.|[^\x60\\])*\x60)|(@[A-Za-z][\w.]*)|\b(${KW})\b`,'g');
const HL_HASH=/(#[^\n]*)/g;
function hl(src,lang){
  src=String(src).replace(/^\n+|\s+$/g,'');
  if(lang==='yaml'||lang==='rego'||lang==='properties'||lang==='bash'){
    return src.split('\n').map(line=>{const i=line.search(/(^|\s)#/);return i<0?esc(line):esc(line.slice(0,i))+`<span class="c">${esc(line.slice(i))}</span>`}).join('\n');
  }
  if(lang==='text'||lang==='http')return esc(src);
  let out='',last=0;
  src.replace(HL_RE,(m,c,s,a,k,i)=>{out+=esc(src.slice(last,i));out+=`<span class="${c?'c':s?'s':a?'a':'k'}">${esc(m)}</span>`;last=i+m.length;return m});
  return out+esc(src.slice(last));
}

/* Mini-App: Rechnungsliste der Nordwind GmbH. mode: 'naive' (keine Prüfung), 'hide' (verstecken),
   'disable' (deaktivieren mit Grund). check: (perm, invoice, persona) → {ok, why}. */
function defaultCheck(perm,inv,p){
  if(!can(perm,p))return{ok:false,why:tx(`Dir fehlt die Berechtigung ${perm}.`,`You lack the permission ${perm}.`)};
  if(perm==='invoice:approve'&&inv){
    if(inv.status!=='submitted')return{ok:false,why:tx('Nur eingereichte Rechnungen lassen sich freigeben.','Only submitted invoices can be approved.')};
    if(inv.team!==p.team)return{ok:false,why:tx('Nur Rechnungen des eigenen Teams.','Only your own team’s invoices.')};
    if(inv.amount>(p.limit??Infinity))return{ok:false,why:tx(`Über deinem Freigabelimit von ${eur(p.limit)}.`,`Above your approval limit of ${eur(p.limit)}.`)};
    if(inv.createdBy===p.id)return{ok:false,why:tx('Eigene Rechnungen darfst du nicht selbst freigeben.','You may not approve your own invoices.')};
  }
  if(perm==='invoice:pay'&&inv&&inv.status!=='approved')return{ok:false,why:tx('Bezahlt wird erst nach der Freigabe.','Payment only after approval.')};
  if(perm==='invoice:edit'&&inv&&!['draft','submitted'].includes(inv.status))return{ok:false,why:tx('Freigegebene Rechnungen sind gesperrt.','Approved invoices are locked.')};
  return{ok:true,why:''};
}
function miniHTML(p,{mode='hide',check=defaultCheck,page='invoices'}={}){

    <div class="table-wrap"><table class="mini-tbl"><thead><tr><th scope="col">${tx('Nr.','No.')}</th><th scope="col">${tx('Kunde','Customer')}</th><th scope="col">Team</th><th scope="col" class="num">${tx('Betrag','Amount')}</th><th scope="col">Status</th><th scope="col"><span class="sr-only">${tx('Aktionen','Actions')}</span></th></tr></thead>

</div>`;

/* Gemeinsame Klicks in der Mini-App: deaktivierte Knöpfe erklären sich, aktive melden, was der Server täte */
function miniInit(root,render,{serverCheck=true}={}){
  root.addEventListener('click',e=>{
    const a=e.target.closest('.mini a[data-page]');if(a){e.preventDefault();return}
    const b=e.target.closest('.mini button');if(!b)return;
    if(b.dataset.act==='login'){setPersona('tom');return}
    if(b.getAttribute('aria-disabled')==='true'){toast({msg:b.dataset.why,type:'error',duration:3500});return}
    const perm=b.dataset.act,inv=INVOICES.find(i=>i.id===b.dataset.inv);
    const r=defaultCheck(perm,inv,persona());
    if(serverCheck&&!r.ok)toast({msg:tx(`Server: 403 Forbidden – ${r.why}`,`Server: 403 Forbidden – ${r.why}`),type:'error'});
    else toast({msg:tx(`Server: 200 OK – ${PERM_LABEL[perm]}${inv?' '+inv.id:''} ausgeführt.`,`Server: 200 OK – ${PERM_LABEL[perm]}${inv?' '+inv.id:''} done.`),type:'success',duration:3000});
  });
  return onPersona(render);
}

LESSONS.push({

  rule:tx('<b>Authentifizierung</b> (AuthN) prüft, <i>wer</i> eine Anfrage stellt. <b>Autorisierung</b> (AuthZ) entscheidet, <i>was</i> diese Person tun darf. Die Reihenfolge ist fest: Erst wenn klar ist, wer du bist, kann jemand entscheiden, was du darfst. Scheitert der erste Schritt, antwortet der Server mit <code>401</code>, scheitert der zweite, mit <code>403</code>.','<b>Authentication</b> (AuthN) checks <i>who</i> makes a request. <b>Authorization</b> (AuthZ) decides <i>what</i> that person may do. The order is fixed: only once it’s clear who you are can anyone decide what you may do. If the first step fails, the server answers <code>401</code>; if the second fails, <code>403</code>.'),

  body:tx(`<h3>Zwei Schritte, nacheinander</h3>
${chain([['Anfrage','GET /api/invoices/R-1003'],['Authentifizierung','Wer bist du?','brand'],['Autorisierung','Darfst du das?','brand'],['Antwort','200, 401 oder 403']],['','',''])}
<p>Im Alltag verschwimmen die Begriffe, weil beides oft im selben Schritt passiert: Beim Login weist du dich aus, und gleich danach entscheidet die App, welche Menüpunkte du siehst. Technisch sind es zwei getrennte Fragen – und sie werden von verschiedenen Bausteinen beantwortet. In Spring prüft zum Beispiel der <code>BearerTokenAuthenticationFilter</code> das Token (AuthN), danach entscheidet der <code>AuthorizationFilter</code> über die Anfrage (AuthZ).</p>
<h3>401 oder 403?</h3>
<p>Der Unterschied ist für das Frontend wichtig: Auf <code>401</code> reagiert es mit „neu anmelden“ oder „Token erneuern“. Auf <code>403</code> wäre das sinnlos – hier zeigt es „Dafür fehlen dir die Rechte“. Wer beides gleich behandelt, schickt Benutzer in Login-Schleifen.</p>`,
`<h3>Two steps, one after the other</h3>
${chain([['Request','GET /api/invoices/R-1003'],['Authentication','Who are you?','brand'],['Authorization','May you do this?','brand'],['Response','200, 401 or 403']],['','',''])}
<p>In everyday speech the terms blur because both often happen in one go: you identify yourself at login, and right after that the app decides which menu items you see. Technically they are two separate questions – answered by different building blocks. In Spring, for example, the <code>BearerTokenAuthenticationFilter</code> checks the token (AuthN), then the <code>AuthorizationFilter</code> decides on the request (AuthZ).</p>
<h3>401 or 403?</h3>
<p>The difference matters for the frontend: on <code>401</code> it reacts with “sign in again” or “refresh the token”. On <code>403</code> that would be pointless – here it shows “You lack the permission for this”. Treating both the same sends users into login loops.</p>`),

  <div class="field"><label for="aa-token">${tx('Token in der Anfrage','Token in the request')}</label><select id="aa-token">
    <option value="valid">${tx('gültiges Token der gewählten Person','valid token of the selected person')}</option>
    <option value="expired">${tx('abgelaufenes Token','expired token')}</option>
    <option value="none">${tx('kein Token','no token')}</option>
  </select></div>
</div>
<div id="aa-out"></div>`,
  init(root){
    const out=$('#aa-out',root);
    const run=()=>{

      if(tok==='none'||p.id==='guest'){steps.push(['no',tx('AuthN: Kein <code>Authorization</code>-Header – niemand bekannt.','AuthN: no <code>Authorization</code> header – nobody known.')]);steps.push(['skip',tx('AuthZ: übersprungen – ohne Identität gibt es nichts zu entscheiden.','AuthZ: skipped – without an identity there is nothing to decide.')]);res=verdict(false,'401 Unauthorized',tx('Frontend: zum Login schicken.','Frontend: send to login.'))}
      else if(tok==='expired'){steps.push(['no',tx('AuthN: Token abgelaufen (<code>exp</code> liegt in der Vergangenheit).','AuthN: token expired (<code>exp</code> is in the past).')]);steps.push(['skip',tx('AuthZ: übersprungen.','AuthZ: skipped.')]);res=verdict(false,'401 Unauthorized',tx('Frontend: Token erneuern, Anfrage wiederholen.','Frontend: refresh the token, retry the request.'))}
      else{

      }

  why:tx('<p>Die meisten Sicherheitslücken in APIs sind keine kaputten Logins, sondern fehlende Autorisierung: Die Anfrage ist korrekt authentifiziert, aber niemand prüft, ob <i>diese</i> Person <i>diese</i> Rechnung sehen darf. Platz 1 der OWASP API Security Top 10 ist genau das (Broken Object Level Authorization). Wer die beiden Schritte im Kopf trennt, vergisst den zweiten seltener.</p>','<p>Most API vulnerabilities aren’t broken logins but missing authorization: the request is correctly authenticated, but nobody checks whether <i>this</i> person may see <i>this</i> invoice. Number 1 of the OWASP API Security Top 10 is exactly that (Broken Object Level Authorization). Keeping the two steps apart in your head makes you forget the second one less often.</p>')

  body:tx(`<h3>Warum nicht einfach SHA-256?</h3>
<p>SHA-256 ist für Geschwindigkeit gebaut. Eine Grafikkarte rechnet Milliarden davon pro Sekunde – ein achtstelliges Passwort ist so in Stunden durchprobiert. Passwort-Hashes sind <i>absichtlich</i> langsam: Ein Login merkt 100 Millisekunden nicht, ein Angreifer mit Milliarden Versuchen sehr wohl.</p>
<h3>Was NIST heute empfiehlt</h3>
<ul><li>Mindestens 8 Zeichen, besser 15 – und lange Passphrasen erlauben (mindestens 64 Zeichen).</li><li>Keine Zusammensetzungsregeln („ein Sonderzeichen, eine Ziffer“) und kein regelmäßiger Zwangswechsel.</li><li>Neue Passwörter gegen Listen bekannter, geleakter Passwörter prüfen.</li></ul>
<blockquote><p>In einer Firmen-App mit Keycloak, Entra ID oder Auth0 hashst du selbst gar nichts: Der Identity Provider speichert die Passwörter, deine App sieht nur noch Tokens. Diese Lektion erklärt, was dort passiert – und was du tust, wenn du doch einmal selbst Passwörter speicherst.</p></blockquote>`,
`<h3>Why not just SHA-256?</h3>
<p>SHA-256 is built for speed. A graphics card computes billions of them per second – an eight-character password is brute-forced in hours. Password hashes are <i>deliberately</i> slow: a login doesn’t notice 100 milliseconds, an attacker with billions of attempts certainly does.</p>
<h3>What NIST recommends today</h3>
<ul><li>At least 8 characters, better 15 – and allow long passphrases (at least 64 characters).</li><li>No composition rules (“one special character, one digit”) and no forced periodic changes.</li><li>Check new passwords against lists of known, leaked passwords.</li></ul>
<blockquote><p>In a company app with Keycloak, Entra ID or Auth0 you hash nothing yourself: the identity provider stores the passwords, your app only sees tokens. This lesson explains what happens there – and what you do if you ever store passwords yourself.</p></blockquote>`),

<div id="pw-out"></div>`,
