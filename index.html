  ['IETF recommendation for sensitive apps','','<span class="yes">yes</span>']
],{caption:'SPA and BFF'})}`),
  demoHint:tx('Der gleiche Login wie mit PKCE – nur macht ihn jetzt der BFF.','The same login as with PKCE – except the BFF does it now.'),
  demo:'<div id="bff-host"></div>',
  init(root){
    const A=['Browser (Angular)','BFF (Spring)','Keycloak','invoice-api'];
    const S=[
      [0,1,'GET /login',tx('<p>Die Angular-App leitet einfach auf eine URL des BFF um – sie kennt weder Client-ID noch Tokens.</p>','<p>The Angular app simply redirects to a BFF URL – it knows neither client ID nor tokens.</p>')],
      [1,2,tx('Authorization Code + PKCE','authorization code + PKCE'),tx('<p>Der BFF startet den Flow wie die SPA vorher – aber als vertraulicher Client.</p>','<p>The BFF starts the flow like the SPA did before – but as a confidential client.</p>')],
      [2,1,'code',''],
      [1,2,tx('POST /token mit Client Secret','POST /token with client secret'),tx('<p>Server-zu-Server: Das Secret verlässt das Rechenzentrum nie.</p>','<p>Server to server: the secret never leaves the data center.</p>')],
      [2,1,'access, refresh, id token',tx('<p>Der BFF legt die Tokens in seine Session (Speicher oder Redis).</p>','<p>The BFF puts the tokens into its session (memory or Redis).</p>')],
      [1,0,'Set-Cookie: __Host-SESSION',`<pre>Set-Cookie: __Host-SESSION=8f2c…; Path=/; Secure; HttpOnly; SameSite=Lax</pre><p>${tx('Mehr bekommt der Browser nie.','That’s all the browser ever gets.')}</p>`],
      [0,1,'GET /api/invoices (Cookie)',tx('<p>Die App ruft relative URLs auf, der Browser schickt das Cookie mit. Für POST kommt der CSRF-Header dazu.</p>','<p>The app calls relative URLs, the browser sends the cookie. For POST the CSRF header is added.</p>')],
      [1,3,'GET /api/invoices (Bearer)',tx('<p>Token Relay: Der BFF holt das Access Token aus der Session, erneuert es bei Bedarf und hängt es an.</p>','<p>Token relay: the BFF takes the access token from the session, renews it if needed and attaches it.</p>')],
      [3,1,'200',''],
      [1,0,'200','']
    ];
    const host=$('#bff-host',root);host.innerHTML=stepperHTML('bff-st',A,S);stepperInit($('#bff-st',host),S);
  },
  code:[{t:tx('Spring Cloud Gateway als BFF','Spring Cloud Gateway as BFF'),lang:'yaml',src:`spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: invoice-bff
            client-secret: \${BFF_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile,offline_access
        provider:
          keycloak:
            issuer-uri: https://login.nordwind.example/realms/nordwind
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: invoice-api
              uri: https://api.nordwind.internal
              predicates: [ Path=/api/** ]
              filters: [ TokenRelay= ]`,note:tx('Dazu im Gateway <code>http.oauth2Login()</code> und CSRF mit Cookie-Token für Angular (<code>CookieServerCsrfTokenRepository.withHttpOnlyFalse()</code>). Angulars <code>HttpClient</code> liest das Cookie <code>XSRF-TOKEN</code> und setzt den Header automatisch.','Plus <code>http.oauth2Login()</code> in the gateway and CSRF with a cookie token for Angular (<code>CookieServerCsrfTokenRepository.withHttpOnlyFalse()</code>). Angular’s <code>HttpClient</code> reads the <code>XSRF-TOKEN</code> cookie and sets the header automatically.')}],
  do:tx(['BFF für Apps mit sensiblen Daten (Finanzen, Gesundheit, Admin).','BFF und SPA auf derselben Site betreiben, damit <code>SameSite</code> greift.','CSRF-Schutz im BFF anlassen.'],['BFF for apps with sensitive data (finance, health, admin).','Run BFF and SPA on the same site so <code>SameSite</code> applies.','Keep CSRF protection on in the BFF.']),
  dont:tx(['Tokens vom BFF doch wieder an den Browser zurückgeben („für die Anzeige“).','Den BFF zum Ort für Geschäftslogik machen – er ist ein Proxy.','Autorisierung nur im BFF machen; die API prüft trotzdem selbst.'],['Hand tokens from the BFF back to the browser after all (“for display”).','Turn the BFF into a home for business logic – it’s a proxy.','Do authorization only in the BFF; the API still checks on its own.']),
  why:tx('<p>Kein Speicherort im Browser ist sicher vor XSS. Der BFF löst das Problem, indem er die Frage abschafft: Was nicht im Browser ist, kann dort auch nicht gestohlen werden. Die IETF empfiehlt ihn deshalb für Browser-Apps mit erhöhtem Schutzbedarf.</p>','<p>No storage location in the browser is safe from XSS. The BFF solves the problem by abolishing the question: what isn’t in the browser can’t be stolen there. That’s why the IETF recommends it for browser apps with elevated protection needs.</p>')
});

LESSONS.push({
  id:'sso-logout',cat:'protocols',
  title:tx('Single Sign-on und Logout','Single sign-on and logout'),
  short:tx('Einmal anmelden, überall drin – und warum Abmelden schwieriger ist.','Sign in once, be in everywhere – and why signing out is harder.'),
  keys:'sso single sign-on logout rp-initiated front-channel back-channel end_session session idp',
  refs:[['OIDC RP-Initiated Logout','https://openid.net/specs/openid-connect-rpinitiated-1_0.html'],['OIDC Back-Channel Logout','https://openid.net/specs/openid-connect-backchannel-1_0.html']],
  rule:tx('Single Sign-on entsteht durch die <b>Session beim Identity Provider</b>: Wer dort angemeldet ist, bekommt in jeder weiteren App sofort einen Code, ohne Passwort. Darum heißt Logout drei Dinge: die <b>lokale Session</b> der App beenden, die <b>IdP-Session</b> beenden (RP-initiated Logout) und die <b>anderen Apps</b> benachrichtigen (Back-Channel Logout).','Single sign-on comes from the <b>session at the identity provider</b>: whoever is signed in there gets a code in every further app right away, without a password. That’s why logout means three things: end the app’s <b>local session</b>, end the <b>IdP session</b> (RP-initiated logout) and notify the <b>other apps</b> (back-channel logout).'),
  glance:{rows:[
    [tx('IdP-Session','IdP session'),tx('Cookie beim Identity Provider. Grundlage für SSO.','Cookie at the identity provider. Basis for SSO.')],
    [tx('Lokaler Logout','Local logout'),tx('Nur die App vergisst den Benutzer. Beim nächsten Login-Klick ist er per SSO sofort wieder drin.','Only the app forgets the user. On the next login click, SSO signs them right back in.')],
    ['RP-initiated Logout',tx('Die App schickt den Browser zu <code>end_session_endpoint</code> mit <code>id_token_hint</code>.','The app sends the browser to <code>end_session_endpoint</code> with <code>id_token_hint</code>.')],
    ['Back-Channel Logout',tx('Der IdP ruft serverseitig jede beteiligte App mit einem Logout Token auf.','The IdP calls every involved app server-side with a logout token.')],
    ['Front-Channel Logout',tx('Dasselbe über unsichtbare iFrames im Browser – unzuverlässig, weil Browser Third-Party-Cookies blocken.','The same via invisible iframes in the browser – unreliable because browsers block third-party cookies.')]
  ]},
  demoHint:tx('Drei Apps der Nordwind GmbH an einem Keycloak.','Three Nordwind apps on one Keycloak.'),
  demo:`<div class="row"><button type="button" class="btn btn-primary" data-sso="login-a">${tx('In Rechnungen anmelden','Sign in to Invoices')}</button><button type="button" class="btn btn-secondary" data-sso="open-b">${tx('Berichte öffnen','Open Reports')}</button><button type="button" class="btn btn-secondary" data-sso="local-a">${tx('Rechnungen: nur lokal abmelden','Invoices: local logout only')}</button><button type="button" class="btn btn-danger" data-sso="rp-a">${tx('Rechnungen: Logout beim IdP','Invoices: logout at the IdP')}</button><button type="button" class="btn btn-ghost" data-sso="reset">${ic('refresh')}${tx('Neu','Reset')}</button></div>
<label class="check-row"><input type="checkbox" id="sso-bc" checked>${tx('Back-Channel Logout ist eingerichtet','Back-channel logout is configured')}</label>
<div id="sso-state"></div><ul class="log" id="sso-log"></ul>`,
  init(root){
    let s;const log=$('#sso-log',root);
    const add=(c,t)=>{log.insertAdjacentHTML('beforeend',`<li class="l-${c}">${t}</li>`);log.scrollTop=log.scrollHeight};
    const draw=()=>{const on=v=>v?`<span class="yes">${tx('aktiv','active')}</span>`:`<span class="no">—</span>`;$('#sso-state',root).innerHTML=table(['Session','Status'],[[tx('Keycloak (IdP)','Keycloak (IdP)'),on(s.idp)],[tx('App Rechnungen','Invoices app'),on(s.a)],[tx('App Berichte','Reports app'),on(s.b)]],{caption:'Sessions'})};
    root.addEventListener('click',e=>{const b=e.target.closest('[data-sso]');if(!b)return;const a=b.dataset.sso;
      if(a==='reset'){s={idp:false,a:false,b:false};log.innerHTML=''}
      if(a==='login-a'){if(s.idp){s.a=true;add('ok',tx('Rechnungen → Keycloak: IdP-Session vorhanden → sofort Code, kein Passwort (SSO).','Invoices → Keycloak: IdP session exists → code right away, no password (SSO).'))}else{s.idp=s.a=true;add('ok',tx('Rechnungen → Keycloak: Tom gibt Passwort und Passkey ein. IdP-Session und App-Session entstehen.','Invoices → Keycloak: Tom enters password and passkey. IdP session and app session are created.'))}}
      if(a==='open-b'){if(s.b)add('info',tx('Berichte: schon angemeldet.','Reports: already signed in.'));else if(s.idp){s.b=true;add('ok',tx('Berichte → Keycloak: IdP-Session vorhanden → angemeldet ohne Eingabe.','Reports → Keycloak: IdP session exists → signed in without input.'))}else add('info',tx('Berichte → Keycloak: keine IdP-Session → Login-Seite.','Reports → Keycloak: no IdP session → login page.'))}
      if(a==='local-a'){s.a=false;add('info',tx('Rechnungen vergisst Tom. Aber: IdP-Session lebt – ein Klick auf „Anmelden“ und er ist ohne Passwort wieder drin. Am geteilten PC ein Problem!','Invoices forgets Tom. But: the IdP session lives – one click on “Sign in” and he’s back without a password. A problem on a shared PC!'))}
      if(a==='rp-a'){s.a=false;s.idp=false;add('ok',tx('Rechnungen → /logout?id_token_hint=… → Keycloak beendet die IdP-Session.','Invoices → /logout?id_token_hint=… → Keycloak ends the IdP session.'));
        if($('#sso-bc',root).checked){if(s.b){s.b=false;add('ok',tx('Keycloak → POST Berichte/backchannel-logout (Logout Token) → Berichte beendet Toms Session.','Keycloak → POST reports/backchannel-logout (logout token) → Reports ends Tom’s session.'))}}
        else if(s.b)add('no',tx('Berichte weiß von nichts – Tom ist dort weiter angemeldet, bis Session oder Token ablaufen.','Reports knows nothing – Tom stays signed in there until session or token expire.'))}
      draw()});
    s={idp:false,a:false,b:false};draw();
  },
  code:[{t:tx('Spring (BFF/Web-App): RP-initiated und Back-Channel Logout','Spring (BFF/web app): RP-initiated and back-channel logout'),lang:'java',src:`@Bean
SecurityFilterChain web(HttpSecurity http, ClientRegistrationRepository clients) throws Exception {
  var oidcLogout = new OidcClientInitiatedLogoutSuccessHandler(clients);
  oidcLogout.setPostLogoutRedirectUri("{baseUrl}/");
  return http
      .oauth2Login(Customizer.withDefaults())
      .logout(l -> l.logoutSuccessHandler(oidcLogout))        // also ends the IdP session
      .oidcLogout(l -> l.backChannel(Customizer.withDefaults())) // receives logout tokens
      .build();
}`}],
  do:tx(['Beim Abmelden die IdP-Session beenden, nicht nur die lokale.','Back-Channel Logout für alle Apps mit eigener Session einrichten.','Nach dem Logout Tokens aus dem Speicher löschen und Refresh Tokens widerrufen.'],['End the IdP session on logout, not just the local one.','Set up back-channel logout for every app with its own session.','After logout, clear tokens from memory and revoke refresh tokens.']),
  dont:tx(['„Abmelden“ als bloßes Löschen des Tokens im Browser.','Sich auf Front-Channel-Logout per iFrame verlassen.','Access Tokens nach Logout weiterleben lassen, wenn sie lange gelten.'],['“Sign out” as merely deleting the token in the browser.','Rely on front-channel logout via iframe.','Let access tokens live on after logout if they are long-lived.']),
  why:tx('<p>Benutzer erwarten, dass „Abmelden“ sie abmeldet – nicht nur aus einem Tab. Am geteilten Rechner im Büro ist ein halber Logout eine offene Tür: Der Nächste klickt auf „Anmelden“ und ist ohne Passwort als Tom drin.</p>','<p>Users expect “sign out” to sign them out – not just from one tab. On a shared office computer, half a logout is an open door: the next person clicks “Sign in” and is in as Tom without a password.</p>')
});

LESSONS.push({
  id:'idp-keycloak',cat:'protocols',
  title:tx('Identity Provider: Keycloak & Co.','Identity providers: Keycloak & co.'),
  short:tx('Realms, Clients, Rollen, Gruppen und Mapper – wie Rollen ins Token kommen.','Realms, clients, roles, groups and mappers – how roles get into the token.'),
  keys:'keycloak identity provider idp realm client realm role client role composite group mapper entra id auth0 okta spring authorization server token claims realm_access resource_access',
  refs:[['Keycloak: Server Administration Guide','https://www.keycloak.org/docs/latest/server_admin/'],['Spring Authorization Server','https://docs.spring.io/spring-security/reference/servlet/oauth2/authorization-server/index.html']],
  rule:tx('Der Identity Provider verwaltet Benutzer, Login und Rollen und stellt Tokens aus. In Keycloak gehören Benutzer, Clients und Rollen zu einem <b>Realm</b>. Rollen gibt es auf Realm-Ebene und pro Client; Benutzer bekommen sie direkt oder über <b>Gruppen</b>. <b>Mapper</b> bestimmen, welche Claims im Token landen – und wo. Deine API muss genau dort lesen.','The identity provider manages users, login and roles and issues tokens. In Keycloak, users, clients and roles belong to a <b>realm</b>. Roles exist at realm level and per client; users get them directly or via <b>groups</b>. <b>Mappers</b> decide which claims land in the token – and where. Your API must read exactly there.'),
  glance:{rows:[
    ['Realm',tx('Abgeschotteter Bereich mit eigenen Benutzern, Clients, Schlüsseln. Oft einer pro Firma oder Mandant.','Isolated space with its own users, clients, keys. Often one per company or tenant.')],
    ['Client',tx('Eine App, die Tokens anfordert (<code>invoice-spa</code>, <code>invoice-bff</code>).','An app that requests tokens (<code>invoice-spa</code>, <code>invoice-bff</code>).')],
    [tx('Realm-Rolle','Realm role'),tx('Gilt im ganzen Realm. Token: <code>realm_access.roles</code>.','Applies to the whole realm. Token: <code>realm_access.roles</code>.')],
    [tx('Client-Rolle','Client role'),tx('Gilt für eine App. Token: <code>resource_access.&lt;client&gt;.roles</code>.','Applies to one app. Token: <code>resource_access.&lt;client&gt;.roles</code>.')],
    [tx('Composite-Rolle','Composite role'),tx('Rolle, die andere Rollen enthält – eine einfache Hierarchie.','A role that contains other roles – a simple hierarchy.')],
    [tx('Gruppe','Group'),tx('Benutzer sammeln, Rollen an die Gruppe hängen. Gruppen können Untergruppen haben.','Collect users, attach roles to the group. Groups can have subgroups.')],
    ['Mapper',tx('Regel, die einen Claim ins Token schreibt – etwa ein Benutzerattribut <code>team</code>.','Rule that writes a claim into the token – e.g. a user attribute <code>team</code>.')],
    [tx('Alternativen','Alternatives'),tx('Microsoft Entra ID, Auth0, Okta, AWS Cognito, Spring Authorization Server (seit Spring Security 7 Teil davon).','Microsoft Entra ID, Auth0, Okta, AWS Cognito, Spring Authorization Server (part of Spring Security since 7).')]
  ]},
  demoHint:tx('Gruppen in Keycloak ändern – und sehen, was im Token landet.','Change groups in Keycloak – and see what lands in the token.'),
  demo:`<div class="two"><fieldset class="panel"><legend style="font-weight:700">${tx('Toms Gruppen in Keycloak','Tom’s groups in Keycloak')}</legend>
  ${[['g-sales','/vertrieb','—'],['g-lead','/vertrieb/teamleitung','TEAM_LEAD'],['g-fin','/buchhaltung','ACCOUNTANT'],['g-it','/it-admins','ADMIN']].map(([id,g,r],i)=>`<label class="check-row"><input type="checkbox" id="${id}" ${i<2?'checked':''}><span><code>${g}</code> → ${r}</span></label>`).join('')}
  <label class="check-row"><input type="checkbox" id="g-client" checked><span>${tx('Client-Rolle <code>invoice-api: approver</code>','Client role <code>invoice-api: approver</code>')}</span></label>
</fieldset><div><h3>${tx('Access Token (Ausschnitt)','Access token (excerpt)')}</h3><pre class="out" id="kc-tok"></pre></div></div>`,
  init(root){
    const run=()=>{const roles=[];if($('#g-lead',root).checked)roles.push('TEAM_LEAD');if($('#g-fin',root).checked)roles.push('ACCOUNTANT');if($('#g-it',root).checked)roles.push('ADMIN');roles.push('default-roles-nordwind');
      const t={sub:'f3a9…-tom',preferred_username:'tom',team:$('#g-sales',root).checked||$('#g-lead',root).checked?'sales':undefined,realm_access:{roles},resource_access:$('#g-client',root).checked?{'invoice-api':{roles:['approver']}}:{},scope:'openid profile'};
      $('#kc-tok',root).textContent=JSON.stringify(t,null,2)};
    root.addEventListener('change',run);run();
  },
  after:tx('<p>Achte auf <code>default-roles-nordwind</code>: Keycloak gibt jedem Benutzer eine Standard-Rolle. Und Rollen stehen verschachtelt – Spring liest sie nicht von selbst, du brauchst einen eigenen Converter (Kapitel Spring).</p>','<p>Note <code>default-roles-nordwind</code>: Keycloak gives every user a default role. And roles are nested – Spring doesn’t read them on its own, you need a custom converter (Spring chapter).</p>'),
  code:[{t:tx('Realm-Export (Ausschnitt)','Realm export (excerpt)'),lang:'json',src:`{
  "realm": "nordwind",
  "roles": { "realm": [ { "name": "VIEWER" }, { "name": "TEAM_LEAD", "composite": true,
      "composites": { "realm": ["VIEWER"] } }, { "name": "ACCOUNTANT" }, { "name": "ADMIN" } ] },
  "groups": [ { "name": "vertrieb", "subGroups": [
      { "name": "teamleitung", "realmRoles": ["TEAM_LEAD"] } ] } ],
  "clients": [ { "clientId": "invoice-spa", "publicClient": true,
      "standardFlowEnabled": true, "attributes": { "pkce.code.challenge.method": "S256" },
      "redirectUris": ["https://app.nordwind.example/callback"] } ]
}`}],
  do:tx(['Rollen über Gruppen vergeben, nicht Benutzer für Benutzer.','Client-Rollen für app-spezifische Rechte, Realm-Rollen für Querschnitt.','Realm-Konfiguration als Code versionieren (Export, Terraform, keycloak-config-cli).'],['Assign roles via groups, not user by user.','Client roles for app-specific rights, realm roles for cross-cutting ones.','Version the realm configuration as code (export, Terraform, keycloak-config-cli).']),
  dont:tx(['Feingranulare Objektrechte („darf Rechnung R-1003“) als Rollen im IdP pflegen.','Riesige Tokens mit hunderten Rollen und Gruppen ausliefern.','Admin-Konsole des IdP ohne MFA.'],['Maintain fine-grained object rights (“may invoice R-1003”) as roles in the IdP.','Ship huge tokens with hundreds of roles and groups.','Run the IdP admin console without MFA.']),
  why:tx('<p>Der Identity Provider ist die eine Stelle, an der klar ist, wer jemand ist und welche groben Rollen er hat. Deine Apps sollen sich darauf verlassen können, ohne selbst Benutzer zu verwalten. Aber: Er kennt deine Geschäftsobjekte nicht. Wer darf <i>welche</i> Rechnung freigeben, entscheidet deine API – mit Rollen aus dem Token als Zutat.</p>','<p>The identity provider is the one place where it’s clear who someone is and which coarse roles they have. Your apps should be able to rely on that without managing users themselves. But: it doesn’t know your business objects. Who may approve <i>which</i> invoice is decided by your API – with roles from the token as one ingredient.</p>')
});

LESSONS.push({
  id:'principles',cat:'thinking',
  title:tx('Least Privilege und Deny by Default','Least privilege and deny by default'),
  short:tx('So wenig Rechte wie möglich, alles verboten, was nicht erlaubt ist – und im Zweifel zu.','As few rights as possible, everything forbidden that isn’t allowed – and closed when in doubt.'),
  keys:'least privilege deny by default fail closed fail secure allow list deny list need to know prinzipien principles defense in depth',
  refs:[['OWASP Authorization Cheat Sheet','https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html'],['OWASP Top 10: A01 Broken Access Control','https://owasp.org/Top10/A01_2021-Broken_Access_Control/']],
  rule:tx('Drei Prinzipien tragen jedes Berechtigungskonzept: <b>Least Privilege</b> – jeder bekommt nur die Rechte, die er für seine Aufgabe braucht. <b>Deny by Default</b> – was keine Regel ausdrücklich erlaubt, ist verboten, auch neue Endpunkte. <b>Fail Closed</b> – wenn die Prüfung selbst scheitert (Fehler, Timeout), wird verweigert, nicht durchgelassen.','Three principles carry every permission concept: <b>least privilege</b> – everyone gets only the rights they need for their task. <b>Deny by default</b> – whatever no rule explicitly allows is forbidden, new endpoints included. <b>Fail closed</b> – if the check itself fails (error, timeout), access is denied, not granted.'),
  glance:{rows:[
    ['Least Privilege',tx('Minimale Rechte, auch für Admins und Dienste. Admin heißt „verwaltet Benutzer“, nicht „darf alles“.','Minimal rights, for admins and services too. Admin means “manages users”, not “may do everything”.')],
    ['Deny by Default',tx('Allow-List statt Deny-List. Am Ende jeder Regelkette steht „alles andere verboten“.','Allow list instead of deny list. Every rule chain ends with “everything else forbidden”.')],
    ['Fail Closed',tx('Exception, Timeout, unbekannter Fall → verweigern.','Exception, timeout, unknown case → deny.')],
    ['Defense in Depth',tx('Mehrere Ebenen prüfen: Gateway, URL-Regeln, Methode, Datenbank-Abfrage.','Several layers check: gateway, URL rules, method, database query.')],
    ['Need to Know',tx('Daten nur zeigen, wenn sie für die Aufgabe nötig sind – auch innerhalb erlaubter Objekte.','Only show data when it’s needed for the task – even within permitted objects.')]
  ]},
  body:tx(`<p>Bei Nordwind ist das sichtbar: Ada ist Admin, darf Benutzer verwalten und das Audit-Log lesen – aber keine Rechnungen freigeben oder bezahlen. Wer Admins pauschal alles erlaubt, macht ihr Konto zum lohnendsten Ziel im ganzen Unternehmen.</p>`,
`<p>At Nordwind you can see it: Ada is admin, may manage users and read the audit log – but may not approve or pay invoices. Whoever grants admins everything across the board makes their account the most rewarding target in the whole company.</p>`),
  demoHint:tx('Ein Entwickler fügt einen neuen Endpunkt hinzu. Und dann fällt der Policy-Dienst aus.','A developer adds a new endpoint. And then the policy service goes down.'),
  demo:`<fieldset class="seg"><legend>${tx('Konfiguration','Configuration')}</legend><div class="seg-opts"><label><input type="radio" name="pr-cfg" value="deny" checked>${tx('Deny-List: nur Bekanntes sperren','Deny list: block only known things')}</label><label><input type="radio" name="pr-cfg" value="allow">${tx('Allow-List + denyAll()','Allow list + denyAll()')}</label></div></fieldset>
<label class="check-row"><input type="checkbox" id="pr-new">${tx('Neuer Endpunkt <code>DELETE /api/invoices/bulk</code> wurde gerade gebaut','New endpoint <code>DELETE /api/invoices/bulk</code> was just built')}</label>
<label class="check-row"><input type="checkbox" id="pr-down">${tx('Policy-Dienst antwortet nicht (Timeout)','Policy service doesn’t answer (timeout)')}</label>
<fieldset class="seg"><legend>${tx('Bei Fehler im Policy-Dienst','On policy service error')}</legend><div class="seg-opts"><label><input type="radio" name="pr-fail" value="open">${tx('durchlassen (fail open)','let through (fail open)')}</label><label><input type="radio" name="pr-fail" value="closed" checked>${tx('verweigern (fail closed)','deny (fail closed)')}</label></div></fieldset>
<div id="pr-out"></div>`,
  init(root){
    const out=$('#pr-out',root);
    const run=()=>{const cfg=$('input[name="pr-cfg"]:checked',root).value,nw=$('#pr-new',root).checked,down=$('#pr-down',root).checked,fail=$('input[name="pr-fail"]:checked',root).value,p=persona();
      const reqs=[['GET /api/invoices','invoice:read'],['POST /api/invoices/R-1002/approve','invoice:approve'],['GET /api/admin/users','user:manage']];if(nw)reqs.push(['DELETE /api/invoices/bulk',null]);
      const rows=reqs.map(([r,perm])=>{let res,why;
        if(down&&perm){res=fail==='open';why=fail==='open'?tx('Policy-Dienst weg → alles erlaubt!','Policy service gone → everything allowed!'):tx('Policy-Dienst weg → verweigert (503/403).','Policy service gone → denied (503/403).')}
        else if(!perm){res=cfg==='deny';why=cfg==='deny'?tx('Keine Regel sperrt ihn → offen für jeden Angemeldeten.','No rule blocks it → open to anyone signed in.'):tx('Keine Regel erlaubt ihn → <code>denyAll()</code> greift.','No rule allows it → <code>denyAll()</code> applies.')}
        else{res=can(perm,p);why=res?tx(`${p.name} hat ${perm}`,`${p.name} has ${perm}`):tx(`fehlt: ${perm}`,`missing: ${perm}`)}
        const danger=(!perm&&res)||(down&&fail==='open'&&res&&!can(perm,p));
        return[`<code>${r}</code>`,res?`<span class="${danger?'no':'yes'}">${danger?tx('erlaubt ⚠','allowed ⚠'):tx('erlaubt','allowed')}</span>`:`<span class="${!perm||down?'yes':'meh'}">${tx('verweigert','denied')}</span>`,why]});
      out.innerHTML=table([tx('Anfrage','Request'),tx('Ergebnis','Result'),tx('Grund','Reason')],rows,{caption:tx('Ergebnis je Anfrage','Result per request')})};
    root.addEventListener('change',run);return onPersona(run);
  },
  lang:'java',
  bad:{code:`http.authorizeHttpRequests(a -> a
    .requestMatchers("/api/admin/**").hasRole("ADMIN")
    .anyRequest().authenticated());   // everything else: any signed-in user`,note:tx('Jeder neue Endpunkt ist automatisch für alle Angemeldeten offen – bis jemand daran denkt, eine Regel zu ergänzen.','Every new endpoint is automatically open to all signed-in users – until someone remembers to add a rule.')},
  good:{code:`http.authorizeHttpRequests(a -> a
    .requestMatchers(HttpMethod.GET, "/api/invoices/**").hasAuthority("invoice:read")
    .requestMatchers(HttpMethod.POST, "/api/invoices/*/approve").hasAuthority("invoice:approve")
    .requestMatchers("/api/admin/users/**").hasAuthority("user:manage")
    .requestMatchers("/actuator/health").permitAll()
    .anyRequest().denyAll());          // unknown = forbidden`,note:tx('Plus Methodensicherheit mit <code>@PreAuthorize</code> als zweite Ebene. Ein vergessener Endpunkt ist jetzt ein Fehler, den jemand sofort bemerkt – nicht eine stille Lücke.','Plus method security with <code>@PreAuthorize</code> as a second layer. A forgotten endpoint is now a bug someone notices immediately – not a silent hole.')},
  do:tx(['Regelketten mit <code>denyAll()</code> abschließen.','Admins und Service-Accounts genauso knapp berechtigen wie alle anderen.','Bei Fehlern in der Rechteprüfung verweigern und alarmieren.','Rechte regelmäßig überprüfen und Unbenutztes entziehen (Access Review).'],['End rule chains with <code>denyAll()</code>.','Give admins and service accounts permissions as narrow as everyone else’s.','On errors in the permission check, deny and alert.','Review permissions regularly and remove unused ones (access review).']),
  dont:tx(['<code>anyRequest().permitAll()</code> oder <code>authenticated()</code> als Auffangregel.','<code>catch (Exception e) { return true; }</code> in einer Rechteprüfung.','„Vorübergehend“ Admin-Rechte vergeben und vergessen.'],['<code>anyRequest().permitAll()</code> or <code>authenticated()</code> as the catch-all rule.','<code>catch (Exception e) { return true; }</code> in a permission check.','Grant admin rights “temporarily” and forget about them.']),
  why:tx('<p>Broken Access Control ist seit 2021 Platz 1 der OWASP Top 10. Fast immer ist die Ursache nicht eine falsche Regel, sondern eine fehlende: der vergessene Endpunkt, der Sonderfall ohne Prüfung, der Fehler, der still „ja“ sagt. Deny by Default und Fail Closed machen aus diesen Lücken sichtbare Fehler.</p>','<p>Broken access control has been number 1 of the OWASP Top 10 since 2021. Almost always the cause isn’t a wrong rule but a missing one: the forgotten endpoint, the special case without a check, the error that silently says “yes”. Deny by default and fail closed turn these holes into visible bugs.</p>')
});

LESSONS.push({
  id:'pep-pdp',cat:'thinking',
  title:tx('Wo wird entschieden? PEP, PDP, PIP, PAP','Where is it decided? PEP, PDP, PIP, PAP'),
  short:tx('Das Vokabular jeder Autorisierungs-Architektur – und warum Entscheiden und Durchsetzen getrennt gehören.','The vocabulary of every authorization architecture – and why deciding and enforcing belong apart.'),
  keys:'pep pdp pip pap xacml policy enforcement point policy decision point policy information point policy administration point architektur architecture authzen',
  refs:[['NIST SP 800-162: ABAC','https://csrc.nist.gov/pubs/sp/800/162/upd2/final'],['OpenID AuthZEN','https://openid.net/wg/authzen/']],
  rule:tx('Eine Autorisierung hat vier Bausteine: Der <b>PEP</b> (Policy Enforcement Point) fängt die Anfrage ab und setzt die Entscheidung durch. Der <b>PDP</b> (Policy Decision Point) entscheidet anhand der Regeln. Der <b>PIP</b> (Policy Information Point) liefert fehlende Fakten, etwa das Team einer Rechnung. Der <b>PAP</b> (Policy Administration Point) ist der Ort, an dem Regeln gepflegt werden.','An authorization has four building blocks: the <b>PEP</b> (policy enforcement point) intercepts the request and enforces the decision. The <b>PDP</b> (policy decision point) decides based on the rules. The <b>PIP</b> (policy information point) supplies missing facts, such as an invoice’s team. The <b>PAP</b> (policy administration point) is where rules are maintained.'),
  glance:{head:[tx('Baustein','Building block'),tx('Bei Nordwind','At Nordwind')],rows:[
    ['PEP',tx('Spring-<code>AuthorizationFilter</code>, <code>@PreAuthorize</code>, ein Angular-Guard (nur UX!).','Spring <code>AuthorizationFilter</code>, <code>@PreAuthorize</code>, an Angular guard (UX only!).')],
    ['PDP',tx('Eine <code>InvoicePolicy</code>-Klasse – oder ein externer Dienst wie OPA, Cedar, OpenFGA.','An <code>InvoicePolicy</code> class – or an external service like OPA, Cedar, OpenFGA.')],
    ['PIP',tx('Datenbank (Rechnung, Team, Betrag), Token-Claims, HR-System.','Database (invoice, team, amount), token claims, HR system.')],
    ['PAP',tx('Keycloak-Admin-Konsole für Rollen, ein Git-Repo mit Policies, eine Admin-Oberfläche.','Keycloak admin console for roles, a Git repo with policies, an admin UI.')],
    ['AuthZEN',tx('Junger OpenID-Standard für eine einheitliche PEP→PDP-Schnittstelle (subject, action, resource, context).','Young OpenID standard for a uniform PEP→PDP interface (subject, action, resource, context).')]
  ]},
  body:tx(`${chain([[tx('Anfrage','Request'),'POST /approve'],['PEP','Spring Filter / @PreAuthorize','brand'],['PDP','InvoicePolicy / OPA','warn'],['PIP',tx('DB, Token, HR','DB, token, HR')]],[tx('fragt','asks'),tx('braucht Fakten','needs facts')])}
<p>Der wichtigste Gedanke dahinter: Die <b>Entscheidung</b> liegt an <i>einer</i> Stelle, durchgesetzt wird an <i>vielen</i>. Wenn „darf freigeben“ in zwölf Controllern als eigene <code>if</code>-Kette steht, weichen die zwölf Varianten irgendwann voneinander ab. Steht sie in einer Policy, rufen alle PEPs dieselbe Logik auf – auch <code>/api/me</code>, das dem Frontend sagt, welche Knöpfe es zeigen soll.</p>`,
`${chain([['Request','POST /approve'],['PEP','Spring filter / @PreAuthorize','brand'],['PDP','InvoicePolicy / OPA','warn'],['PIP','DB, token, HR']],['asks','needs facts'])}
<p>The key idea behind it: the <b>decision</b> lives in <i>one</i> place, enforcement happens in <i>many</i>. If “may approve” sits in twelve controllers as its own <code>if</code> chain, the twelve variants will drift apart at some point. If it lives in one policy, every PEP calls the same logic – including <code>/api/me</code>, which tells the frontend which buttons to show.</p>`),
  demoHint:tx('Tom will R-1002 freigeben – wer tut was?','Tom wants to approve R-1002 – who does what?'),
  demo:'<div id="pp-host"></div>',
  init(root){
    const A=['Angular','PEP (Spring)','PDP (Policy)','PIP (DB)'];
    const S=[
      [0,1,'POST /api/invoices/R-1002/approve',tx('<p>Das Frontend hat den Knopf gezeigt, weil <code>/api/me</code> „darf freigeben“ meldete. Das ist Komfort – geprüft wird jetzt.</p>','<p>The frontend showed the button because <code>/api/me</code> reported “may approve”. That’s convenience – now comes the check.</p>')],
      [1,2,tx('Darf Tom approve auf Invoice R-1002?','May Tom approve Invoice R-1002?'),`<pre>{ "subject":  { "id": "tom", "roles": ["TEAM_LEAD"], "team": "sales", "limit": 5000 },
  "action":   { "name": "approve" },
  "resource": { "type": "Invoice", "id": "R-1002" },
  "context":  { "time": "2026-11-12T09:30:00Z" } }</pre><p>${tx('So sieht eine Anfrage im AuthZEN-Format aus.','This is what a request in AuthZEN format looks like.')}</p>`],
      [2,3,tx('Team, Betrag, Ersteller von R-1002?','Team, amount, creator of R-1002?'),tx('<p>Die Policy braucht Fakten über die Rechnung, die nicht in der Anfrage stehen.</p>','<p>The policy needs facts about the invoice that aren’t in the request.</p>')],
      [3,2,'sales, 4300 €, bea',''],
      [2,1,'permit',tx('<p>Team passt, 4300 € ≤ 5000 €, Ersteller ist nicht Tom, Status ist eingereicht → erlaubt.</p>','<p>Team matches, €4,300 ≤ €5,000, creator isn’t Tom, status is submitted → permitted.</p>')],
      [1,1,tx('Durchsetzen: Methode ausführen','Enforce: run the method'),tx('<p>Der PEP führt den Service-Aufruf aus. Hätte der PDP „deny“ gesagt, wäre hier mit 403 Schluss.</p>','<p>The PEP runs the service call. Had the PDP said “deny”, it would end here with 403.</p>')],
      [1,0,'200 OK','']
    ];
    const host=$('#pp-host',root);host.innerHTML=stepperHTML('pp-st',A,S);stepperInit($('#pp-st',host),S);
  },
  lang:'java',
  bad:{code:`// InvoiceController
if (user.hasRole("TEAM_LEAD") && inv.getTeam().equals(user.getTeam())) { … }
// InvoiceExportJob
if (user.hasRole("TEAM_LEAD") || user.hasRole("ADMIN")) { … }      // drifted
// MeController (for the frontend)
canApprove = user.hasRole("TEAM_LEAD");                            // drifted further`,note:tx('Drei Stellen, drei verschiedene Regeln. Das Frontend zeigt den Knopf, der Controller verweigert, der Export-Job erlaubt Admins zu viel.','Three places, three different rules. The frontend shows the button, the controller refuses, the export job lets admins do too much.')},
  good:{code:`@Component
public class InvoicePolicy {          // the PDP – one place
  public boolean canApprove(UserPrincipal u, Invoice inv) {
    return u.has("invoice:approve")
        && inv.getStatus() == SUBMITTED
        && inv.getTeam().equals(u.team())
        && inv.getAmount().compareTo(u.approvalLimit()) <= 0
        && !inv.getCreatedBy().equals(u.id());
  }
}
// PEPs: controller, export job and /api/me all call invoicePolicy.canApprove(…)`},
  do:tx(['Entscheidungslogik pro Ressource in einer Policy-Klasse oder einem PDP bündeln.','Dieselbe Policy für Durchsetzung und für die Anzeige im Frontend (<code>/api/me</code>) nutzen.','Den PDP klein und gut testbar halten – reine Funktion aus Subjekt, Aktion, Ressource, Kontext.'],['Bundle decision logic per resource in a policy class or PDP.','Use the same policy for enforcement and for display in the frontend (<code>/api/me</code>).','Keep the PDP small and testable – a pure function of subject, action, resource, context.']),
  dont:tx(['Rollenprüfungen über Controller, Services und Templates verstreuen.','Den PDP Daten selbst ändern lassen – er entscheidet nur.','Einen externen PDP einführen, bevor die Regeln in einer Klasse überhaupt sauber stehen.'],['Scatter role checks across controllers, services and templates.','Let the PDP change data itself – it only decides.','Introduce an external PDP before the rules even live cleanly in one class.']),
  why:tx('<p>Die Begriffe stammen aus XACML, einem Standard von 2003, der heute kaum noch jemand direkt benutzt. Die Aufteilung aber steckt in jedem modernen System: Spring trennt <code>AuthorizationFilter</code> (PEP) und <code>AuthorizationManager</code> (PDP), OPA und Cedar sind reine PDPs. Wer das Vokabular kennt, erkennt in jeder Architektur, wo eine Entscheidung fällt – und wo nur durchgesetzt wird.</p>','<p>The terms come from XACML, a 2003 standard hardly anyone uses directly today. But the split lives in every modern system: Spring separates <code>AuthorizationFilter</code> (PEP) and <code>AuthorizationManager</code> (PDP), OPA and Cedar are pure PDPs. Knowing the vocabulary lets you spot in any architecture where a decision is made – and where it’s only enforced.</p>')
});

LESSONS.push({
  id:'permission-design',cat:'thinking',
  title:tx('Permissions entwerfen: Rechte prüfen, nicht Rollen','Designing permissions: check rights, not roles'),
  short:tx('ressource:aktion als Vokabular – und warum if (role === "ADMIN") altert.','resource:action as vocabulary – and why if (role === "ADMIN") ages badly.'),
  keys:'permission design berechtigung naming resource action invoice:approve role check permission check granularität granularity katalog catalog',
  refs:[['OWASP: Authorization Cheat Sheet – Prefer feature/attribute checks','https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html']],
  rule:tx('Code fragt nach <b>Permissions</b> (<code>invoice:approve</code>), nicht nach <b>Rollen</b> (<code>TEAM_LEAD</code>). Rollen sind nur Bündel von Permissions und gehören in die Konfiguration. So kann eine neue Rolle entstehen oder eine bestehende sich ändern, ohne dass eine einzige Zeile Code angefasst wird.','Code asks for <b>permissions</b> (<code>invoice:approve</code>), not for <b>roles</b> (<code>TEAM_LEAD</code>). Roles are just bundles of permissions and belong in configuration. That way a new role can appear or an existing one can change without touching a single line of code.'),
  glance:{rows:[
    [tx('Permission','Permission'),tx('Eine Aktion auf einer Ressourcenart: <code>invoice:approve</code>. Klein, stabil, fachlich benannt.','An action on a resource type: <code>invoice:approve</code>. Small, stable, named in business terms.')],
    [tx('Rolle','Role'),tx('Ein Bündel von Permissions für eine Aufgabe: Teamleitung = read + approve + report:read.','A bundle of permissions for a job: team lead = read + approve + report:read.')],
    [tx('Namensschema','Naming scheme'),tx('<code>ressource:aktion</code>, optional <code>ressource:aktion:bereich</code>. Einheitlich in API, Frontend und IdP.','<code>resource:action</code>, optionally <code>resource:action:scope</code>. The same in API, frontend and IdP.')],
    [tx('Granularität','Granularity'),tx('So fein, wie fachlich unterschieden wird – nicht feiner. „Bearbeiten“ und „Freigeben“ ja, „Feld Kunde bearbeiten“ meist nein.','As fine as the business distinguishes – not finer. “Edit” and “approve” yes, “edit customer field” usually not.')],
    [tx('Permission-Katalog','Permission catalog'),tx('Liste aller Permissions mit Beschreibung – im Code als Enum oder Union-Typ.','List of all permissions with descriptions – in code as an enum or union type.')]
  ]},
  demoHint:tx('Die Firma führt die Rolle „Prüferin“ (AUDITOR) ein: liest Rechnungen, Berichte und das Audit-Log.','The company introduces an “auditor” role (AUDITOR): reads invoices, reports and the audit log.'),
  demo:`<label class="check-row"><input type="checkbox" id="pd-aud">${tx('Rolle AUDITOR einführen','Introduce the AUDITOR role')}</label><div id="pd-out"></div>`,
  init(root){
    const places=[
      [tx('Menü „Berichte“ (Angular)','“Reports” menu (Angular)'),"roles.includes('VIEWER') || roles.includes('TEAM_LEAD') || roles.includes('ACCOUNTANT')","can('report:read')"],
      [tx('Route /audit (Guard)','Route /audit (guard)'),"hasRole('ADMIN')","can('audit:read')"],
      [tx('GET /api/reports (Spring)','GET /api/reports (Spring)'),'hasAnyRole("VIEWER","TEAM_LEAD","ACCOUNTANT")','hasAuthority("report:read")'],
      [tx('GET /api/audit (Spring)','GET /api/audit (Spring)'),'hasRole("ADMIN")','hasAuthority("audit:read")'],
      [tx('Export-Knopf ausblenden','Hide export button'),"role !== 'ACCOUNTANT'","!can('invoice:export')"]
    ];
    const out=$('#pd-out',root);
    const run=()=>{const on=$('#pd-aud',root).checked;
      const roleMod=[1,1,1,1,0],n=roleMod.filter(Boolean).length;
      out.innerHTML=table([tx('Stelle','Place'),tx('Rollen-Prüfung','Role check'),tx('Permission-Prüfung','Permission check')],places.map(([w,r,p],i)=>[w,`<code>${esc(r)}</code>${on&&roleMod[i]?`<br><span class="no">${tx('muss geändert werden','must be changed')}</span>`:''}`,`<code>${esc(p)}</code>${on?`<br><span class="yes">${tx('bleibt','stays')}</span>`:''}`]),{caption:tx('Code-Stellen','Code places')})+
      (on?`<div style="margin-top:12px">${verdict(false,tx(`Rollen-Prüfung: ${n} Code-Stellen in Frontend und Backend anfassen, neu testen, neu deployen.`,`Role check: touch ${n} code places in frontend and backend, retest, redeploy.`),'','is-warn')}<div style="margin-top:8px">${verdict(true,tx('Permission-Prüfung: 0 Code-Änderungen.','Permission check: 0 code changes.'),tx('Nur die Zuordnung AUDITOR → invoice:read, report:read, audit:read im Identity Provider oder in der Rollen-Tabelle.','Only the mapping AUDITOR → invoice:read, report:read, audit:read in the identity provider or the role table.'))}</div></div>`:'')};
    $('#pd-aud',root).addEventListener('change',run);run();

  lang:'ts',
  bad:{code:`// scattered across templates and services
@if (user().role === 'ADMIN' || user().role === 'ACCOUNTANT') {
  <button type="button" (click)="export()">Export</button>
}`,note:tx('Wer exportieren darf, steht jetzt im Template. Kommt eine Rolle dazu, muss jemand alle Templates durchsuchen.','Who may export now lives in the template. If a role is added, someone has to search every template.')},
  good:{code:`// permissions.ts – the catalog, one union type for the whole app
export type Permission =
  | 'invoice:read' | 'invoice:create' | 'invoice:edit' | 'invoice:approve'
  | 'invoice:pay'  | 'invoice:export' | 'invoice:delete'
  | 'report:read'  | 'user:manage'    | 'audit:read';

// template
@if (auth.can('invoice:export')) {
  <button type="button" (click)="export()">Export</button>
}`,note:tx('Der Union-Typ fängt Tippfehler beim Kompilieren: <code>can(\'invoice:aprove\')</code> ist ein Fehler, kein stilles <code>false</code>.','The union type catches typos at compile time: <code>can(\'invoice:aprove\')</code> is an error, not a silent <code>false</code>.')},
  do:tx(['Ein gemeinsames Vokabular <code>ressource:aktion</code> für Backend, Frontend und IdP.','Permissions als Typ (Union, Enum) im Code führen.','Rollen nur in der Konfiguration auf Permissions abbilden.'],['One shared vocabulary <code>resource:action</code> for backend, frontend and IdP.','Keep permissions as a type (union, enum) in code.','Map roles to permissions only in configuration.']),
  dont:tx(['Rollennamen im Code abfragen.','Für jede Schaltfläche eine eigene Permission erfinden.','Permissions nach Oberflächen benennen (<code>show-export-button</code>) statt nach der Fachaktion.'],['Query role names in code.','Invent a separate permission for every button.','Name permissions after UI elements (<code>show-export-button</code>) instead of the business action.']),
  why:tx('<p>Rollen ändern sich mit der Organisation, Permissions mit dem Produkt. Eine Umstrukturierung („ab jetzt darf die Teamleitung auch exportieren“) sollte eine Konfigurationsänderung sein, kein Release. Und: Eine Permission-Prüfung liest sich wie die Fachregel – „darf exportieren?“ – statt wie eine Liste von Berufsbezeichnungen.</p>','<p>Roles change with the organization, permissions with the product. A restructuring (“from now on team leads may export too”) should be a configuration change, not a release. And: a permission check reads like the business rule – “may export?” – instead of a list of job titles.</p>')
});

LESSONS.push({
  id:'authz-layers',cat:'thinking',
  title:tx('Drei Ebenen: Funktion, Objekt, Feld','Three levels: function, object, field'),
  short:tx('Darf ich Rechnungen sehen? Welche? Und welche Felder davon?','May I see invoices? Which ones? And which of their fields?'),
  keys:'function level object level field level row level security bola idor bopla datenebene feldebene maskierung masking mass assignment',
  refs:[['OWASP API Security Top 10 (2023)','https://owasp.org/API-Security/editions/2023/en/0x11-t10/']],
  rule:tx('Autorisierung findet auf drei Ebenen statt: <b>Funktion</b> – darf die Person diese Art von Aktion überhaupt (<code>invoice:read</code>)? <b>Objekt</b> – darf sie es mit <i>diesem</i> Objekt (Rechnung des eigenen Teams)? <b>Feld</b> – darf sie <i>jedes Feld</i> sehen oder ändern (Bankverbindung, interne Notiz)? Wer nur die erste Ebene prüft, hat die häufigste API-Lücke gebaut.','Authorization happens on three levels: <b>function</b> – may the person perform this kind of action at all (<code>invoice:read</code>)? <b>Object</b> – may they do it with <i>this</i> object (an invoice of their own team)? <b>Field</b> – may they see or change <i>every field</i> (bank details, internal note)? Checking only the first level builds the most common API hole.'),
  glance:{head:[tx('Ebene','Level'),tx('Frage und typische Lücke','Question and typical hole')],rows:[
    [tx('Funktion','Function'),tx('„Darf ich freigeben?“ Lücke: BFLA (OWASP API5) – Admin-Endpunkt ohne Prüfung.','“May I approve?” Hole: BFLA (OWASP API5) – admin endpoint without a check.')],
    [tx('Objekt','Object'),tx('„Darf ich R-1003 freigeben?“ Lücke: BOLA/IDOR (OWASP API1) – fremde ID in der URL.','“May I approve R-1003?” Hole: BOLA/IDOR (OWASP API1) – foreign ID in the URL.')],
    [tx('Feld','Field'),tx('„Darf ich die IBAN sehen oder den Status setzen?“ Lücke: BOPLA (OWASP API3) – zu viel im JSON oder Mass Assignment.','“May I see the IBAN or set the status?” Hole: BOPLA (OWASP API3) – too much in the JSON or mass assignment.')],
    ['Row-Level Security',tx('Objektebene direkt in der Datenbank (PostgreSQL RLS, Hibernate-Filter).','Object level directly in the database (PostgreSQL RLS, Hibernate filters).')],
    ['Mass Assignment',tx('Der Client schickt Felder mit, die er nicht setzen darf (<code>"status":"paid"</code>), und das Backend übernimmt sie blind.','The client sends fields it may not set (<code>"status":"paid"</code>), and the backend applies them blindly.')]
  ]},
  demoHint:tx('Dieselbe Rechnungsliste, dieselbe Detailansicht – je nach Person verschieden.','The same invoice list, the same detail view – different per person.'),
  demo:`<div class="two"><div><h3>${tx('Objektebene: welche Rechnungen?','Object level: which invoices?')}</h3><div id="al-list"></div></div><div><h3>${tx('Feldebene: R-1002 im Detail','Field level: R-1002 in detail')}</h3><div id="al-detail"></div></div></div>`,

      if(!can('invoice:read',p)){$('#al-list',root).innerHTML=verdict(false,tx('Funktionsebene: kein invoice:read','Function level: no invoice:read'),tx('Der ganze Bereich bleibt zu.','The whole area stays closed.'));$('#al-detail',root).innerHTML='';return}
      $('#al-list',root).innerHTML=`<ul class="trace">${INVOICES.map(i=>{const ok=visible(p,i);return`<li class="t-${ok?'ok':'no'}">${ic(ok?'ok':'xc')}<span><b class="mono">${i.id}</b> · ${TEAMS[i.team]}${ok?'':` · ${tx('anderes Team – gefiltert','other team – filtered')}`}</span></li>`}).join('')}</ul>`;

      $('#al-detail',root).innerHTML=visible(p,INVOICES[1])?`<dl class="al-dl">${F.map(([k,v,ok,mask])=>`<dt>${k}</dt><dd>${ok?esc(v):mask?`<span class="mono">${mask}</span> <span class="hint">${tx('maskiert','masked')}</span>`:`<span class="hint">${tx('nicht im JSON','not in the JSON')}</span>`}</dd>`).join('')}</dl>`:verdict(false,'404',tx('Nicht im eigenen Team.','Not in your team.'))};

  css:`.al-dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}.al-dl dt{font-weight:700;color:var(--muted)}.al-dl dd{margin:0}`,
  lang:'java',
  bad:{code:`@GetMapping("/api/invoices/{id}")
@PreAuthorize("hasAuthority('invoice:read')")    // function level only
Invoice get(@PathVariable String id) {
  return repo.findById(id).orElseThrow();        // every invoice, every field
}`,note:tx('Vera darf Rechnungen lesen – also auch die der Buchhaltung, samt IBAN. Die Entity geht 1:1 als JSON raus.','Vera may read invoices – so also accounting’s, including the IBAN. The entity goes out 1:1 as JSON.')},
  good:{code:`@GetMapping("/api/invoices/{id}")
@PreAuthorize("hasAuthority('invoice:read')")                   // function
InvoiceDto get(@PathVariable String id, @AuthenticationPrincipal UserPrincipal me) {
  Invoice inv = repo.findVisible(id, me.team(), me.seesAllTeams()) // object
      .orElseThrow(NotFoundException::new);
  return InvoiceDto.from(inv, me);                                // field: DTO decides
}

record InvoiceDto(String id, String customer, BigDecimal amount, String iban) {
  static InvoiceDto from(Invoice i, UserPrincipal me) {
    return new InvoiceDto(i.getId(), i.getCustomer(), i.getAmount(),
        me.has("invoice:pay") ? i.getIban() : mask(i.getIban()));
  }
}`,note:tx('Drei Ebenen, drei Stellen: Annotation, Abfrage, DTO. Für Schreibzugriffe gilt dasselbe umgekehrt: eigene Request-DTOs pro Aktion statt der Entity – dann gibt es kein Feld <code>status</code>, das jemand mitschicken könnte.','Three levels, three places: annotation, query, DTO. For writes the same applies in reverse: dedicated request DTOs per action instead of the entity – then there’s no <code>status</code> field anyone could send along.')},
  do:tx(['Jeden Endpunkt auf allen drei Ebenen durchdenken.','Objektrechte in die Datenbankabfrage einbauen, nicht hinterher filtern.','Antworten über DTOs formen; für Schreiben eigene Request-DTOs.'],['Think every endpoint through on all three levels.','Build object rights into the database query instead of filtering afterwards.','Shape responses through DTOs; dedicated request DTOs for writes.']),
  dont:tx(['Entities direkt als JSON zurückgeben oder entgegennehmen.','Felder nur im Frontend ausblenden – im JSON stehen sie trotzdem.','Objektprüfung im Frontend machen und der API vertrauen, dass niemand die ID ändert.'],['Return or accept entities directly as JSON.','Hide fields only in the frontend – they’re still in the JSON.','Do the object check in the frontend and trust the API that nobody changes the ID.']),
  why:tx('<p>Drei der zehn OWASP-API-Risiken sind genau diese drei Ebenen. Sie sind so häufig, weil Frameworks die erste Ebene bequem machen (eine Annotation) und die anderen beiden Fachwissen brauchen: Welche Rechnungen gehören zu Toms Team, welche Felder sind sensibel? Das kann kein Framework für dich wissen.</p>','<p>Three of the ten OWASP API risks are exactly these three levels. They are so common because frameworks make the first level easy (one annotation) while the other two need domain knowledge: which invoices belong to Tom’s team, which fields are sensitive? No framework can know that for you.</p>')
});

LESSONS.push({
  id:'models-overview',cat:'models',
  title:tx('Die Zugriffsmodelle im Überblick','Access models at a glance'),
  short:tx('RBAC, ABAC, PBAC, ReBAC: was sie anschauen, was sie können, was sie kosten.','RBAC, ABAC, PBAC, ReBAC: what they look at, what they can do, what they cost.'),
  keys:'rbac abac pbac rebac acl dac mac vergleich comparison zugriffsmodell access control model überblick overview',
  refs:[['NIST: RBAC','https://csrc.nist.gov/projects/role-based-access-control'],['NIST SP 800-162: ABAC','https://csrc.nist.gov/pubs/sp/800/162/upd2/final'],['Google Zanzibar (2019)','https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/']],
  rule:tx('Alle Modelle beantworten dieselbe Frage – <i>darf Subjekt S Aktion A auf Ressource R?</i> – sie unterscheiden sich darin, <b>woraus</b> sie die Antwort ableiten: <b>RBAC</b> aus Rollen, <b>ABAC</b> aus Attributen von Subjekt, Ressource und Umgebung, <b>PBAC</b> aus zentral verwalteten Policies (meist über Attribute), <b>ReBAC</b> aus Beziehungen in einem Graphen. In der Praxis kombiniert man sie.','All models answer the same question – <i>may subject S perform action A on resource R?</i> – they differ in <b>what</b> they derive the answer from: <b>RBAC</b> from roles, <b>ABAC</b> from attributes of subject, resource and environment, <b>PBAC</b> from centrally managed policies (usually over attributes), <b>ReBAC</b> from relationships in a graph. In practice you combine them.'),
  glance:{head:[tx('Modell','Model'),tx('Grundidee','Core idea')],rows:[
    ['RBAC',tx('Role-Based: Benutzer → Rolle → Permission.','Role-based: user → role → permission.')],
    ['ABAC',tx('Attribute-Based: Regel über Attribute, etwa „team = team der Rechnung und betrag ≤ limit“.','Attribute-based: rule over attributes, e.g. “team = invoice team and amount ≤ limit”.')],
    ['PBAC',tx('Policy-Based: Regeln als eigene Artefakte (Policy as Code), zentral entschieden, versioniert, auditierbar.','Policy-based: rules as separate artifacts (policy as code), decided centrally, versioned, auditable.')],
    ['ReBAC',tx('Relationship-Based: Rechte folgen Beziehungen – „Mitglied des Teams, dem die Rechnung gehört“.','Relationship-based: rights follow relationships – “member of the team that owns the invoice”.')],
    ['ACL',tx('Access Control List: Liste am Objekt, wer was darf. Vorläufer, steckt in Dateisystemen und S3.','Access control list: list on the object of who may do what. Predecessor, lives in file systems and S3.')],
    ['DAC / MAC',tx('Discretionary (Besitzer vergibt Rechte) bzw. Mandatory (System erzwingt Stufen wie „geheim“). Historisch, hier nur zur Einordnung.','Discretionary (owner grants rights) and mandatory (system enforces levels like “secret”). Historical, here only for context.')]
  ]},
  body:tx(`<h3>Vergleichstabelle</h3>
${table(['','RBAC','ABAC','PBAC','ReBAC'],[

  [tx('Granularität','Granularity'),tx('grob: Aktion','coarse: action'),tx('fein: Aktion + Objekt + Kontext','fine: action + object + context'),tx('fein','fine'),tx('fein: pro Objekt','fine: per object')],
  [tx('Typische Frage','Typical question'),tx('„Ist Tom Teamleitung?“','“Is Tom a team lead?”'),tx('„Betrag ≤ Limit, eigenes Team, Werktag?“','“Amount ≤ limit, own team, weekday?”'),tx('„Was sagt Policy approve.cedar?“','“What does policy approve.cedar say?”'),tx('„Führt ein Pfad von Tom zu R-1002?“','“Is there a path from Tom to R-1002?”')],
  [tx('Stärken','Strengths'),tx('einfach, verständlich, auditierbar','simple, understandable, auditable'),tx('kontextabhängig, keine Rollen-Explosion','context-aware, no role explosion'),tx('zentral, versioniert, testbar, sprachunabhängig','central, versioned, testable, language-independent'),tx('Teilen, Hierarchien, Ordner, Organisationen','sharing, hierarchies, folders, organizations')],
  [tx('Schwächen','Weaknesses'),tx('Rollen-Explosion, keine Objektregeln','role explosion, no object rules'),tx('schwerer zu überblicken („wer darf R-1002?“)','harder to oversee (“who may R-1002?”)'),tx('zusätzlicher Dienst, neue Sprache','extra service, new language'),tx('Beziehungsdaten synchron halten','keeping relationship data in sync')],
  [tx('Bei Nordwind','At Nordwind'),tx('Rollen im Keycloak','roles in Keycloak'),tx('Freigabelimit, Team, 4-Augen','approval limit, team, four eyes'),tx('OPA oder Cedar für alle Dienste','OPA or Cedar for every service'),tx('geteilte Rechnungen, Ordner pro Kunde','shared invoices, folders per customer')],
  [tx('Werkzeuge','Tools'),'Keycloak, Spring <code>hasRole</code>','Spring <code>@PreAuthorize</code>, CASL','OPA/Rego, AWS Cedar, Cerbos','OpenFGA, SpiceDB, Permify']
],{cls:'compare-table',caption:tx('Zugriffsmodelle im Vergleich','Access models compared')})}
