      }
      out.innerHTML=`${table([tx('Verfahren','Method'),'Vera','Tom',tx('Bewertung','Verdict')],[
        [tx('Klartext','Plain text'),`<code>${esc(pw)}</code>`,`<code>${esc(pw)}</code>`,`<span class="no">${tx('Ein Datenbank-Leak verrät alles.','A database leak reveals everything.')}</span>`],
        ['SHA-256',`<code>${sha.slice(0,24)}…</code>`,`<code>${sha.slice(0,24)}…</code>`,`<span class="no">${tx('Gleiche Hashes – wer eines knackt, hat beide. Und es geht rasend schnell.','Equal hashes – crack one, get both. And it’s blazing fast.')}</span>`],
        [tx('PBKDF2-SHA256, 600 000 Runden, mit Salt','PBKDF2-SHA256, 600,000 rounds, salted'),`<code>${rows[0][2].slice(0,24)}…</code><br><small class="hint">salt ${rows[0][1].slice(0,12)}… · ${rows[0][3]} ms</small>`,`<code>${rows[1][2].slice(0,24)}…</code><br><small class="hint">salt ${rows[1][1].slice(0,12)}… · ${rows[1][3]} ms</small>`,`<span class="yes">${tx('Verschiedene Hashes, jeder Versuch kostet spürbar Zeit.','Different hashes, every attempt costs noticeable time.')}</span>`]
      ],{caption:tx('Vergleich der Speicherarten','Comparison of storage methods')})}<p class="demo-note">${tx('600 000 Runden für PBKDF2-SHA256 ist die aktuelle OWASP-Empfehlung. Klick noch einmal auf „Hashen“: Das Salt ist neu, also auch der Hash – das Passwort bleibt dasselbe.','600,000 rounds for PBKDF2-SHA256 is the current OWASP recommendation. Click “Hash” again: the salt is new, so is the hash – the password stays the same.')}</p>`;
    }
    $('#pw-go',root).addEventListener('click',run);
    $('#pw-in',root).addEventListener('keydown',e=>{if(e.key==='Enter')run()});
    run();
  },
  lang:'java',
  bad:{code:`String hash = DigestUtils.sha256Hex(password);
user.setPasswordHash(hash);`,note:tx('Schnell und ungesalzen: gleiche Passwörter, gleiche Hashes, Milliarden Versuche pro Sekunde.','Fast and unsalted: equal passwords, equal hashes, billions of attempts per second.')},
  good:{code:`@Bean
PasswordEncoder passwordEncoder() {
  // {argon2}, {bcrypt}, … prefix → algorithm can change later
  return PasswordEncoderFactories.createDelegatingPasswordEncoder();
}

user.setPasswordHash(passwordEncoder.encode(password));
// login: passwordEncoder.matches(raw, user.getPasswordHash())`,note:tx('Der <code>DelegatingPasswordEncoder</code> schreibt das Verfahren als Präfix in den Hash, etwa <code>{bcrypt}$2a$10$…</code>. So kannst du später auf Argon2 wechseln, ohne alte Hashes ungültig zu machen.','The <code>DelegatingPasswordEncoder</code> writes the algorithm as a prefix into the hash, such as <code>{bcrypt}$2a$10$…</code>. That lets you switch to Argon2 later without invalidating old hashes.')},
  do:tx(['Argon2id, scrypt, bcrypt oder PBKDF2 mit aktuellem Work Factor nehmen.','Lange Passphrasen erlauben und gegen geleakte Passwörter prüfen.','Login-Versuche begrenzen und MFA anbieten.','Wo möglich den Login einem Identity Provider überlassen.'],['Use Argon2id, scrypt, bcrypt or PBKDF2 with a current work factor.','Allow long passphrases and check against leaked passwords.','Limit login attempts and offer MFA.','Where possible, leave login to an identity provider.']),
  dont:tx(['Passwörter verschlüsseln – wer den Schlüssel hat, hat alle Passwörter.','MD5, SHA-1 oder einfaches SHA-256 verwenden.','Passwörter loggen, auch nicht bei fehlgeschlagenem Login.','Ein eigenes Hash-Verfahren erfinden.'],['Encrypt passwords – whoever has the key has every password.','Use MD5, SHA-1 or plain SHA-256.','Log passwords, not even on failed logins.','Invent your own hashing scheme.']),
  why:tx('<p>Datenbanken werden geleakt – die Frage ist, was der Angreifer dann in der Hand hat. Mit langsamen, gesalzenen Hashes muss er jedes Passwort einzeln und teuer erraten. Weil viele Menschen Passwörter wiederverwenden, schützt du damit auch ihre Konten bei anderen Diensten.</p>','<p>Databases get leaked – the question is what the attacker holds afterwards. With slow, salted hashes they have to guess every password individually and expensively. Because many people reuse passwords, you also protect their accounts at other services.</p>')
});

LESSONS.push({
  id:'sessions-tokens',cat:'basics',
  title:tx('Session oder Token?','Session or token?'),
  short:tx('Zustand auf dem Server oder alles im Token – und was das beim Sperren bedeutet.','State on the server or everything in the token – and what that means for revocation.'),
  keys:'session cookie token jwt stateful stateless revocation sperren widerruf skalierung introspection opaque',
  refs:[['OWASP Session Management Cheat Sheet','https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html'],['RFC 7662: Token Introspection','https://www.rfc-editor.org/rfc/rfc7662']],
  rule:tx('Bei einer <b>Session</b> merkt sich der Server, wer angemeldet ist, und der Browser hält nur eine zufällige ID im Cookie. Bei einem <b>selbsttragenden Token</b> (JWT) steht alles Nötige im Token selbst, signiert – der Server muss nichts nachschlagen. Dafür lässt sich ein JWT nicht einfach zurückrufen: Es gilt, bis es abläuft. Darum sind Access Tokens kurzlebig.','With a <b>session</b>, the server remembers who is signed in and the browser only holds a random ID in a cookie. With a <b>self-contained token</b> (JWT), everything needed is in the token itself, signed – the server looks nothing up. In exchange, a JWT can’t simply be recalled: it’s valid until it expires. That’s why access tokens are short-lived.'),
  glance:{rows:[
    [tx('Session','Session'),tx('Serverseitiger Zustand, im Browser nur eine Session-ID (Cookie). Sofort widerrufbar.','Server-side state, only a session ID (cookie) in the browser. Revocable at once.')],
    [tx('Opakes Token','Opaque token'),tx('Zufallsstring ohne Inhalt. Der Server fragt beim Aussteller nach (Introspection, RFC 7662).','Random string without content. The server asks the issuer (introspection, RFC 7662).')],
    [tx('Selbsttragendes Token (JWT)','Self-contained token (JWT)'),tx('Enthält Claims und Signatur. Prüfbar ohne Nachfrage – aber gültig bis <code>exp</code>.','Contains claims and a signature. Verifiable without asking – but valid until <code>exp</code>.')],
    ['Stateful / stateless',tx('Ob der Server pro Benutzer etwas speichern muss.','Whether the server has to store something per user.')],
    [tx('Widerruf','Revocation'),tx('Ein ausgegebenes Recht vorzeitig entziehen: Logout, Sperre, Rolle weg.','Withdrawing an issued right early: logout, ban, role removed.')]
  ]},
  body:tx(`<h3>Im Vergleich</h3>
${table(['','Session + Cookie','JWT (Access Token)'],[
  [tx('Wo liegt der Zustand?','Where is the state?'),tx('Auf dem Server (Speicher, Redis, DB)','On the server (memory, Redis, DB)'),tx('Im Token selbst','In the token itself')],
  [tx('Sperren, Rolle entziehen','Ban, revoke role'),'<span class="yes">sofort</span>','<span class="meh">erst bei Ablauf (oder Blockliste)</span>'],
  [tx('Mehrere Server','Multiple servers'),'<span class="meh">gemeinsamer Session-Store nötig</span>','<span class="yes">jeder prüft selbst</span>'],
  [tx('Mehrere APIs / Microservices','Several APIs / microservices'),'<span class="meh">Cookie gilt nur für eine Domain</span>','<span class="yes">Token wandert mit</span>'],
  [tx('Diebstahl im Browser','Theft in the browser'),'<span class="yes">HttpOnly-Cookie ist für JavaScript unlesbar</span>','<span class="meh">hängt vom Speicherort ab</span>'],
  ['CSRF','<span class="meh">Schutz nötig (SameSite, Token)</span>','<span class="yes">kein Thema, wenn im Header</span>']
],{caption:tx('Session und JWT im Vergleich','Session and JWT compared')})}
<p>In der Praxis kombiniert man beides: Der Browser hat eine Session (oft bei einem BFF), die Server untereinander reden mit kurzlebigen JWTs. Und der Identity Provider selbst hat ebenfalls eine Session – die ist der Grund, warum Single Sign-on funktioniert.</p>`,
`<h3>Compared</h3>
${table(['','Session + cookie','JWT (access token)'],[
  ['Where is the state?','On the server (memory, Redis, DB)','In the token itself'],
  ['Ban, revoke role','<span class="yes">immediately</span>','<span class="meh">only on expiry (or a blocklist)</span>'],
  ['Multiple servers','<span class="meh">needs a shared session store</span>','<span class="yes">each verifies on its own</span>'],
  ['Several APIs / microservices','<span class="meh">cookie only works for one domain</span>','<span class="yes">token travels along</span>'],
  ['Theft in the browser','<span class="yes">HttpOnly cookie can’t be read by JavaScript</span>','<span class="meh">depends on where it’s stored</span>'],
  ['CSRF','<span class="meh">needs protection (SameSite, token)</span>','<span class="yes">not an issue when sent in a header</span>']
],{caption:'Session and JWT compared'})}
<p>In practice you combine both: the browser has a session (often with a BFF), the servers talk to each other with short-lived JWTs. And the identity provider itself also has a session – that’s why single sign-on works.</p>`),
  demoHint:tx('Ada sperrt Tom. Wie lange kommt Tom noch durch?','Ada bans Tom. How long does Tom still get through?'),
  demo:`<div class="row"><button type="button" class="btn btn-secondary" id="st-req">${ic('play')}${tx('Tom ruft /api/invoices auf','Tom calls /api/invoices')}</button><button type="button" class="btn btn-danger" id="st-ban">${ic('lock')}${tx('Ada sperrt Tom','Ada bans Tom')}</button><button type="button" class="btn btn-secondary" id="st-tick">+1 ${tx('Minute','minute')}</button><button type="button" class="btn btn-ghost" id="st-reset">${ic('refresh')}${tx('Neu','Reset')}</button><span class="mono" id="st-clock"></span></div>
<div class="two"><div class="panel"><h3>${tx('Session + Cookie','Session + cookie')}</h3><ul class="log" id="st-log-s"></ul></div><div class="panel"><h3>${tx('JWT, gültig 5 Minuten','JWT, valid 5 minutes')}</h3><ul class="log" id="st-log-j"></ul></div></div>`,
  init(root){
    let t=0,banned=false,exp=5;const ls=$('#st-log-s',root),lj=$('#st-log-j',root);
    const add=(ul,cls,txt)=>{ul.insertAdjacentHTML('beforeend',`<li class="l-${cls}">[${String(t).padStart(2,'0')}:00] ${txt}</li>`);ul.scrollTop=ul.scrollHeight};
    const clock=()=>{$('#st-clock',root).textContent=tx(`Zeit ${t}:00 · Token läuft ab um ${exp}:00`,`time ${t}:00 · token expires at ${exp}:00`)};
    $('#st-req',root).addEventListener('click',()=>{
      add(ls,banned?'no':'ok',banned?tx('401 – Session wurde gelöscht.','401 – session was deleted.'):tx('200 – Session gefunden.','200 – session found.'));
      if(t>=exp){if(banned)add(lj,'no',tx('401 – Token abgelaufen, Refresh wird verweigert (gesperrt).','401 – token expired, refresh denied (banned).'));else{exp=t+5;add(lj,'info',tx(`Token abgelaufen → per Refresh Token erneuert, gilt bis ${exp}:00.`,`Token expired → renewed via refresh token, valid until ${exp}:00.`));add(lj,'ok','200');}}
      else add(lj,banned?'no':'ok',banned?tx('200 – Signatur gültig, exp in der Zukunft. Die Sperre sieht hier niemand!','200 – signature valid, exp in the future. Nobody here sees the ban!'):'200');
      clock();
    });
    $('#st-ban',root).addEventListener('click',()=>{if(banned)return;banned=true;add(ls,'info',tx('Ada sperrt Tom → Server löscht seine Sessions.','Ada bans Tom → server deletes his sessions.'));add(lj,'info',tx('Ada sperrt Tom → im IdP gesperrt. Das ausgegebene JWT weiß davon nichts.','Ada bans Tom → banned in the IdP. The issued JWT knows nothing about it.'))});
    $('#st-tick',root).addEventListener('click',()=>{t++;clock()});
    const reset=()=>{t=0;banned=false;exp=5;ls.innerHTML='';lj.innerHTML='';clock()};
    $('#st-reset',root).addEventListener('click',reset);reset();
  },
  code:[
    {t:tx('Spring: Session-basiert (klassische Web-App)','Spring: session-based (classic web app)'),lang:'java',src:`http
  .sessionManagement(s -> s
      .sessionCreationPolicy(SessionCreationPolicy.IF_REQUIRED))
  .formLogin(Customizer.withDefaults());`},
    {t:tx('Spring: zustandslos mit JWT (Resource Server)','Spring: stateless with JWT (resource server)'),lang:'java',src:`http
  .sessionManagement(s -> s
      .sessionCreationPolicy(SessionCreationPolicy.STATELESS))
  .oauth2ResourceServer(o -> o.jwt(Customizer.withDefaults()));`,note:tx('<code>STATELESS</code> heißt: Spring legt keine HTTP-Session an. Jede Anfrage muss ihr Token mitbringen.','<code>STATELESS</code> means: Spring creates no HTTP session. Every request has to bring its token.')}
  ],
  do:tx(['Access Tokens kurz halten (5–15 Minuten) und über Refresh Tokens erneuern.','Für sofortigen Widerruf Introspection, Blockliste oder kurze Laufzeiten einplanen.','Bei Browser-Apps eine Session beim BFF in Betracht ziehen.'],['Keep access tokens short (5–15 minutes) and renew them via refresh tokens.','For immediate revocation plan introspection, a blocklist or short lifetimes.','For browser apps consider a session at a BFF.']),
  dont:tx(['JWTs mit stunden- oder tagelanger Laufzeit ausgeben.','„Stateless“ als Selbstzweck: Ein paar Millisekunden Lookup sind oft billiger als nicht widerrufbare Tokens.','Rollen nur im Token speichern und erwarten, dass Änderungen sofort wirken.'],['Issue JWTs that last hours or days.','“Stateless” for its own sake: a few milliseconds of lookup are often cheaper than irrevocable tokens.','Store roles only in the token and expect changes to take effect at once.']),
  why:tx('<p>Jede Rolle im Token ist eine Momentaufnahme vom Zeitpunkt der Ausstellung. Wer Tom heute die Teamleitung entzieht, will nicht, dass er noch eine Stunde lang Rechnungen freigeben kann. Die Laufzeit eines Access Tokens ist darum eine Sicherheitsentscheidung: Sie legt fest, wie lange eine Änderung höchstens braucht, bis sie wirkt.</p>','<p>Every role in a token is a snapshot from the moment it was issued. Whoever removes Tom’s team lead role today doesn’t want him to keep approving invoices for another hour. An access token’s lifetime is therefore a security decision: it sets the maximum time a change takes to become effective.</p>')
});

LESSONS.push({
  id:'token-storage',cat:'basics',
  title:tx('Wo liegt das Token?','Where does the token live?'),
  short:tx('localStorage, Speicher oder HttpOnly-Cookie – XSS und CSRF im Vergleich.','localStorage, memory or HttpOnly cookie – XSS and CSRF compared.'),
  keys:'localstorage sessionstorage cookie httponly secure samesite xss csrf token speicher storage memory',
  refs:[['OAuth 2.0 for Browser-Based Apps (IETF)','https://datatracker.ietf.org/doc/draft-ietf-oauth-browser-based-apps/'],['OWASP CSRF Prevention','https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html'],['MDN: Set-Cookie','https://developer.mozilla.org/docs/Web/HTTP/Headers/Set-Cookie']],
  rule:tx('Alles, was JavaScript lesen kann, kann auch ein eingeschleustes Script (XSS) lesen – <code>localStorage</code> ist darum der schlechteste Ort für ein Token. Ein <b>HttpOnly-Cookie</b> ist für JavaScript unsichtbar, wird aber automatisch mitgeschickt und braucht deshalb CSRF-Schutz. Am sichersten: Das Token verlässt den Server nie (BFF), oder es liegt nur im Arbeitsspeicher.','Anything JavaScript can read, an injected script (XSS) can read too – which makes <code>localStorage</code> the worst place for a token. An <b>HttpOnly cookie</b> is invisible to JavaScript, but sent automatically and therefore needs CSRF protection. Safest: the token never leaves the server (BFF), or it only lives in memory.'),
  glance:{rows:[
    ['XSS',tx('Cross-Site Scripting: fremdes JavaScript läuft in deiner Seite und kann alles, was deine Seite kann.','Cross-site scripting: foreign JavaScript runs in your page and can do everything your page can.')],
    ['CSRF',tx('Cross-Site Request Forgery: eine fremde Seite löst eine Anfrage an deine API aus, der Browser hängt dein Cookie an.','Cross-site request forgery: a foreign page triggers a request to your API, the browser attaches your cookie.')],
    ['<code>HttpOnly</code>',tx('Cookie-Attribut: für JavaScript (<code>document.cookie</code>) nicht lesbar.','Cookie attribute: not readable by JavaScript (<code>document.cookie</code>).')],
    ['<code>Secure</code>',tx('Cookie nur über HTTPS senden.','Only send the cookie over HTTPS.')],
    ['<code>SameSite=Lax/Strict</code>',tx('Cookie bei Anfragen von fremden Seiten nicht mitschicken (Lax: außer bei normaler Navigation per GET).','Don’t send the cookie on requests from foreign sites (Lax: except on normal GET navigation).')],
    [tx('Präfix <code>__Host-</code>','Prefix <code>__Host-</code>'),tx('Erzwingt <code>Secure</code>, <code>Path=/</code> und keine <code>Domain</code> – das Cookie gehört genau einem Host.','Enforces <code>Secure</code>, <code>Path=/</code> and no <code>Domain</code> – the cookie belongs to exactly one host.')]
  ]},
  body:tx(`<h3>Ehrlich bleiben: XSS ist immer ein Totalschaden</h3>
<p>Auch mit HttpOnly-Cookie kann ein eingeschleustes Script Anfragen im Namen des Benutzers schicken, solange die Seite offen ist. Was der sichere Speicherort verhindert, ist der <i>Diebstahl</i>: Das Token wandert nicht zum Angreifer, der es dann tagelang von seinem eigenen Rechner aus benutzt. Gegen XSS selbst helfen Angulars automatisches Escaping, eine Content Security Policy und Trusted Types.</p>`,
`<h3>Being honest: XSS is always game over</h3>
<p>Even with an HttpOnly cookie, an injected script can send requests on the user’s behalf while the page is open. What the safe storage prevents is <i>theft</i>: the token doesn’t travel to the attacker, who could then use it for days from their own machine. Against XSS itself, Angular’s automatic escaping, a content security policy and Trusted Types help.</p>`),
  demoHint:tx('Wähle den Speicherort und lass die Angriffe laufen.','Pick a storage location and run the attacks.'),
  demo:`<fieldset class="seg"><legend>${tx('Speicherort des Tokens','Token storage')}</legend><div class="seg-opts">
  ${[['ls','localStorage'],['ss','sessionStorage'],['mem',tx('Arbeitsspeicher','In memory')],['cookie-none','Cookie SameSite=None'],['cookie-lax','HttpOnly Cookie, SameSite=Lax'],['bff',tx('BFF (Token bleibt am Server)','BFF (token stays on server)')]].map(([v,l],i)=>`<label><input type="radio" name="ts-store" value="${v}"${i?'':' checked'}>${l}</label>`).join('')}
</div></fieldset>
<div id="ts-out"></div>`,
  init(root){
    const R={
      ls:{xss:['no',tx('<code>localStorage.getItem("token")</code> – das Script schickt das Token an seinen Server. Der Angreifer nutzt es weiter, auch wenn der Tab zu ist.','<code>localStorage.getItem("token")</code> – the script sends the token to its server. The attacker keeps using it, even after the tab is closed.')],csrf:['ok',tx('Fremde Seiten kommen nicht an deinen localStorage, und der Browser hängt nichts automatisch an.','Foreign sites can’t reach your localStorage, and the browser attaches nothing automatically.')],reload:['ok',tx('Überlebt Neuladen und neue Tabs.','Survives reloads and new tabs.')]},
      ss:{xss:['no',tx('<code>sessionStorage</code> ist genauso lesbar – nur auf den Tab beschränkt.','<code>sessionStorage</code> is just as readable – only limited to the tab.')],csrf:['ok',tx('Kein automatisches Mitschicken.','Nothing is sent automatically.')],reload:['meh',tx('Überlebt Neuladen, aber jeder neue Tab muss neu anmelden.','Survives reloads, but every new tab has to sign in again.')]},
      mem:{xss:['meh',tx('Kein einfaches <code>getItem</code>: Das Token steckt in einer Variablen. Ein gezieltes Script kann aber Anfragen abfangen (etwa <code>fetch</code> überschreiben).','No simple <code>getItem</code>: the token sits in a variable. A targeted script can still intercept requests (e.g. by overriding <code>fetch</code>).')],csrf:['ok',tx('Kein automatisches Mitschicken.','Nothing is sent automatically.')],reload:['meh',tx('Weg nach Neuladen – braucht stillen Refresh beim IdP.','Gone after reload – needs a silent refresh at the IdP.')]},
      'cookie-none':{xss:['ok',tx('HttpOnly: Das Script kann das Cookie nicht lesen (aber solange der Tab offen ist, Anfragen auslösen).','HttpOnly: the script can’t read the cookie (but can trigger requests while the tab is open).')],csrf:['no',tx('Eine fremde Seite schickt <code>POST /api/invoices/R-1002/approve</code> – der Browser hängt das Cookie an. Ohne CSRF-Token wird freigegeben!','A foreign site sends <code>POST /api/invoices/R-1002/approve</code> – the browser attaches the cookie. Without a CSRF token it gets approved!')],reload:['ok',tx('Überlebt Neuladen.','Survives reloads.')]},
      'cookie-lax':{xss:['ok',tx('Nicht lesbar für JavaScript.','Not readable for JavaScript.')],csrf:['ok',tx('SameSite=Lax: Bei einem POST von einer fremden Seite schickt der Browser das Cookie nicht mit. Ein CSRF-Token (Spring macht das standardmäßig) ist trotzdem gute Praxis.','SameSite=Lax: on a POST from a foreign site the browser doesn’t send the cookie. A CSRF token (Spring does this by default) is still good practice.')],reload:['ok',tx('Überlebt Neuladen.','Survives reloads.')]},
      bff:{xss:['ok',tx('Im Browser gibt es gar kein Access Token, nur ein HttpOnly-Session-Cookie zum BFF.','There’s no access token in the browser at all, only an HttpOnly session cookie to the BFF.')],csrf:['ok',tx('SameSite-Cookie plus CSRF-Token am BFF.','SameSite cookie plus CSRF token at the BFF.')],reload:['ok',tx('Session am BFF überlebt Neuladen.','The BFF session survives reloads.')]}
    };
    const out=$('#ts-out',root);
    const run=()=>{const r=R[$('input[name="ts-store"]:checked',root).value];
      const row=(name,[s,t])=>[name,`<span class="${s==='ok'?'yes':s==='no'?'no':'meh'}">${s==='ok'?tx('geschützt','protected'):s==='no'?tx('verwundbar','vulnerable'):tx('teilweise','partly')}</span>`,t];
      out.innerHTML=table([tx('Angriff / Situation','Attack / situation'),tx('Ergebnis','Result'),tx('Was passiert','What happens')],[row(tx('XSS: fremdes Script stiehlt das Token','XSS: foreign script steals the token'),r.xss),row(tx('CSRF: fremde Seite löst Freigabe aus','CSRF: foreign site triggers an approval'),r.csrf),row(tx('Neu laden / neuer Tab','Reload / new tab'),r.reload)],{caption:tx('Ergebnis der Angriffe','Attack results')});};
    root.addEventListener('change',run);run();
  },
  code:[{t:tx('Spring: Session-Cookie fürs BFF härten','Spring: harden the BFF session cookie'),lang:'yaml',src:`server:
  servlet:
    session:
      cookie:
        name: __Host-SESSION
        http-only: true
        secure: true
        same-site: lax`}],
  do:tx(['Bevorzugt: BFF – im Browser nur ein <code>__Host-</code>-Cookie mit <code>HttpOnly</code>, <code>Secure</code>, <code>SameSite=Lax</code>.','Ohne BFF: Access Token nur im Arbeitsspeicher, kurze Laufzeit, Refresh Token mit Rotation.','CSRF-Schutz anlassen, sobald Cookies im Spiel sind.','Gegen XSS: kein <code>innerHTML</code> mit Benutzerdaten, CSP setzen.'],['Preferred: BFF – only a <code>__Host-</code> cookie with <code>HttpOnly</code>, <code>Secure</code>, <code>SameSite=Lax</code> in the browser.','Without a BFF: access token only in memory, short lifetime, refresh token with rotation.','Keep CSRF protection on as soon as cookies are involved.','Against XSS: no <code>innerHTML</code> with user data, set a CSP.']),
  dont:tx(['Access oder Refresh Tokens in <code>localStorage</code> legen.','Cookies mit <code>SameSite=None</code> ohne CSRF-Token.','Spring-CSRF-Schutz pauschal abschalten, „weil es stört“.'],['Put access or refresh tokens in <code>localStorage</code>.','Cookies with <code>SameSite=None</code> without a CSRF token.','Switch off Spring’s CSRF protection wholesale “because it gets in the way”.']),
  why:tx('<p>Ein gestohlenes Token ist ein gestohlener Ausweis: Wer es hat, <i>ist</i> für die API der Benutzer. Der Speicherort entscheidet, ob ein einziger XSS-Fehler irgendwo in der App – etwa in einer Drittbibliothek – zu einem dauerhaften Kontodiebstahl wird oder „nur“ zu einem Schaden, solange der Tab offen ist.</p>','<p>A stolen token is a stolen ID card: whoever holds it <i>is</i> the user as far as the API is concerned. The storage location decides whether a single XSS bug anywhere in the app – say in a third-party library – becomes a lasting account takeover or “only” damage while the tab is open.</p>')
});

LESSONS.push({
  id:'jwt',cat:'basics',
  title:tx('JWT von innen','Inside a JWT'),
  short:tx('Header, Payload, Signatur – lesbar für alle, fälschbar für niemanden.','Header, payload, signature – readable by anyone, forgeable by no one.'),
  keys:'jwt json web token jws header payload signature claims iss sub aud exp iat nbf jti base64url hs256 rs256 es256 decoder',
  refs:[['RFC 7519: JWT','https://www.rfc-editor.org/rfc/rfc7519'],['RFC 9068: JWT Access Tokens','https://www.rfc-editor.org/rfc/rfc9068'],['jwt.io','https://jwt.io/']],
  rule:tx('Ein JWT besteht aus drei Base64URL-Teilen, getrennt durch Punkte: <b>Header</b> (Algorithmus), <b>Payload</b> (die Claims) und <b>Signatur</b>. Der Inhalt ist nur kodiert, nicht verschlüsselt – jeder kann ihn lesen. Die Signatur sorgt dafür, dass niemand ihn unbemerkt ändern kann. Also: nichts Geheimes ins Token, und jedes Token vor der Nutzung prüfen.','A JWT consists of three Base64URL parts separated by dots: <b>header</b> (algorithm), <b>payload</b> (the claims) and <b>signature</b>. The content is only encoded, not encrypted – anyone can read it. The signature makes sure nobody can change it unnoticed. So: nothing secret in the token, and verify every token before using it.'),
  glance:{head:['Claim',tx('Bedeutung','Meaning')],rows:[
    ['<code>iss</code>',tx('Issuer: wer das Token ausgestellt hat (URL des Identity Providers).','Issuer: who issued the token (URL of the identity provider).')],
    ['<code>sub</code>',tx('Subject: stabile ID des Benutzers. Nicht die E-Mail – die kann sich ändern.','Subject: stable ID of the user. Not the email – that can change.')],
    ['<code>aud</code>',tx('Audience: für welche API das Token gedacht ist.','Audience: which API the token is meant for.')],
    ['<code>exp</code> · <code>iat</code> · <code>nbf</code>',tx('Ablauf, Ausstellung, „nicht vor“ – Sekunden seit 1970.','Expiry, issued at, not before – seconds since 1970.')],
    ['<code>jti</code>',tx('Eindeutige Token-ID, etwa für Blocklisten.','Unique token ID, e.g. for blocklists.')],
    ['<code>scope</code>',tx('Was der Client im Namen des Benutzers darf (OAuth).','What the client may do on the user’s behalf (OAuth).')],
    ['<code>roles</code> / <code>realm_access</code>',tx('Eigene Claims für Rollen – der Name hängt vom Identity Provider ab.','Custom claims for roles – the name depends on the identity provider.')],
    ['HS256 · RS256 · ES256',tx('Symmetrisch (ein geteiltes Secret) oder asymmetrisch (privater Schlüssel signiert, öffentlicher prüft).','Symmetric (one shared secret) or asymmetric (private key signs, public key verifies).')]
  ]},
  body:tx(`${chain([['Header','{"alg":"HS256","typ":"JWT"}','brand'],['Payload','{"sub":"tom","roles":[…],"exp":…}','brand'],[tx('Signatur','Signature'),'HMAC-SHA256(header.payload, secret)','warn']],['.','.'])}
<h3>Symmetrisch oder asymmetrisch?</h3>
<p>Bei <b>HS256</b> signiert und prüft dasselbe Secret – jede API, die prüfen kann, könnte also auch fälschen. Bei <b>RS256</b> oder <b>ES256</b> signiert nur der Identity Provider mit seinem privaten Schlüssel; die APIs holen sich die öffentlichen Schlüssel über eine JWKS-URL. Für Tokens eines Identity Providers ist asymmetrisch der Standard. Die Demo nutzt HS256, weil der Browser das ohne Schlüsselpaar zeigen kann.</p>`,
`${chain([['Header','{"alg":"HS256","typ":"JWT"}','brand'],['Payload','{"sub":"tom","roles":[…],"exp":…}','brand'],['Signature','HMAC-SHA256(header.payload, secret)','warn']],['.','.'])}
<h3>Symmetric or asymmetric?</h3>
<p>With <b>HS256</b> the same secret signs and verifies – so every API that can verify could also forge. With <b>RS256</b> or <b>ES256</b> only the identity provider signs with its private key; the APIs fetch the public keys via a JWKS URL. Asymmetric is the standard for identity provider tokens. The demo uses HS256 because the browser can show it without a key pair.</p>`),
  demoHint:tx('Das Token gehört der Person oben unter „Angemeldet als“. Signiert und geprüft wird wirklich – mit HMAC-SHA256 im Browser.','The token belongs to the person under “Signed in as” at the top. Signing and verification are real – HMAC-SHA256 in the browser.'),
  demo:`<div class="field"><label for="jwt-tok">${tx('Token (bearbeitbar)','Token (editable)')}</label><textarea class="input" id="jwt-tok" rows="4" spellcheck="false"></textarea></div>
<div class="row"><button type="button" class="btn btn-secondary" id="jwt-tamper">${ic('bug')}${tx('Rolle auf ADMIN ändern, ohne neu zu signieren','Change role to ADMIN without re-signing')}</button><button type="button" class="btn btn-secondary" id="jwt-none">${ic('bug')}${tx('alg auf „none“ setzen, Signatur weg','Set alg to “none”, drop signature')}</button><button type="button" class="btn btn-ghost" id="jwt-fresh">${ic('refresh')}${tx('Frisches Token','Fresh token')}</button></div>
<div class="two"><div><h3>Header</h3><pre class="out" id="jwt-h"></pre></div><div><h3>Payload</h3><pre class="out" id="jwt-p"></pre></div></div>
<div id="jwt-v"></div>`,
  init(root){
    const SECRET='nordwind-demo-secret';const ta=$('#jwt-tok',root);
    const keyP=crypto.subtle.importKey('raw',new TextEncoder().encode(SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign','verify']);
    async function sign(h,p){const k=await keyP;const data=b64u.enc(JSON.stringify(h))+'.'+b64u.enc(JSON.stringify(p));const s=await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(data));return data+'.'+b64u.encBytes(s)}
    async function fresh(){const p=persona(),now=Math.floor(Date.now()/1000);
      ta.value=await sign({alg:'HS256',typ:'JWT'},{iss:'https://login.nordwind.example/realms/nordwind',sub:p.id,aud:'invoice-api',name:p.name,roles:p.roles,team:p.team,iat:now,exp:now+300});show()}
    async function show(){
      const parts=ta.value.trim().split('.');const H=$('#jwt-h',root),Pp=$('#jwt-p',root),V=$('#jwt-v',root);
      let h,p;try{h=JSON.parse(b64u.dec(parts[0]));p=JSON.parse(b64u.dec(parts[1]||''))}catch(e){H.textContent='—';Pp.textContent='—';V.innerHTML=verdict(false,tx('Kein lesbares JWT','Not a readable JWT'),tx('Drei Base64URL-Teile, getrennt durch Punkte.','Three Base64URL parts separated by dots.'));return}
      H.textContent=JSON.stringify(h,null,2);Pp.textContent=JSON.stringify(p,null,2);
      if(h.alg!=='HS256'){V.innerHTML=verdict(false,tx(`Abgelehnt: alg „${esc(h.alg)}“ ist nicht erlaubt`,`Rejected: alg “${esc(h.alg)}” is not allowed`),tx('Der Server legt die erlaubten Algorithmen fest – nie das Token. Bibliotheken, die „none“ akzeptierten, waren eine echte Lücke.','The server decides which algorithms are allowed – never the token. Libraries that accepted “none” were a real vulnerability.'));return}
      let ok=false;try{const k=await keyP;const sig=Uint8Array.from(atob((parts[2]||'').replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil((parts[2]||'').length/4)*4,'=')),c=>c.charCodeAt(0));ok=await crypto.subtle.verify('HMAC',k,sig,new TextEncoder().encode(parts[0]+'.'+parts[1]))}catch(e){ok=false}
      const expired=p.exp&&p.exp<Date.now()/1000;
      V.innerHTML=ok?(expired?verdict(false,tx('Signatur gültig, aber abgelaufen','Signature valid, but expired')):verdict(true,tx('Signatur gültig – der Inhalt ist unverändert','Signature valid – content unchanged'),tx(`Rollen laut Token: ${(p.roles||[]).join(', ')||'keine'}`,`Roles according to the token: ${(p.roles||[]).join(', ')||'none'}`))):verdict(false,tx('Signatur ungültig – Token wird abgelehnt (401)','Signature invalid – token rejected (401)'),tx('Wer den Inhalt ändert, braucht das Secret, um neu zu signieren. Lesen konnte er ihn trotzdem.','Whoever changes the content needs the secret to re-sign. Reading it was possible anyway.'));
    }
    $('#jwt-tamper',root).addEventListener('click',()=>{const [h,p,s]=ta.value.trim().split('.');try{const o=JSON.parse(b64u.dec(p));o.roles=['ADMIN'];ta.value=h+'.'+b64u.enc(JSON.stringify(o))+'.'+s;show()}catch(e){}});
    $('#jwt-none',root).addEventListener('click',()=>{const [,p]=ta.value.trim().split('.');ta.value=b64u.enc(JSON.stringify({alg:'none',typ:'JWT'}))+'.'+p+'.';show()});
    $('#jwt-fresh',root).addEventListener('click',fresh);
    ta.addEventListener('input',show);
    return onPersona(fresh);
  },
  lang:'ts',
  bad:{code:`// Frontend decides on its own: "the token says ADMIN"
const payload = JSON.parse(atob(token.split('.')[1]));
if (payload.roles.includes('ADMIN')) {
  showAdminArea();   // and the API trusts the frontend …
}`,note:tx('Das Frontend kann die Signatur gar nicht prüfen (es hat das Secret bzw. prüft keine Schlüssel) – und der Benutzer kann sein Token beliebig austauschen. Für die Anzeige ist das okay, für Sicherheit nie.','The frontend can’t verify the signature (it doesn’t have the secret or check any keys) – and the user can swap their token at will. Fine for display, never for security.')},
  good:{code:`// Spring validates signature, iss, aud, exp – before your code runs
@GetMapping("/api/me")
Map<String, Object> me(@AuthenticationPrincipal Jwt jwt) {
  return Map.of("sub", jwt.getSubject(),
                "roles", jwt.getClaimAsStringList("roles"));
}`,lang:'java',note:tx('Auf dem Server ist das Token geprüft, bevor dein Code es sieht. Im Frontend darfst du Claims lesen, um die Oberfläche anzupassen – mehr nicht.','On the server the token is verified before your code sees it. In the frontend you may read claims to adapt the UI – nothing more.')},
  do:tx(['Tokens nur lesen, wenn sie geprüft sind – auf dem Server immer.','<code>sub</code> als Benutzer-ID verwenden.','Asymmetrische Signaturen (RS256, ES256) für Tokens eines Identity Providers.'],['Only read tokens once verified – always on the server.','Use <code>sub</code> as the user ID.','Asymmetric signatures (RS256, ES256) for identity provider tokens.']),
  dont:tx(['Personenbezogene oder geheime Daten in die Payload legen.','Den Algorithmus aus dem Token-Header übernehmen.','Tokens zum Debuggen in Online-Decoder kopieren, die nicht lokal arbeiten.'],['Put personal or secret data into the payload.','Take the algorithm from the token header.','Paste tokens into online decoders that don’t work locally for debugging.']),
  why:tx('<p>JWTs sind praktisch, weil jeder Dienst sie selbst prüfen kann. Genau darin liegt die Falle: Wer „Token lesen“ mit „Token prüfen“ verwechselt, vertraut einem Text, den der Benutzer selbst geschrieben haben kann. Die Signatur ist der einzige Grund, einem JWT zu glauben.</p>','<p>JWTs are handy because every service can verify them on its own. That’s exactly the trap: whoever confuses “reading a token” with “verifying a token” trusts text the user may have written themselves. The signature is the only reason to believe a JWT.</p>')
});

LESSONS.push({
  id:'jwt-validation',cat:'basics',
  title:tx('JWT richtig prüfen','Validating a JWT properly'),
  short:tx('Signatur, Algorithmus, Aussteller, Empfänger, Zeit – in dieser Reihenfolge.','Signature, algorithm, issuer, audience, time – in this order.'),
  keys:'jwt validierung validation jwks kid key rotation issuer audience exp nbf clock skew alg none confusion',
  refs:[['RFC 8725: JWT Best Current Practices','https://www.rfc-editor.org/rfc/rfc8725'],['Spring Security: JWT','https://docs.spring.io/spring-security/reference/servlet/oauth2/resource-server/jwt.html']],
  rule:tx('Ein Token ist erst vertrauenswürdig, wenn <b>alle</b> Prüfungen bestanden sind: erlaubter Algorithmus, passender Schlüssel (über <code>kid</code> aus dem JWKS), gültige Signatur, richtiger <code>iss</code>, die eigene API in <code>aud</code>, und die Zeit zwischen <code>nbf</code> und <code>exp</code> – mit wenig Toleranz für Uhrabweichung. Eine fehlende Prüfung reicht für eine Lücke.','A token is only trustworthy once <b>all</b> checks pass: allowed algorithm, matching key (via <code>kid</code> from the JWKS), valid signature, correct <code>iss</code>, your own API in <code>aud</code>, and the time between <code>nbf</code> and <code>exp</code> – with little tolerance for clock skew. A single missing check is enough for a hole.'),
  glance:{rows:[
    ['JWKS',tx('JSON Web Key Set: die öffentlichen Schlüssel des Identity Providers unter einer URL, etwa <code>…/protocol/openid-connect/certs</code>.','JSON Web Key Set: the identity provider’s public keys at a URL, e.g. <code>…/protocol/openid-connect/certs</code>.')],
    ['<code>kid</code>',tx('Key ID im Header: welcher Schlüssel aus dem JWKS gilt. Ermöglicht Schlüsselwechsel ohne Ausfall.','Key ID in the header: which key from the JWKS applies. Enables key rotation without downtime.')],
    [tx('Clock Skew','Clock skew'),tx('Toleranz für abweichende Uhren, üblich 30–60 Sekunden.','Tolerance for clocks that differ, typically 30–60 seconds.')],
    [tx('Algorithm Confusion','Algorithm confusion'),tx('Angriff: RS256-Token wird als HS256 mit dem öffentlichen Schlüssel als Secret „geprüft“. Abhilfe: Algorithmus fest vorgeben.','Attack: an RS256 token is “verified” as HS256 using the public key as the secret. Fix: pin the algorithm.')],
    ['Audience',tx('Ohne <code>aud</code>-Prüfung akzeptiert deine API Tokens, die für eine ganz andere API ausgestellt wurden.','Without an <code>aud</code> check your API accepts tokens issued for an entirely different API.')]
  ]},
  demoHint:tx('Wähle ein Token und sieh, an welcher Prüfung es scheitert.','Pick a token and see which check it fails.'),
  demo:`<div class="field"><label for="jv-case">${tx('Eingehendes Token','Incoming token')}</label><select id="jv-case">
  <option value="ok">${tx('Gültiges Token für invoice-api','Valid token for invoice-api')}</option>
  <option value="none">${tx('alg: none, keine Signatur','alg: none, no signature')}</option>
  <option value="kid">${tx('Unbekannte kid (Schlüssel wurde rotiert)','Unknown kid (key was rotated)')}</option>
  <option value="sig">${tx('Payload nachträglich geändert','Payload changed afterwards')}</option>
  <option value="iss">${tx('Von einem anderen Realm ausgestellt','Issued by another realm')}</option>
  <option value="aud">${tx('Für die Reporting-API ausgestellt','Issued for the reporting API')}</option>
  <option value="exp">${tx('Seit 10 Minuten abgelaufen','Expired 10 minutes ago')}</option>
  <option value="skew">${tx('Seit 20 Sekunden abgelaufen (Uhren weichen ab)','Expired 20 seconds ago (clocks differ)')}</option>
  <option value="nbf">${tx('nbf liegt in der Zukunft','nbf lies in the future')}</option>
</select></div><div id="jv-out"></div>`,
  init(root){
    const checks=[['alg',tx('Algorithmus ist RS256 (fest vorgegeben)','Algorithm is RS256 (pinned)')],['kid',tx('<code>kid</code> im JWKS gefunden – sonst JWKS einmal neu laden','<code>kid</code> found in JWKS – otherwise reload the JWKS once')],['sig',tx('Signatur passt zum öffentlichen Schlüssel','Signature matches the public key')],['iss',tx('<code>iss</code> = https://login.nordwind.example/realms/nordwind','<code>iss</code> = https://login.nordwind.example/realms/nordwind')],['aud',tx('<code>aud</code> enthält invoice-api','<code>aud</code> contains invoice-api')],['time',tx('<code>nbf</code> ≤ jetzt ≤ <code>exp</code> (± 60 s Toleranz)','<code>nbf</code> ≤ now ≤ <code>exp</code> (± 60 s tolerance)')]];
    const fail={none:'alg',kid:'kid',sig:'sig',iss:'iss',aud:'aud',exp:'time',nbf:'time'};
    const out=$('#jv-out',root);
    const run=()=>{const c=$('#jv-case',root).value,f=fail[c];let stop=false;
      const items=checks.map(([k,t])=>{if(stop)return['skip',t];if(k===f){stop=true;return['no',t]}return['ok',t]});
      const extra={kid:tx('Der Resource Server lädt das JWKS neu. Ist die kid dann immer noch unbekannt, ist das Token gefälscht oder sehr alt.','The resource server reloads the JWKS. If the kid is still unknown, the token is forged or very old.'),skew:tx('20 Sekunden liegen in der Toleranz – angenommen. Ohne Toleranz gäbe es zufällige 401 bei leicht falsch gehenden Uhren.','20 seconds are within tolerance – accepted. Without tolerance you’d get random 401s with slightly wrong clocks.'),aud:tx('Das Token ist echt und gültig – nur nicht für dich. Ohne aud-Prüfung könnte jede andere App des Realms deine API aufrufen.','The token is genuine and valid – just not for you. Without an aud check any other app in the realm could call your API.')}[c];
      out.innerHTML=traceHTML(items)+`<div style="margin-top:10px">${f?verdict(false,'401 Unauthorized',extra):verdict(true,tx('Token akzeptiert','Token accepted'),extra)}</div>`};
    $('#jv-case',root).addEventListener('change',run);run();
  },
  code:[
    {t:'application.yml',lang:'yaml',src:`spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.nordwind.example/realms/nordwind
          audiences: invoice-api          # checks the aud claim`,note:tx('Mit <code>issuer-uri</code> holt sich Spring beim Start die OpenID-Konfiguration, darin die JWKS-URL, und prüft <code>iss</code>, Signatur und Zeit automatisch. <code>audiences</code> ergänzt die aud-Prüfung.','With <code>issuer-uri</code>, Spring fetches the OpenID configuration at startup, including the JWKS URL, and checks <code>iss</code>, signature and time automatically. <code>audiences</code> adds the aud check.')},
    {t:tx('Eigener Validator, etwa für einen Pflicht-Claim','Custom validator, e.g. for a required claim'),lang:'java',src:`@Bean
JwtDecoder jwtDecoder(OAuth2ResourceServerProperties props) {
  NimbusJwtDecoder decoder = JwtDecoders.fromIssuerLocation(props.getJwt().getIssuerUri());
  OAuth2TokenValidator<Jwt> tenant = new JwtClaimValidator<String>(
      "tenant", t -> t != null && !t.isBlank());
  decoder.setJwtValidator(new DelegatingOAuth2TokenValidator<>(
      JwtValidators.createDefaultWithIssuer(props.getJwt().getIssuerUri()), tenant));
  return decoder;
}`}
  ],
  do:tx(['Bibliotheken nehmen (Spring Security, Nimbus) statt selbst zu parsen.','Den erwarteten Algorithmus fest vorgeben.','<code>aud</code> immer prüfen.','Schlüssel rotieren und das JWKS cachen.'],['Use libraries (Spring Security, Nimbus) instead of parsing yourself.','Pin the expected algorithm.','Always check <code>aud</code>.','Rotate keys and cache the JWKS.']),
  dont:tx(['Nur die Signatur prüfen und den Rest weglassen.','Den Schlüssel aus dem Token selbst nehmen (<code>jwk</code>-Header).','Die Uhrentoleranz auf Minuten aufblähen.'],['Only check the signature and skip the rest.','Take the key from the token itself (<code>jwk</code> header).','Inflate the clock tolerance to minutes.']),
  why:tx('<p>Jede einzelne Prüfung verhindert einen bekannten Angriff: <code>alg</code> den Downgrade auf „none“, <code>kid</code> das Unterschieben eigener Schlüssel, <code>iss</code> Tokens aus fremden Realms, <code>aud</code> Tokens für andere APIs, die Zeit das Wiederverwenden alter Tokens. RFC 8725 sammelt sie als Best Current Practice.</p>','<p>Each check prevents a known attack: <code>alg</code> the downgrade to “none”, <code>kid</code> slipping in your own keys, <code>iss</code> tokens from foreign realms, <code>aud</code> tokens for other APIs, time the reuse of old tokens. RFC 8725 collects them as best current practice.</p>')
});

LESSONS.push({
  id:'refresh-tokens',cat:'basics',
  title:tx('Access und Refresh Token','Access and refresh tokens'),
  short:tx('Kurz gültige Ausweise, ein langlebiger Erneuerungsschein – und was Rotation bringt.','Short-lived ID cards, a long-lived renewal slip – and what rotation buys you.'),
  keys:'refresh token access token rotation reuse detection offline_access lebensdauer lifetime silent refresh sliding session',
  refs:[['RFC 6749 §1.5: Refresh Token','https://www.rfc-editor.org/rfc/rfc6749#section-1.5'],['OAuth 2.0 Security BCP (RFC 9700)','https://www.rfc-editor.org/rfc/rfc9700']],
  rule:tx('Das <b>Access Token</b> geht bei jeder Anfrage an die API und lebt nur Minuten. Das <b>Refresh Token</b> geht nur an den Identity Provider und holt neue Access Tokens. Bei <b>Rotation</b> gibt es bei jeder Erneuerung auch ein neues Refresh Token; wird ein altes noch einmal benutzt, weiß der Identity Provider, dass es gestohlen wurde, und sperrt die ganze Kette.','The <b>access token</b> goes to the API with every request and lives only minutes. The <b>refresh token</b> only goes to the identity provider and fetches new access tokens. With <b>rotation</b>, every renewal also yields a new refresh token; if an old one is used again, the identity provider knows it was stolen and revokes the whole chain.'),
  glance:{rows:[
    ['Access Token',tx('Für die API. Kurz (5–15 min). Oft ein JWT.','For the API. Short (5–15 min). Often a JWT.')],
    ['Refresh Token',tx('Für den Identity Provider. Länger (Stunden bis Tage). Meist opak.','For the identity provider. Longer (hours to days). Usually opaque.')],
    [tx('Rotation','Rotation'),tx('Jedes Refresh Token ist nur einmal verwendbar.','Every refresh token can be used only once.')],
    [tx('Reuse Detection','Reuse detection'),tx('Ein schon verbrauchtes Refresh Token taucht wieder auf → Familie widerrufen.','An already used refresh token shows up again → revoke the family.')],
    ['<code>offline_access</code>',tx('Scope für Refresh Tokens, die auch ohne aktive IdP-Session gelten.','Scope for refresh tokens that work even without an active IdP session.')],
    [tx('Idle / Max Lifetime','Idle / max lifetime'),tx('Wie lange ohne Nutzung, wie lange höchstens – danach neu anmelden.','How long without use, how long at most – then sign in again.')]
  ]},
  demoHint:tx('Ein Angreifer hat Toms Refresh Token kopiert. Was passiert mit Rotation?','An attacker copied Tom’s refresh token. What happens with rotation?'),
  demo:`<div class="row"><button type="button" class="btn btn-secondary" id="rt-api">${ic('play')}${tx('Tom: API-Aufruf','Tom: API call')}</button><button type="button" class="btn btn-secondary" id="rt-tick">+5 ${tx('Minuten','minutes')}</button><button type="button" class="btn btn-danger" id="rt-steal">${ic('bug')}${tx('Angreifer kopiert das Refresh Token','Attacker copies the refresh token')}</button><button type="button" class="btn btn-danger" id="rt-use">${ic('bug')}${tx('Angreifer erneuert damit','Attacker refreshes with it')}</button><button type="button" class="btn btn-ghost" id="rt-reset">${ic('refresh')}${tx('Neu','Reset')}</button></div>
<label class="check-row"><input type="checkbox" id="rt-rot" checked>${tx('Rotation mit Reuse Detection','Rotation with reuse detection')}</label>
<p class="mono" id="rt-state"></p><ul class="log" id="rt-log"></ul>`,
  init(root){
    let t,at,rt,n,stolen,used,revoked;const log=$('#rt-log',root);
    const add=(c,s)=>{log.insertAdjacentHTML('beforeend',`<li class="l-${c}">[${t} min] ${s}</li>`);log.scrollTop=log.scrollHeight};
    const state=()=>{$('#rt-state',root).textContent=revoked?tx('Familie widerrufen – Tom muss sich neu anmelden.','Family revoked – Tom has to sign in again.'):`Access Token AT${n} ${tx('gültig bis','valid until')} ${at} min · Refresh Token RT${n}${stolen?tx(` · Angreifer hat RT${stolen}`,` · attacker holds RT${stolen}`):''}`};
    const refresh=(who,tok)=>{const rot=$('#rt-rot',root).checked;
      if(revoked){add('no',tx(`${who}: RT${tok} → 400 invalid_grant (widerrufen).`,`${who}: RT${tok} → 400 invalid_grant (revoked).`));return false}
      if(rot&&used.has(tok)){revoked=true;add('no',tx(`${who}: RT${tok} wurde schon benutzt → Reuse erkannt! Alle Tokens der Familie widerrufen.`,`${who}: RT${tok} was already used → reuse detected! All tokens of the family revoked.`));return false}
      if(rot){used.add(tok);n++;rt=n}at=t+5;add('ok',tx(`${who}: RT${tok} → neues AT${n}${rot?` und neues RT${n}`:` (RT${tok} bleibt gültig)`}.`,`${who}: RT${tok} → new AT${n}${rot?` and new RT${n}`:` (RT${tok} stays valid)`}.`));return true};
    $('#rt-api',root).addEventListener('click',()=>{if(revoked){add('no',tx('Tom: 401 – bitte neu anmelden.','Tom: 401 – please sign in again.'));return}if(t>=at){add('info',tx('Tom: AT abgelaufen → Refresh.','Tom: AT expired → refresh.'));if(!refresh('Tom',rt))return}add('ok',tx(`Tom: GET /api/invoices mit AT${n} → 200`,`Tom: GET /api/invoices with AT${n} → 200`));state()});
    $('#rt-tick',root).addEventListener('click',()=>{t+=5;state()});
    $('#rt-steal',root).addEventListener('click',()=>{stolen=rt;add('info',tx(`Angreifer kopiert RT${rt} (etwa per XSS aus dem localStorage).`,`Attacker copies RT${rt} (e.g. via XSS from localStorage).`));state()});
    $('#rt-use',root).addEventListener('click',()=>{if(!stolen){add('info',tx('Der Angreifer hat noch nichts.','The attacker has nothing yet.'));return}refresh(tx('Angreifer','Attacker'),stolen);state()});
    const reset=()=>{t=0;at=5;rt=1;n=1;stolen=0;used=new Set();revoked=false;log.innerHTML='';add('info',tx('Tom meldet sich an: AT1 (5 min) und RT1.','Tom signs in: AT1 (5 min) and RT1.'));state()};
    $('#rt-reset',root).addEventListener('click',reset);$('#rt-rot',root).addEventListener('change',reset);reset();
  },
  after:tx(`<p><b>So spielst du es durch:</b> Angreifer kopiert das Token → Tom macht nach „+5 Minuten“ einen API-Aufruf (Rotation, Toms RT1 ist verbraucht) → Angreifer erneuert mit seiner Kopie von RT1. Mit Rotation fliegt er auf und die Kette wird gesperrt. Schalte Rotation aus und wiederhole: Der Angreifer bekommt still und dauerhaft neue Access Tokens.</p>`,
`<p><b>How to play it:</b> attacker copies the token → after “+5 minutes” Tom makes an API call (rotation, Tom’s RT1 is used up) → attacker refreshes with their copy of RT1. With rotation they are caught and the chain is revoked. Turn rotation off and repeat: the attacker silently keeps getting new access tokens.</p>`),
  code:[{t:tx('Angular: angular-auth-oidc-client mit Refresh Tokens','Angular: angular-auth-oidc-client with refresh tokens'),lang:'ts',src:`provideAuth({
  config: {
    authority: 'https://login.nordwind.example/realms/nordwind',
    clientId: 'invoice-spa',
    responseType: 'code',
    scope: 'openid profile offline_access',
    silentRenew: true,
    useRefreshToken: true,   // renew via refresh token instead of an iframe
    renewTimeBeforeTokenExpiresInSeconds: 30,
  },
})`,note:tx('Im Identity Provider (Keycloak: Client-Einstellungen) Rotation einschalten. Ohne BFF liegt das Refresh Token im Browser – Rotation ist dann Pflicht.','Turn on rotation in the identity provider (Keycloak: client settings). Without a BFF the refresh token lives in the browser – rotation is mandatory then.')}],
  do:tx(['Access Tokens kurz, Refresh Tokens mit Rotation und Reuse Detection.','Eine maximale Lebensdauer setzen, nach der neu angemeldet werden muss.','Beim Logout das Refresh Token widerrufen.'],['Short access tokens, refresh tokens with rotation and reuse detection.','Set a maximum lifetime after which users must sign in again.','Revoke the refresh token on logout.']),
  dont:tx(['Refresh Tokens an die API schicken.','Refresh Tokens ohne Rotation im Browser speichern.','Bei jedem Fehler stumm neu erneuern – bei <code>invalid_grant</code> ist Schluss.'],['Send refresh tokens to the API.','Store refresh tokens in the browser without rotation.','Silently keep refreshing on every error – <code>invalid_grant</code> means stop.']),
  why:tx('<p>Kurze Access Tokens begrenzen den Schaden eines Diebstahls auf Minuten. Damit der Benutzer sich nicht alle fünf Minuten anmelden muss, gibt es das Refresh Token – das aber ist ein lohnendes Ziel. Rotation dreht den Spieß um: Der erste, der ein gestohlenes Token benutzt, verrät den Diebstahl.</p>','<p>Short access tokens limit the damage of theft to minutes. So users don’t have to sign in every five minutes, there’s the refresh token – which is a juicy target. Rotation turns the tables: the first one to use a stolen token gives the theft away.</p>')
});

LESSONS.push({
  id:'mfa-passkeys',cat:'basics',
  title:tx('MFA, TOTP und Passkeys','MFA, TOTP and passkeys'),
  short:tx('Mehr als ein Faktor – und warum Passkeys gegen Phishing gewinnen.','More than one factor – and why passkeys win against phishing.'),
  keys:'mfa 2fa multi faktor factor totp hotp authenticator passkey webauthn fido2 phishing step-up acr amr',
  refs:[['RFC 6238: TOTP','https://www.rfc-editor.org/rfc/rfc6238'],['passkeys.dev','https://passkeys.dev/'],['Spring Security 7: What’s New','https://docs.spring.io/spring-security/reference/whats-new.html']],
  rule:tx('Mehr-Faktor-Authentifizierung verlangt Nachweise aus mindestens zwei Kategorien: <b>Wissen</b> (Passwort), <b>Besitz</b> (Handy, Sicherheitsschlüssel), <b>Inhärenz</b> (Fingerabdruck). TOTP-Codes sind gut, aber phishbar. <b>Passkeys</b> (WebAuthn) sind an die Domain gebunden – auf einer gefälschten Seite funktionieren sie einfach nicht.','Multi-factor authentication requires proofs from at least two categories: <b>knowledge</b> (password), <b>possession</b> (phone, security key), <b>inherence</b> (fingerprint). TOTP codes are good but phishable. <b>Passkeys</b> (WebAuthn) are bound to the domain – on a fake site they simply don’t work.'),
  glance:{rows:[
    ['TOTP',tx('Time-based One-Time Password: HMAC aus geteiltem Secret und der aktuellen 30-Sekunden-Periode.','Time-based one-time password: HMAC of a shared secret and the current 30-second period.')],
    ['Passkey / WebAuthn',tx('Schlüsselpaar pro Website, privater Schlüssel bleibt im Gerät. Signiert eine Challenge, gebunden an den Origin.','Key pair per website, the private key stays on the device. Signs a challenge, bound to the origin.')],
    ['Step-up',tx('Für heikle Aktionen (Zahlung freigeben) einen stärkeren oder frischen Faktor verlangen.','Require a stronger or fresh factor for sensitive actions (approving a payment).')],

    [tx('MFA-Fatigue','MFA fatigue'),tx('Angreifer schicken so lange Push-Anfragen, bis jemand genervt bestätigt. Abhilfe: Zahlen abgleichen.','Attackers send push prompts until someone confirms out of annoyance. Fix: number matching.')]
  ]},
  body:tx(`<h3>Phishing-Resistenz im Vergleich</h3>
${table([tx('Verfahren','Method'),tx('Phishing','Phishing'),tx('Bemerkung','Note')],[
  [tx('Passwort','Password'),'<span class="no">phishbar</span>','Wird auf der falschen Seite eingetippt.'],
  ['SMS-Code','<span class="no">phishbar</span>','Dazu SIM-Swapping. NIST rät davon ab.'],
  ['TOTP-App','<span class="no">phishbar</span>','Der Code lässt sich in Echtzeit weiterreichen.'],
  ['Push mit Zahlenabgleich','<span class="meh">teilweise</span>','Schützt gegen MFA-Fatigue.'],

],{caption:'Phishing-Resistenz'})}
<p>Spring Security 7 bringt MFA in den Kern: Jeder abgeschlossene Faktor wird als eigene Authority vermerkt, und Regeln können verlangen, dass bestimmte Faktoren vorliegen. Bei einem externen Identity Provider ist MFA meist dessen Sache; deine API prüft dann <code>acr</code> oder <code>amr</code> im Token, etwa für Step-up bei Zahlungen.</p>`,
`<h3>Phishing resistance compared</h3>
${table(['Method','Phishing','Note'],[
  ['Password','<span class="no">phishable</span>','Typed into the wrong site.'],
  ['SMS code','<span class="no">phishable</span>','Plus SIM swapping. NIST advises against it.'],
  ['TOTP app','<span class="no">phishable</span>','The code can be relayed in real time.'],
  ['Push with number matching','<span class="meh">partly</span>','Protects against MFA fatigue.'],
  ['Passkey / FIDO2','<span class="yes">resistant</span>','The signature only works for the real domain.']
],{caption:'Phishing resistance'})}
<p>Spring Security 7 brings MFA into the core: each completed factor is recorded as its own authority, and rules can require certain factors to be present. With an external identity provider, MFA is usually its job; your API then checks <code>acr</code> or <code>amr</code> in the token, e.g. for step-up on payments.</p>`),
  demoHint:tx('Ein echter TOTP-Generator nach RFC 6238 – derselbe Code wie in einer Authenticator-App mit diesem Secret.','A real TOTP generator per RFC 6238 – the same code an authenticator app shows with this secret.'),
  demo:`<div class="two"><div class="panel"><h3>${tx('Server und App teilen dieses Secret','Server and app share this secret')}</h3><p class="mono" style="margin:0">JBSWY3DPEHPK3PXP</p><p class="hint">${tx('Beim Einrichten per QR-Code übertragen.','Transferred by QR code during setup.')}</p></div>
<div class="panel"><h3>${tx('Aktueller Code','Current code')}</h3><p style="margin:0;font:700 2rem/1.2 var(--font-mono);letter-spacing:.1em" id="totp-code">······</p><div class="bar" style="margin-top:8px"><span id="totp-bar"></span></div><p class="hint" id="totp-left"></p></div></div>
<div class="row"><div class="field"><label for="totp-in">${tx('Code eingeben (wie beim Login)','Enter code (as at login)')}</label><input class="input input-short" id="totp-in" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div><button type="button" class="btn btn-primary" id="totp-check">${tx('Prüfen','Verify')}</button></div><div id="totp-res" aria-live="polite"></div>`,
  init(root){
    const b32=s=>{const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const c of s)bits+=a.indexOf(c).toString(2).padStart(5,'0');const out=[];for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(out)};
    const keyP=crypto.subtle.importKey('raw',b32('JBSWY3DPEHPK3PXP'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    async function totp(step){const k=await keyP;const buf=new ArrayBuffer(8);const v=new DataView(buf);v.setUint32(4,step);v.setUint32(0,Math.floor(step/2**32));
      const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf));const o=h[19]&15;const n=((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6;return String(n).padStart(6,'0')}
    let last=-1;
    const tick=async()=>{const now=Date.now()/1000,step=Math.floor(now/30),left=30-Math.floor(now%30);
      if(step!==last){last=step;$('#totp-code',root).textContent=await totp(step)}
      $('#totp-bar',root).parentElement.style.setProperty('--p','');$('#totp-bar',root).style.width=(left/30*100)+'%';$('#totp-left',root).textContent=tx(`noch ${left} s gültig`,`valid for ${left} s`)};
    const id=setInterval(tick,1000);tick();
    $('#totp-check',root).addEventListener('click',async()=>{const v=$('#totp-in',root).value.trim(),step=Math.floor(Date.now()/30000);
      const ok=[step,step-1].map(totp);const [a,b]=await Promise.all(ok);
      $('#totp-res',root).innerHTML=v===a?verdict(true,tx('Code stimmt – zweiter Faktor bestanden.','Code matches – second factor passed.')):v===b?verdict(true,tx('Code der vorigen Periode – mit einem Schritt Toleranz noch akzeptiert.','Code from the previous period – still accepted with one step of tolerance.')):verdict(false,tx('Falscher Code.','Wrong code.'),tx('Server erlauben meist ± eine Periode und sperren nach wenigen Fehlversuchen.','Servers usually allow ± one period and lock after a few failed attempts.'))});
    return ()=>clearInterval(id);
  },
  code:[{t:tx('Spring: Step-up für Zahlungen über den acr-Claim','Spring: step-up for payments via the acr claim'),lang:'java',src:`@PreAuthorize("hasAuthority('invoice:pay') and @mfa.isStrong(authentication)")
public void pay(String invoiceId) { … }

@Component("mfa")
class MfaPolicy {
  boolean isStrong(Authentication auth) {
    return auth instanceof JwtAuthenticationToken jwt
        && List.of("mfa", "passkey").contains(jwt.getToken().getClaimAsString("acr"));
  }
}`,note:tx('Welche Werte im <code>acr</code>-Claim stehen, legt der Identity Provider fest (in Keycloak über „Authentication Flows“ und ACR-Zuordnungen). Fehlt der starke Faktor, antwortet die API mit 403 – das Frontend kann dann einen Login mit <code>acr_values</code> anstoßen.','The identity provider decides which values appear in the <code>acr</code> claim (in Keycloak via “authentication flows” and ACR mappings). If the strong factor is missing, the API answers 403 – the frontend can then start a login with <code>acr_values</code>.')}],
  do:tx(['MFA für alle anbieten, für Admins und Zahlungen verlangen.','Passkeys als Hauptweg anbieten.','Für heikle Aktionen Step-up statt dauerhaft hoher Hürden.'],['Offer MFA to everyone, require it for admins and payments.','Offer passkeys as the main path.','Use step-up for sensitive actions instead of permanently high hurdles.']),
  dont:tx(['SMS als einzigen zweiten Faktor anbieten.','Push-Bestätigungen ohne Zahlenabgleich.','Wiederherstellungscodes im Klartext speichern.'],['Offer SMS as the only second factor.','Push confirmations without number matching.','Store recovery codes in plain text.']),
  why:tx('<p>Die meisten Kontoübernahmen beginnen mit einem geleakten oder gephishten Passwort. Ein zweiter Faktor macht das Passwort allein wertlos – und ein Passkey macht Phishing zwecklos, weil der Browser die Signatur nur für die echte Domain erstellt.</p>','<p>Most account takeovers start with a leaked or phished password. A second factor makes the password alone worthless – and a passkey makes phishing pointless, because the browser only creates the signature for the real domain.</p>')
});

`${chain([['Tom','Resource owner'],['invoice-spa','Client','brand'],['Keycloak','Authorization server','warn'],['invoice-api','Resource server','brand']],['grants','requests token','token goes to'])}

  demoTitle:tx('Kurz geprüft','Quick check'),demoHint:tx('Welcher Grant Type passt?','Which grant type fits?'),

  refs:[['RFC 7636: PKCE','https://www.rfc-editor.org/rfc/rfc7636'],['OpenID Connect Core: Code Flow','https://openid.net/specs/openid-connect-core-1_0.html#CodeFlowAuth']],
  rule:tx('Die App schickt den Benutzer zum Identity Provider und bekommt einen kurzlebigen <b>Code</b> zurück, den sie gegen Tokens eintauscht. <b>PKCE</b> sichert diesen Tausch: Die App erzeugt vorher ein Geheimnis (<code>code_verifier</code>), schickt nur dessen Hash (<code>code_challenge</code>) mit und legt das Geheimnis erst beim Tausch vor. Ein abgefangener Code ist so wertlos.','The app sends the user to the identity provider and gets a short-lived <b>code</b> back, which it exchanges for tokens. <b>PKCE</b> secures this exchange: beforehand, the app creates a secret (<code>code_verifier</code>), sends only its hash (<code>code_challenge</code>) and presents the secret only during the exchange. An intercepted code is worthless that way.'),
  glance:{head:[tx('Parameter','Parameter'),tx('Zweck','Purpose')],rows:[
    ['<code>code_verifier</code>',tx('Zufallsstring (43–128 Zeichen), bleibt in der App bis zum Token-Tausch.','Random string (43–128 characters), stays in the app until the token exchange.')],

      const ch=b64u.encBytes(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));

  code:[{t:tx('Angular: Login anstoßen und Rücksprung verarbeiten','Angular: start login and handle the callback'),lang:'ts',src:`// app.config.ts
export const appConfig: ApplicationConfig = {

    provideHttpClient(withInterceptors([authInterceptor()])),

        useRefreshToken: true,

// anywhere: start the login

  why:tx('<p>Eine SPA kann kein Client Secret geheim halten – jeder kann den Code im Browser lesen. Ohne PKCE könnte also jeder, der einen Code abfängt (etwa über eine bösartige App mit derselben Redirect-URI auf dem Handy), ihn eintauschen. PKCE macht aus „wer den Code hat“ ein „wer den Code <i>und</i> den Verifier hat“ – und den Verifier hat nur die App, die den Login gestartet hat.</p>','<p>An SPA can’t keep a client secret – anyone can read the code in the browser. Without PKCE, anyone who intercepts a code (say via a malicious app with the same redirect URI on the phone) could exchange it. PKCE turns “whoever has the code” into “whoever has the code <i>and</i> the verifier” – and only the app that started the login has the verifier.</p>')
});

  do:tx(['ID Token für Anzeige und Session des Clients, Access Token für die API.','Endpunkte über Discovery beziehen statt hart zu kodieren.','Benutzer über <code>sub</code> (plus <code>iss</code>) identifizieren.'],['ID token for display and the client’s session, access token for the API.','Get endpoints via discovery instead of hard-coding them.','Identify users by <code>sub</code> (plus <code>iss</code>).']),

  why:tx('<p>OAuth wurde nie für Login gebaut, wurde aber jahrelang dafür missbraucht: „Wer ein Token für mein Profil hat, ist wohl ich.“ Das führte zu Lücken, weil ein Token für App A auch in App B eingeschleust werden konnte. OIDC repariert das mit einem Token, das ausdrücklich an <i>einen</i> Client adressiert ist und sagt, wann und wie die Anmeldung stattfand.</p>','<p>OAuth was never built for login, but was abused for it for years: “whoever has a token for my profile is probably me.” That led to holes, because a token for app A could be slipped into app B. OIDC fixes this with a token explicitly addressed to <i>one</i> client that says when and how the sign-in happened.</p>')
});

LESSONS.push({
  id:'scopes-vs-roles',cat:'protocols',
  title:tx('Scopes sind keine Rollen','Scopes are not roles'),
  short:tx('Was die App darf und was der Mensch darf – wirksam ist nur die Schnittmenge.','What the app may do and what the person may do – only the intersection is effective.'),
  keys:'scope scopes rollen roles berechtigung consent delegation schnittmenge intersection client permissions',
  refs:[['RFC 6749 §3.3: Access Token Scope','https://www.rfc-editor.org/rfc/rfc6749#section-3.3'],['Auth0: Scopes vs. Permissions','https://auth0.com/docs/get-started/apis/scopes']],
  rule:tx('Ein <b>Scope</b> begrenzt, was ein <i>Client</i> im Namen des Benutzers tun darf – etwa „nur lesen“. Eine <b>Rolle</b> beschreibt, was der <i>Benutzer</i> selbst darf. Die API muss beides prüfen: Wirksam ist nur, was der Scope erlaubt <b>und</b> der Benutzer darf. Ein Scope gibt niemals mehr Rechte, als der Mensch hat.','A <b>scope</b> limits what a <i>client</i> may do on the user’s behalf – say “read only”. A <b>role</b> describes what the <i>user</i> may do. The API must check both: only what the scope allows <b>and</b> the user may do is effective. A scope never grants more than the person has.'),
  glance:{rows:[
    ['Scope',tx('Grobe Grenze für die App, vom Benutzer bei der Zustimmung bestätigt. Etwa <code>invoices.read</code>.','Coarse limit for the app, confirmed by the user on consent. E.g. <code>invoices.read</code>.')],
    [tx('Rolle / Permission','Role / permission'),tx('Was der Mensch in der Organisation tun darf. Etwa <code>invoice:approve</code>.','What the person may do in the organization. E.g. <code>invoice:approve</code>.')],
    [tx('Effektives Recht','Effective right'),tx('Scope ∩ Rechte des Benutzers.','Scope ∩ the user’s permissions.')],

    [tx('Spring','Spring'),tx('Scopes werden zu Authorities <code>SCOPE_invoices.read</code>, Rollen meist zu <code>ROLE_…</code>.','Scopes become authorities <code>SCOPE_invoices.read</code>, roles usually <code>ROLE_…</code>.')]
  ]},

  do:tx(['Scopes grob halten (lesen/schreiben pro Bereich), Rechte fein in Rollen/Permissions.','In der API beides prüfen.','Drittanbieter-Apps nur mit Zustimmung und minimalen Scopes zulassen.'],['Keep scopes coarse (read/write per area), permissions fine-grained in roles/permissions.','Check both in the API.','Allow third-party apps only with consent and minimal scopes.']),

    [tx('Kosten','Cost'),tx('Ein Dienst mehr, Session-Speicher, CSRF-Schutz nötig.','One more service, session storage, CSRF protection needed.')]

],{caption:'SPA und BFF'})}`,
`${table(['','SPA as public client','BFF'],[
  ['Tokens in the browser','<span class="no">yes</span>','<span class="yes">no</span>'],
  ['Client secret','<span class="no">impossible</span>','<span class="yes">yes</span>'],
